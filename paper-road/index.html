<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lucky — Code with craft. Design with soul.</title>
<meta name="description" content="lucky portfolio — 边走边画的数字手艺人。 Code with craft. Design with soul." />
<style>
  :root {
    --paper: #ffffff;
    --ground: #f3f2ef;
    --ink: #18181a;
    --ink-soft: #8a8a90;
    --line-faint: #e6e5e3;
    --line-soft: #d9d8d5;
    --accent-lemon: #ffde59;
    --accent-orange: #ff9f43;
    --accent-sage: #70a07b;
    --font-display: "SF Pro Display", "Inter", -apple-system, "Segoe UI", sans-serif;
    --font-cjk: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-cjk);
    color: var(--ink);
    background: var(--ground);
    line-height: 1.75;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body.intro-lock { overflow: hidden; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
    mix-blend-mode: multiply;
  }

  a { color: inherit; text-decoration: none; }
  button {
    font: inherit; color: inherit; background: none; border: none; cursor: pointer;
  }

  /* ── Paper sheet ── */
  .sheet {
    position: relative;
    z-index: 1;
    background: var(--paper);
    max-width: 1200px;
    margin: 12px auto 24px;
    border: 1px solid var(--line-faint);
    border-radius: 36px;
    overflow: clip;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 24px 60px rgba(24,24,26,0.04);
  }

  /* ── Nav ── */
  .nav {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 8px 7px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid rgba(24,24,26,0.06);
    box-shadow: 0 10px 40px rgba(24, 24, 26, 0.06);
  }
  .nav-brand {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-display);
    font-weight: 600; font-size: 15px; letter-spacing: -0.03em;
    margin-right: 6px;
  }
  .nav-brand .logo { width: 16px; height: 16px; }
  .nav-links { display: flex; align-items: center; gap: 0; }
  .nav-links a, .nav-lang {
    font-family: var(--font-display);
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 8px 11px; border-radius: 999px;
    color: var(--ink-soft);
    transition: color .25s, background .25s;
    white-space: nowrap;
  }
  .nav-links a:hover, .nav-lang:hover {
    color: var(--ink); background: rgba(24,24,26,0.04);
  }
  .nav-lang {
    border: 1px solid var(--line-faint);
    margin-left: 4px;
    min-width: 54px;
    text-align: center;
  }

  /* ── Stage canvas ── */
  #stage {
    display: block;
    width: 100%;
    height: min(72vh, 640px);
    touch-action: none;
    cursor: default;
    background: var(--paper);
  }

  .hero-copy {
    text-align: center;
    padding: 12px 24px 8px;
    margin-top: -20px;
  }
  .hero-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(34px, 6.2vw, 72px);
    line-height: 1.08;
    letter-spacing: -0.035em;
  }
  .hero-title .zh {
    font-family: var(--font-cjk);
    font-weight: 500;
    letter-spacing: 0.06em;
    line-height: 1.4;
  }
  .hero-sub {
    margin-top: 18px;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .hero-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 28px 22px;
    flex-wrap: wrap;
  }
  .hero-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .ctrl-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid var(--line-faint);
    color: var(--ink-soft);
    transition: color .2s, border-color .2s, background .2s;
    background: var(--paper);
  }
  .ctrl-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .hero-hint {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    text-align: right;
    flex: 1;
    min-width: 200px;
  }

  .intro-ui {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 0 24px 18px;
  }
  .intro-ui.hidden { display: none; }
  .btn-setout {
    font-family: var(--font-display);
    font-weight: 600; font-size: 13px; letter-spacing: 0.08em;
    padding: 12px 32px; border-radius: 999px;
    background: var(--ink); color: var(--paper);
    transition: transform .25s cubic-bezier(.34,1.4,.64,1);
  }
  .btn-setout:hover { transform: scale(1.03); }
  .btn-skip {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.04em;
  }
  .btn-skip:hover { color: var(--ink); }

  /* ── Sections ── */
  .section {
    padding: 100px 56px 72px;
    max-width: 980px;
    margin: 0 auto;
  }
  .section-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    margin-bottom: 56px;
    gap: 12px;
  }
  .section-head .side {
    display: flex;
    align-items: center;
  }
  .section-head .side.right { justify-content: flex-end; }
  .section-head .center {
    text-align: center;
  }
  .hollow {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(42px, 8vw, 72px);
    letter-spacing: 0.02em;
    line-height: 0.95;
    color: transparent;
    -webkit-text-stroke: 1.6px var(--line-soft);
    text-stroke: 1.6px var(--line-soft);
    user-select: none;
  }
  .section-sub {
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.28em;
  }
  .text-link {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    transition: color .2s;
  }
  .text-link:hover { color: var(--ink); }

  /* Works */
  .works-featured {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 56px 48px;
    margin-bottom: 48px;
  }
  .work-card {
    display: block;
    border-radius: 24px;
    padding: 28px 28px 32px;
    transition: transform .4s cubic-bezier(.22,1,.36,1);
    position: relative;
  }
  .work-card:hover { transform: translateY(-3px); }
  .work-card.featured:nth-child(even) { margin-top: 56px; }
  .work-art {
    height: 160px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
  }
  .work-art svg { width: 180px; height: 130px; overflow: visible; }
  .work-title {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 600;
    letter-spacing: -0.03em;
  }
  .work-tagline {
    margin-top: 10px;
    font-size: 15px;
    line-height: 1.7;
  }
  .work-meta {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }
  .work-arrow {
    position: absolute; right: 28px; bottom: 28px;
    font-family: var(--font-display);
    font-size: 18px; color: var(--ink-soft);
    transition: transform .3s, color .3s;
  }
  .work-card:hover .work-arrow {
    transform: translate(3px,-3px);
    color: var(--ink);
  }
  .mascot-peek {
    position: absolute; top: -18px; right: 40px;
    width: 56px; height: 56px; pointer-events: none;
    filter: drop-shadow(0 2px 0 rgba(24,24,26,0.04));
  }

  .works-bento {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding-top: 8px;
    border-top: 1px solid var(--line-faint);
  }
  .work-card.bento {
    padding: 24px 20px 28px;
    margin-top: 16px;
  }
  .work-card.bento .work-art { height: 88px; margin-bottom: 16px; }
  .work-card.bento .work-art svg { width: 100px; height: 72px; }
  .work-card.bento .work-title { font-size: 18px; }
  .work-card.bento .work-tagline { font-size: 13px; color: var(--ink-soft); }
  .work-card.bento .work-arrow { right: 20px; bottom: 18px; font-size: 15px; }

  .works-empty {
    text-align: center; color: var(--ink-soft);
    padding: 56px; border: 1px dashed var(--line-faint); border-radius: 24px;
  }

  /* About */
  .about-manifesto {
    text-align: center;
    font-family: var(--font-display);
    font-size: clamp(22px, 3.2vw, 34px);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 72px;
  }
  .timeline {
    list-style: none;
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: "";
    position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 1px; background: var(--line-soft);
  }
  .timeline li {
    position: relative;
    padding: 0 0 52px 36px;
  }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: "";
    position: absolute; left: -33px; top: 8px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
  }
  .timeline .year {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--ink-soft);
    letter-spacing: 0.06em;
  }
  .timeline .event {
    margin-top: 6px;
    font-size: 16px;
    letter-spacing: 0.02em;
  }

  /* Notes — match reference layout */
  .notes-all { justify-self: end; }
  .note-row {
    display: grid;
    grid-template-columns: 120px 1fr 28px;
    gap: 20px;
    align-items: center;
    padding: 26px 8px;
    border-top: 1px solid var(--line-faint);
    transition: background .25s, padding .25s;
  }
  .note-row:last-child { border-bottom: 1px solid var(--line-faint); }
  .note-row:hover {
    background: rgba(24,24,26,0.015);
    padding-left: 14px;
  }
  .note-date {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  .note-title {
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .note-title.zh {
    font-family: var(--font-cjk);
    letter-spacing: 0.02em;
    font-size: 14px;
  }
  .note-arrow {
    font-family: var(--font-display);
    color: var(--ink-soft);
    font-size: 15px;
    transition: transform .25s, color .25s;
  }
  .note-row:hover .note-arrow {
    transform: translate(2px,-2px);
    color: var(--ink);
  }

  /* Waystation */
  .waystation { text-align: center; padding-top: 80px; }
  .mail-box {
    width: 100px; height: 100px;
    margin: 8px auto 28px;
  }
  .email-link {
    display: inline-block;
    font-family: var(--font-display);
    font-size: clamp(24px, 3.5vw, 36px);
    font-weight: 600;
    letter-spacing: -0.03em;
    padding-bottom: 6px;
    border-bottom: 1.5px solid var(--ink);
    transition: border-color .25s, color .25s;
  }
  .email-link:hover {
    color: var(--accent-orange);
    border-color: var(--accent-orange);
  }
  .socials {
    margin-top: 28px;
    display: flex; justify-content: center; gap: 28px;
  }
  .socials a {
    font-family: var(--font-display);
    font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .socials a:hover { color: var(--ink); }

  /* Open Road */
  .openroad {
    text-align: center;
    padding: 96px 24px 100px;
    border-top: 1px solid var(--line-faint);
  }
  .vanish {
    width: min(420px, 70%);
    height: 70px;
    margin-bottom: 28px;
  }
  .openroad-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 4.5vw, 48px);
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .openroad-title .zh {
    font-family: var(--font-cjk);
    letter-spacing: 0.12em;
    font-weight: 500;
  }
  .openroad-credit {
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); border: 0;
  }

  @media (max-width: 880px) {
    .sheet { margin: 0; border-radius: 0; border-left: none; border-right: none; }
    .section { padding: 72px 24px 56px; }
    .works-featured { grid-template-columns: 1fr; gap: 28px; }
    .work-card.featured:nth-child(even) { margin-top: 0; }
    .works-bento { grid-template-columns: 1fr 1fr; }
    .section-head {
      grid-template-columns: 1fr;
      justify-items: center;
      gap: 10px;
    }
    .section-head .side { justify-content: center !important; }
    .hero-bar { padding: 4px 18px 18px; }
    .hero-hint { text-align: left; }
  }
  @media (max-width: 540px) {
    .works-bento { grid-template-columns: 1fr; }
    .nav { left: 10px; right: 10px; transform: none; width: auto; max-width: none; overflow-x: auto; }
    .nav-links a { padding: 7px 8px; font-size: 10px; }
    .note-row { grid-template-columns: 92px 1fr 20px; gap: 8px; padding: 20px 4px; }
    .hero-title { font-size: clamp(28px, 9vw, 40px); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .work-card, .work-arrow, .note-arrow, .btn-setout, .note-row { transition: none; }
  }
</style>
</head>

<script>
(() => {
  "use strict";

  /* ═══════════ i18n ═══════════ */
  const I18N = {
    zh: {
      "nav.works": "作品", "nav.about": "关于", "nav.notes": "手记", "nav.contact": "联系",
      "hero.title": "用匠心写代码，<br>以灵魂做设计。",
      "hero.sub": "边走边画，把每天画得更新一点。",
      "hero.hint": "[左键] 跳跃 · [右键] 翻滚 ｜ [↺ 重绘] ｜ [⏸ 暂停]",
      "hero.hint.touch": "[轻点] 跳跃 · [下滑] 翻滚",
      "hero.setout": "出发", "hero.skip": "跳过出发",
      "hero.redraw": "↺ 重绘", "hero.pause": "⏸ 暂停", "hero.play": "▶ 继续",

  document.getElementById("lang-btn").addEventListener("click", () => {

  /* ═══════════ Canvas scene ═══════════ */
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1, baseY = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth || window.innerWidth;
    H = canvas.clientHeight || 640;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    baseY = H * 0.64;
  }
  window.addEventListener("resize", () => { resize(); });

  let seed = 20260215;
  const srand = (s) => { seed = s >>> 0; };
  const rnd = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const P = {
    gravity: 2200, jumpV: -820, rollDur: 0.55, speed: 175,
    bufferJump: 0.08, bufferRoll: 0.06, coyote: 0.08,
  };

  let cameraX = 0, paused = false;
  let mode = reduceMotion ? "await" : "camp";
  let modeT = 0;
  let pathPoints = [];
  let objects = [];   // pen-drawn scene objects
  let obstacles = [];
  let particles = [];
  let hills = [];
  let stumbleT = 0, jumpBuf = 0, coyote = 0;
  let jumping = false, rolling = 0, vy = 0, playerY = 0, spin = 0;

  function noise1(x) {
    const s = Math.sin(x * 12.9898 + 4.1) * 43758.5453;
    return (s - Math.floor(s)) * 2 - 1;
  }

  function terrainY(worldX) {
    const campEnd = 380;
    if (worldX < campEnd) {
      return baseY + 4 * Math.sin(worldX / 50) + noise1(worldX * 0.04);
    }
    const x = worldX - campEnd;
    let y =
      baseY +
      32 * Math.sin(x / 200) +
      14 * Math.sin(x / 58 + 1.1) +
      7 * Math.sin(x / 24 + 0.4);
    for (const o of obstacles) {
      const dx = worldX - o.x;
      if (dx > -o.w && dx < o.w) {
        const u = dx / o.w;
        const fall = Math.cos((u * Math.PI) / 2);
        if (o.type === "pit") y += 34 * fall * fall;
        if (o.type === "rock") y -= 24 * fall * fall;
      }
    }
    return y + noise1(worldX * 0.07) * 0.9;
  }
  const tangentAt = (wx) => (terrainY(wx + 4) - terrainY(wx - 4)) / 8;

  /* ── object stroke templates (local coords, y up from ground) ── */
  function objectStrokes(kind) {
    // each stroke: array of [x,y] local, y negative = up
    if (kind === "tree") return [
      [[0, 0], [0, -28]],
      [[-2, -28], [-12, -40], [-4, -52], [8, -50], [14, -38], [4, -28], [-2, -28]],
    ];
    if (kind === "cabin") return [
      [[-24, 0], [-24, -34], [24, -34], [24, 0], [-24, 0]],
      [[-28, -34], [0, -56], [28, -34]],
      [[-8, 0], [-8, -18], [8, -18], [8, 0]],
      [[-16, -24], [-16, -12], [-10, -12], [-10, -24]],
    ];
    if (kind === "mush") return [
      [[-5, 0], [-4, -12], [4, -12], [5, 0]],
      [[-14, -12], [-10, -24], [0, -28], [10, -24], [14, -12], [-14, -12]],
    ];
    if (kind === "flower") return [
      [[0, 0], [0, -14]],
      [[0, -14], [-6, -20], [0, -26], [6, -20], [0, -14]],
    ];
    if (kind === "sign") return [
      [[0, 0], [0, -36]],
      [[2, -34], [26, -34], [26, -18], [2, -18], [2, -34]],
      [[8, -26], [20, -26]],
    ];
    if (kind === "rock") return [
      [[-16, 0], [-18, -14], [-6, -26], [10, -24], [18, -10], [14, 0], [-16, 0]],
      [[-6, -10], [4, -16]],
    ];
    if (kind === "arch") return [
      [[-36, 0], [-36, -14], [-20, -36], [0, -44], [20, -36], [36, -14], [36, 0]],
      [[-24, 0], [-22, -10], [0, -28], [22, -10], [24, 0]],
    ];
    if (kind === "pit-edge") return [
      [[-18, 0], [-8, 6], [8, 6], [18, 0]],
    ];
    return [[[0, 0], [0, -10]]];
  }

  function strokeTotal(points) {
    let L = 0;
    for (let i = 1; i < points.length; i++) {
      const dx = points[i][0] - points[i - 1][0];
      const dy = points[i][1] - points[i - 1][1];
      L += Math.hypot(dx, dy);
    }
    return L;
  }

  /** draw polyline only up to `progress` (0-1) of total length */
  function drawStrokeReveal(pts, progress, ox, oy, scale) {
    if (progress <= 0) return;
    const total = strokeTotal(pts);
    if (total === 0) return;
    let remain = total * Math.min(1, progress);
    ctx.beginPath();
    ctx.moveTo(ox + pts[0][0] * scale, oy + pts[0][1] * scale);
    for (let i = 1; i < pts.length; i++) {
      const x0 = pts[i - 1][0], y0 = pts[i - 1][1];
      const x1 = pts[i][0], y1 = pts[i][1];
      const seg = Math.hypot(x1 - x0, y1 - y0);
      if (remain >= seg) {
        ctx.lineTo(ox + x1 * scale, oy + y1 * scale);
        remain -= seg;
      } else if (remain > 0) {
        const r = remain / seg;
        ctx.lineTo(ox + (x0 + (x1 - x0) * r) * scale, oy + (y0 + (y1 - y0) * r) * scale);
        remain = 0;
        break;
      } else break;
    }
    ctx.stroke();
  }

  function ensureWorld(xTo) {
    while (obstacles.length < 60) {
      const last = obstacles.length ? obstacles[obstacles.length - 1].x : 620;
      const x = last + 300 + rnd() * 340;
      if (x > xTo + 1400 && obstacles.length > 3) break;
      const r = rnd();
      if (x < 520) {
        // decorative only near camp start
        objects.push({
          x: x, kind: ["tree", "flower", "mush"][ (rnd()*3)|0 ],
          s: 0.85 + rnd() * 0.35, p: 0, on: false, strokes: null,
        });
        continue;
      }
      if (r < 0.2) {
        obstacles.push({ x, type: "pit", w: 32, h: 0 });
        objects.push({ x, kind: "rock", s: 0.9, p: 0, on: false, strokes: null, deco: true });
      } else if (r < 0.38) {
        obstacles.push({ x, type: "rock", w: 24, h: 26 });
        objects.push({ x, kind: "rock", s: 1, p: 0, on: false, strokes: null, solid: true });
      } else if (r < 0.55) {
        obstacles.push({ x, type: "low", w: 42, h: 44 });
        objects.push({ x, kind: "arch", s: 1, p: 0, on: false, strokes: null, solid: true });
      } else {
        const k = ["tree", "cabin", "mush", "flower", "sign"][(rnd() * 5) | 0];
        objects.push({ x, kind: k, s: 0.85 + rnd() * 0.4, p: 0, on: false, strokes: null });
        if (rnd() < 0.5) {
          objects.push({
            x: x + 50 + rnd() * 40,
            kind: ["tree", "flower", "mush"][(rnd() * 3) | 0],
            s: 0.8 + rnd() * 0.3, p: 0, on: false, strokes: null,
          });
        }
      }
    }
    while (hills.length < 20) {
      const last = hills.length ? hills[hills.length - 1].x : -180;
      hills.push({
        x: last + 240 + rnd() * 280,
        h: 36 + rnd() * 64,
        w: 110 + rnd() * 130,
        kind: rnd() < 0.22 ? "tower" : "hill",
      });
    }
    const penX = cameraX + W * 0.85;
    if (!pathPoints.length) pathPoints.push({ x: 0, y: terrainY(0) });
    let lastX = pathPoints[pathPoints.length - 1].x;
    while (lastX < penX + 16) {
      lastX += 6;
      pathPoints.push({ x: lastX, y: terrainY(lastX) });
      if (pathPoints.length > 2400) pathPoints.splice(0, 240);
    }
  }

  function resetWorld(newSeed) {
    srand(newSeed);
    cameraX = 0;
    pathPoints = [{ x: 0, y: terrainY(0) }];
    obstacles = [];
    objects = [
      { x: 70, kind: "cabin", s: 1.05, p: 1, on: true, strokes: null },
      { x: 160, kind: "tree", s: 1.1, p: 1, on: true, strokes: null },
      { x: 240, kind: "mush", s: 0.95, p: 1, on: true, strokes: null },
      { x: 300, kind: "sign", s: 1, p: 1, on: true, strokes: null },
      { x: 340, kind: "flower", s: 0.9, p: 1, on: true, strokes: null },
    ];
    hills = [];
    particles = [];
    playerY = 0; vy = 0; jumping = false; rolling = 0;
    stumbleT = 0; spin = 0;
    ensureWorld(cameraX + W + 200);
  }

  const playerWorldX = () => cameraX + W * 0.22;

  function emitParticles(x, y, n, burst) {
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2;
      const sp = burst ? 50 + rnd() * 90 : 18 + rnd() * 40;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: -Math.abs(Math.sin(a)) * sp * 0.6 - 8,
        life: 0.35 + rnd() * 0.25,
        t: 0, r: 0.5 + rnd() * 1.2,
        kind: rnd() < 0.22 ? "star" : "dot",
      });
    }
  }

  /** Reveal objects as the pen passes — pen draws them into existence */
  function revealByPen() {
    const penX = cameraX + W * 0.85;
    for (const o of objects) {
      if (!o.strokes) o.strokes = objectStrokes(o.kind);
      // start revealing shortly before pen arrives at object
      const trigger = o.x - 8;
      if (!o.on && penX > trigger) o.on = true;
      if (o.on && o.p < 1) {
        // reveal speed tied to pen speed
        o.p = Math.min(1, o.p + 0.035);
      }
    }
  }

  function drawPath() {
    if (pathPoints.length < 2) return;
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    let penDown = true;
    for (let i = 0; i < pathPoints.length; i++) {
      const p = pathPoints[i];
      const sx = p.x - cameraX;
      const sy = p.y;
      const gap = i > 0 && i % 19 === 0;
      if (gap) penDown = false;
      if (!penDown) { penDown = true; ctx.moveTo(sx, sy); }
      else if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }

  function drawHills(parallax) {
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "rgba(24,24,26,0.28)";
    for (const h of hills) {
      let x = (h.x - cameraX * parallax);
      // wrap in view
      const span = W + 500;
      x = ((x % span) + span) % span - 150;
      const y = baseY - 8;
      if (h.kind === "tower") {
        ctx.strokeRect(x, y - h.h, 14, h.h);
        ctx.beginPath();
        ctx.moveTo(x - 3, y - h.h); ctx.lineTo(x + 7, y - h.h - 12); ctx.lineTo(x + 17, y - h.h);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(x - h.w / 2, y);
        ctx.quadraticCurveTo(x, y - h.h, x + h.w / 2, y);
        ctx.stroke();
      }
    }
  }

  function drawObjects() {
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (const o of objects) {
      const sx = o.x - cameraX;
      if (sx < -100 || sx > W + 100) continue;
      if (o.p <= 0) continue;
      const sy = terrainY(o.x);
      if (!o.strokes) o.strokes = objectStrokes(o.kind);
      const sc = o.s || 1;
      // fill shapes lightly when fully drawn
      if (o.p > 0.85 && (o.kind === "cabin" || o.kind === "mush" || o.kind === "rock")) {
        ctx.save();
        ctx.globalAlpha = (o.p - 0.85) / 0.15 * 0.9;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        const pts = o.strokes[0];
        ctx.moveTo(sx + pts[0][0] * sc, sy + pts[0][1] * sc);
        for (let i = 1; i < pts.length; i++)
          ctx.lineTo(sx + pts[i][0] * sc, sy + pts[i][1] * sc);
        ctx.fill();
        ctx.restore();
      }
      if (o.kind === "mush" && o.p > 0.85) {
        ctx.save();
        ctx.globalAlpha = 0.15 * (o.p - 0.85) / 0.15;
        ctx.fillStyle = "#FF9F43";
        ctx.beginPath();
        const pts = o.strokes[1];
        ctx.moveTo(sx + pts[0][0] * sc, sy + pts[0][1] * sc);
        for (let i = 1; i < pts.length; i++)
          ctx.lineTo(sx + pts[i][0] * sc, sy + pts[i][1] * sc);
        ctx.fill();
        ctx.restore();
      }
      // progressive strokes
      for (let si = 0; si < o.strokes.length; si++) {
        // each stroke shares progress window
        const sp = Math.max(0, Math.min(1, (o.p - si * 0.12) / (1 - si * 0.05)));
        if (sp <= 0) continue;
        drawStrokeReveal(o.strokes[si], sp, sx, sy, sc);
      }
    }
  }

  function drawPen() {
    const penX = W * 0.85;
    const worldPen = cameraX + penX;
    const penY = terrainY(worldPen) - 1;
    const ang = Math.max(-0.24, Math.min(0.24, Math.atan(tangentAt(worldPen)) * 0.85));
    const bob = Math.sin(modeT * 14) * 0.7;

    ctx.save();
    ctx.translate(penX, penY + bob);
    ctx.rotate(ang - Math.PI / 2 + noise1(modeT * 22) * 0.012);
    const L = Math.min(H * 0.22, 150);

    ctx.lineWidth = 1.6;
    ctx.strokeStyle = "#18181A";
    ctx.lineJoin = "round";

    // body
    ctx.fillStyle = "#FFF3B0";
    ctx.beginPath();
    ctx.moveTo(-6.5, -L); ctx.lineTo(6.5, -L); ctx.lineTo(4.5, -14); ctx.lineTo(-4.5, -14);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // graphite tip
    ctx.fillStyle = "#E8D890";
    ctx.beginPath();
    ctx.moveTo(-4.5, -14); ctx.lineTo(4.5, -14); ctx.lineTo(0, 0); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // orange band
    ctx.fillStyle = "#FF9F43";
    ctx.beginPath();
    ctx.moveTo(-6.2, -L + 22); ctx.lineTo(6.2, -L + 22); ctx.lineTo(6, -L + 32); ctx.lineTo(-6, -L + 32);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // cap
    ctx.fillStyle = "#18181A";
    ctx.fillRect(-6.5, -L, 13, 7);
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = Math.max(0, a);
      if (p.kind === "star") {
        ctx.strokeStyle = "#FFDE59";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(p.x - 3, p.y); ctx.lineTo(p.x + 3, p.y);
        ctx.moveTo(p.x, p.y - 3); ctx.lineTo(p.x, p.y + 3);
        ctx.stroke();
      } else {
        ctx.fillStyle = "#18181A";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* refined mascots */
  function drawChestnut(x, y, squash) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1 + squash * 0.04, 1 - squash * 0.07);
    ctx.lineWidth = 1.35;
    ctx.strokeStyle = "#18181A";
    ctx.lineJoin = "round";
    // bag
    ctx.fillStyle = "#FFDE59";
    ctx.beginPath();
    ctx.roundRect(7, -32, 13, 16, 3);
    ctx.fill(); ctx.stroke();
    // body
    ctx.fillStyle = "#C9AD7C";
    ctx.beginPath();
    ctx.ellipse(0, -20, 15, 14, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // ears
    ctx.beginPath();
    ctx.arc(-9, -34, 4.5, 0, Math.PI * 2);
    ctx.arc(7, -36, 4.5, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // face
    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    ctx.arc(-4, -22, 1.3, 0, Math.PI * 2);
    ctx.arc(4, -22, 1.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#18181A";
    ctx.beginPath();
    ctx.arc(0, -18, 2.5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    // tail
    ctx.beginPath();
    ctx.moveTo(-13, -16);
    ctx.quadraticCurveTo(-24, -24, -18, -34);
    ctx.stroke();
    // feet
    ctx.beginPath();
    ctx.moveTo(-5, -7); ctx.lineTo(-7, 0);
    ctx.moveTo(5, -7); ctx.lineTo(7, 0);
    ctx.stroke();
    ctx.restore();
  }

  function drawCloudy(x, y, squash, time) {
    ctx.save();
    ctx.translate(x, y - Math.abs(Math.sin(time * 7)) * 1.5);
    ctx.scale(1 + squash * 0.04, 1 - squash * 0.07);
    ctx.lineWidth = 1.35;
    ctx.strokeStyle = "#18181A";
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.ellipse(0, -20, 14, 13, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(-11, -16, 4.5, 11, 0.35, 0, Math.PI * 2);
    ctx.ellipse(11, -16, 4.5, 11, -0.35, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    ctx.arc(-3.5, -22, 1.2, 0, Math.PI * 2);
    ctx.arc(4, -22, 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#18181A";
    ctx.beginPath();
    ctx.moveTo(-5, -7); ctx.lineTo(-6, 0);
    ctx.moveTo(5, -7); ctx.lineTo(6, 0);
    ctx.stroke();
    ctx.restore();
  }

  function drawKuro(x, y, squash, time) {
    ctx.save();
    ctx.translate(x, y);
    const step = Math.sin(time * 14) * 1.5;
    ctx.scale(1 + squash * 0.04, 1 - squash * 0.07);
    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    ctx.arc(0, -20, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(-3.5, -22, 2.2, 0, Math.PI * 2);
    ctx.arc(4.5, -22, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    ctx.arc(-3.5, -22, 1, 0, Math.PI * 2);
    ctx.arc(4.5, -22, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#18181A";
    ctx.lineWidth = 1.35;
    ctx.beginPath();
    ctx.moveTo(-3, -9); ctx.lineTo(-4 + step, 0);
    ctx.moveTo(4, -9); ctx.lineTo(5 - step, 0);
    ctx.stroke();
    ctx.restore();
  }

  function drawCampFire() {
    const fx = 110 - cameraX * 0.2;
    const fy = baseY;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.beginPath();
    ctx.moveTo(-16, 0); ctx.lineTo(16, -3);
    ctx.moveTo(-12, -3); ctx.lineTo(12, 2);
    ctx.stroke();
    const fl = 1 + Math.sin(modeT * 5) * 0.08;
    ctx.fillStyle = "#FF9F43";
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.quadraticCurveTo(-9, -16, 0, -34 * fl);
    ctx.quadraticCurveTo(9, -16, 0, -6);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#FFDE59";
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.quadraticCurveTo(-4, -14, 0, -22 * fl);
    ctx.quadraticCurveTo(4, -14, 0, -8);
    ctx.fill();
    ctx.restore();
  }

  function drawPlayerGroup() {
    const px = W * 0.22;
    const worldX = playerWorldX();
    const gy = terrainY(worldX) + playerY;
    const ang = Math.atan(tangentAt(worldX)) * 0.4;
    const squash = jumping && playerY < -20 ? 0.25 : rolling > 0 ? 0.45 : stumbleT > 0 ? 0.15 : 0;

    ctx.save();
    ctx.translate(px, gy);
    ctx.rotate(rolling > 0 ? spin : ang);

    if (rolling > 0) {
      ctx.save(); ctx.translate(-26, -10); ctx.rotate(spin * 1.15); drawChestnut(0, 0, 0.4); ctx.restore();
      ctx.save(); ctx.translate(0, -9); ctx.rotate(spin); drawCloudy(0, 0, 0.4, modeT); ctx.restore();
      ctx.save(); ctx.translate(24, -9); ctx.rotate(spin * 1.25); drawKuro(0, 0, 0.4, modeT); ctx.restore();
    } else {
      drawChestnut(-28, 0, squash);
      drawCloudy(0, 0, squash, modeT);
      drawKuro(28, 0, squash, modeT);
    }
    ctx.restore();

    if (jumping && playerY < -8) {
      ctx.strokeStyle = "rgba(24,24,26,0.28)";
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(px - 16 + i * 14, gy + 5, 7 + i, 0.2, Math.PI - 0.2);
        ctx.stroke();
      }
    }
    if (stumbleT > 0) {
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 + (1.5 - stumbleT) * 5;
        const sx = px + Math.cos(a) * 26;
        const sy = gy - 46 + Math.sin(a) * 10;
        ctx.strokeStyle = "#FFDE59";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(sx - 3.5, sy); ctx.lineTo(sx + 3.5, sy);
        ctx.moveTo(sx, sy - 3.5); ctx.lineTo(sx, sy + 3.5);
        ctx.stroke();
      }
    }
  }

  function collide() {
    if (mode !== "play" || stumbleT > 0) return;
    const wx = playerWorldX();
    const gy = terrainY(wx);
    const head = gy + playerY - (rolling > 0 ? 14 : 36);
    const feet = gy + playerY;
    for (const o of obstacles) {
      const dx = Math.abs(wx - o.x);
      if (dx > o.w) continue;
      if (o.type === "low") {
        const archBottom = terrainY(o.x) - 34;
        if (rolling <= 0 && head > archBottom + 6) { stun(); return; }
      } else if (o.type === "rock") {
        const top = terrainY(o.x) - o.h;
        if (feet > top + 6 && playerY > -o.h * 0.65) { stun(); return; }
      } else if (o.type === "pit") {
        if (Math.abs((wx - o.x) / o.w) < 0.7 && playerY > -6) { stun(); return; }
      }
    }
  }

  function stun() {
    stumbleT = 1.5;
    jumping = false; rolling = 0; playerY = 0; vy = 0;
    emitParticles(W * 0.22, terrainY(playerWorldX()) - 40, 6, true);
  }

  function doJump() {
    if (mode !== "play" || rolling > 0) return;
    if (jumping && playerY < -5) { jumpBuf = P.bufferJump; return; }
    if (coyote > 0 || playerY > -2) {
      vy = P.jumpV; jumping = true; jumpBuf = 0;
    } else jumpBuf = P.bufferJump;
  }

  function doRoll() {
    if (mode !== "play" || rolling > 0) return;
    rolling = P.rollDur; spin = 0;
  }

  function skipIntro() {
    if (mode === "play") return;
    mode = "play";
    modeT = 0;
    document.body.classList.remove("intro-lock");
    document.getElementById("intro-ui").classList.add("hidden");
    updateHint();
  }

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  let touchStart = null, lpTimer = 0;

  canvas.addEventListener("pointerdown", (e) => {
    if (e.button === 2) { e.preventDefault(); skipIntro(); doRoll(); return; }
    if (e.button !== 0) return;
    skipIntro();
    if (e.pointerType === "touch") {
      touchStart = { x: e.clientX, y: e.clientY, t: performance.now() };
      return;
    }
    lpTimer = window.setTimeout(() => { if (mode === "play") doRoll(); }, 200);
    doJump();
  });
  canvas.addEventListener("pointerup", (e) => {
    clearTimeout(lpTimer);
    if (!touchStart || e.pointerType !== "touch") return;
    const dx = e.clientX - touchStart.x;
    const dy = e.clientY - touchStart.y;
    const dt = performance.now() - touchStart.t;
    touchStart = null;
    if (dy > 36 && Math.abs(dx) < 50) doRoll();
    else if (dt < 320) doJump();
  });
  window.addEventListener("pointerup", () => clearTimeout(lpTimer));

  window.addEventListener("keydown", (e) => {
    if (e.code === "Escape") { skipIntro(); return; }
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault(); skipIntro(); doJump(); return;
    }
    if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyS" || e.code === "ArrowDown") {
      e.preventDefault(); skipIntro(); doRoll(); return;
    }
    if (mode === "camp" || mode === "depart") skipIntro();
  });

  document.getElementById("btn-skip").addEventListener("click", skipIntro);
  document.getElementById("btn-setout").addEventListener("click", skipIntro);
  document.getElementById("btn-redraw").addEventListener("click", () => {
    resetWorld((Math.random() * 1e9) | 0);
    emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 6, 8, true);
  });
  document.getElementById("btn-pause").addEventListener("click", () => {
    paused = !paused;
    window.__paused = paused;
    document.getElementById("btn-pause").textContent = paused ? t("hero.play") : t("hero.pause");
  });

  window.addEventListener("scroll", () => {
    if (mode === "camp" || mode === "depart") skipIntro();
  }, { passive: true });
  window.addEventListener("wheel", () => {
    if (mode === "camp" || mode === "depart") skipIntro();
  }, { passive: true });

  /* ── loop ── */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    modeT += dt;

    if (!paused) {
      if (mode === "camp") {
        // rest at camp; gentle reveal of camp objects
        revealByPen();
        if (modeT > 2.0) { mode = "depart"; modeT = 0; }
      } else if (mode === "depart") {
        cameraX += P.speed * 0.4 * dt;
        ensureWorld(cameraX + W + 200);
        revealByPen();
        if (rnd() < 0.4) emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 2, 1, false);
        if (modeT > 4.0) skipIntro();
      } else if (mode === "play" || mode === "await") {
        if (mode === "play") {
          cameraX += P.speed * dt;
          ensureWorld(cameraX + W * 1.3);
          revealByPen();

          if (jumpBuf > 0) {
            jumpBuf -= dt;
            if (playerY > -2) doJump();
          }
          if (rolling > 0) {
            rolling -= dt;
            spin += Math.PI * 4 * dt;
            if (rolling <= 0) spin = 0;
          }
          if (jumping || playerY < 0) {
            vy += P.gravity * dt;
            playerY += vy * dt;
            if (playerY >= 0) { playerY = 0; vy = 0; jumping = false; coyote = P.coyote; }
          } else coyote -= dt;

          if (stumbleT > 0) {
            stumbleT -= dt;
            if (stumbleT < 0.7) cameraX += P.speed * 0.3 * dt;
          }
          if (rnd() < dt * 4) emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 2, 1, false);
          collide();
        } else {
          revealByPen();
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t > p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt;
    }

    baseY = H * 0.64;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, W, H);

    // soft clouds
    ctx.strokeStyle = "rgba(24,24,26,0.18)";
    ctx.lineWidth = 1.1;
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 190 - cameraX * 0.07) % (W + 180)) - 40;
      const cy = 48 + (i % 3) * 30;
      ctx.beginPath();
      ctx.arc(cx, cy, 11, 0.25, Math.PI - 0.25);
      ctx.arc(cx + 14, cy - 3, 10, 0.3, Math.PI - 0.3);
      ctx.arc(cx + 26, cy, 8, 0.35, Math.PI - 0.35);
      ctx.stroke();
    }

    drawHills(0.2);
    if (cameraX < 480) drawCampFire();
    drawPath();          // ground first
    drawObjects();       // pen-drawn trees/houses/rocks/arches
    drawPen();

    if (mode !== "camp") drawPlayerGroup();
    else {
      const gy = terrainY(150);
      drawChestnut(130, gy, 0);
      drawCloudy(164, gy, 0, 0.3);
      drawKuro(196, gy, 0, 0.3);
    }
    drawParticles();

    requestAnimationFrame(frame);
  }

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      const rr = typeof r === "number" ? r : 3;
      this.moveTo(x + rr, y);
      this.arcTo(x + w, y, x + w, y + h, rr);
      this.arcTo(x + w, y + h, x, y + h, rr);
      this.arcTo(x, y + h, x, y, rr);
      this.arcTo(x, y, x + w, y, rr);
      this.closePath();
      return this;
    };
  }

  // boot
  resize();
  srand(seed);
  resetWorld(seed);
  applyI18n();

  const introUI = document.getElementById("intro-ui");
  if (reduceMotion) {
    introUI.classList.remove("hidden");
    document.getElementById("btn-skip").style.display = "none";
  } else {
    document.body.classList.add("intro-lock");
    introUI.classList.remove("hidden");
    document.getElementById("btn-setout").style.display = "none";
    document.getElementById("hero-hint").textContent = t("hero.skipping");
  }

  requestAnimationFrame(frame);
  window.__lucky = { resetWorld, skipIntro, get mode() { return mode; } };
})();
</script>
</body>
</html>
