<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lucky — Code with craft. Design with soul.</title>
<meta name="description" content="lucky portfolio — 边走边画的数字手艺人。 Code with craft. Design with soul." />
<style>
  :root {
    --paper: #ffffff;
    --ground: #f3f2ef;
    --ink: #18181a;
    --ink-soft: #8a8a90;
    --line-faint: #e6e5e3;
    --line-soft: #d9d8d5;
    --accent-lemon: #ffde59;
    --accent-orange: #ff9f43;
    --accent-sage: #70a07b;
    --font-display: "SF Pro Display", "Inter", -apple-system, "Segoe UI", sans-serif;
    --font-cjk: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-cjk);
    color: var(--ink);
    background: var(--ground);
    line-height: 1.75;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body.intro-lock { overflow: hidden; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
    mix-blend-mode: multiply;
  }

  a { color: inherit; text-decoration: none; }
  button {
    font: inherit; color: inherit; background: none; border: none; cursor: pointer;
  }

  /* ── Paper sheet ── */
  .sheet {
    position: relative;
    z-index: 1;
    background: var(--paper);
    max-width: 1200px;
    margin: 12px auto 24px;
    border: 1px solid var(--line-faint);
    border-radius: 36px;
    overflow: clip;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 24px 60px rgba(24,24,26,0.04);
  }

  /* ── Nav ── */
  .nav {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 8px 7px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid rgba(24,24,26,0.06);
    box-shadow: 0 10px 40px rgba(24, 24, 26, 0.06);
  }
  .nav-brand {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-display);
    font-weight: 600; font-size: 15px; letter-spacing: -0.03em;
    margin-right: 6px;
  }
  .nav-brand .logo { width: 16px; height: 16px; }
  .nav-links { display: flex; align-items: center; gap: 0; }
  .nav-links a, .nav-lang {
    font-family: var(--font-display);
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 8px 11px; border-radius: 999px;
    color: var(--ink-soft);
    transition: color .25s, background .25s;
    white-space: nowrap;
  }
  .nav-links a:hover, .nav-lang:hover {
    color: var(--ink); background: rgba(24,24,26,0.04);
  }
  .nav-lang {
    border: 1px solid var(--line-faint);
    margin-left: 4px;
    min-width: 54px;
    text-align: center;
  }

  /* ── Stage canvas ── */
  #stage {
    display: block;
    width: 100%;
    height: min(72vh, 640px);
    touch-action: none;
    cursor: default;
    background: var(--paper);
  }

  .hero-copy {
    text-align: center;
    padding: 12px 24px 8px;
    margin-top: -20px;
  }
  .hero-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(34px, 6.2vw, 72px);
    line-height: 1.08;
    letter-spacing: -0.035em;
  }
  .hero-title .zh {
    font-family: var(--font-cjk);
    font-weight: 500;
    letter-spacing: 0.06em;
    line-height: 1.4;
  }
  .hero-sub {
    margin-top: 18px;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .hero-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 28px 22px;
    flex-wrap: wrap;
  }
  .hero-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .ctrl-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid var(--line-faint);
    color: var(--ink-soft);
    transition: color .2s, border-color .2s, background .2s;
    background: var(--paper);
  }
  .ctrl-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .hero-hint {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    text-align: right;
    flex: 1;
    min-width: 200px;
  }

  .intro-ui {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 0 24px 18px;
  }
  .intro-ui.hidden { display: none; }
  .btn-setout {
    font-family: var(--font-display);
    font-weight: 600; font-size: 13px; letter-spacing: 0.08em;
    padding: 12px 32px; border-radius: 999px;
    background: var(--ink); color: var(--paper);
    transition: transform .25s cubic-bezier(.34,1.4,.64,1);
  }
  .btn-setout:hover { transform: scale(1.03); }
  .btn-skip {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.04em;
  }
  .btn-skip:hover { color: var(--ink); }

  /* ── Sections ── */
  .section {
    padding: 100px 56px 72px;
    max-width: 980px;
    margin: 0 auto;
    scroll-margin-top: 88px;
  }
  .openroad { scroll-margin-top: 88px; }
  .section-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    margin-bottom: 56px;
    gap: 12px;
  }
  .section-head .side {
    display: flex;
    align-items: center;
  }
  .section-head .side.right { justify-content: flex-end; }
  .section-head .center {
    text-align: center;
  }
  .hollow {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(42px, 8vw, 72px);
    letter-spacing: 0.02em;
    line-height: 0.95;
    color: transparent;
    -webkit-text-stroke: 1.6px var(--line-soft);
    text-stroke: 1.6px var(--line-soft);
    user-select: none;
  }
  .section-sub {
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.28em;
  }
  .text-link {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    transition: color .2s;
  }
  .text-link:hover { color: var(--ink); }

  /* Works */
  .works-featured {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 56px 48px;
    margin-bottom: 48px;
  }
  .work-card {
    display: block;
    border-radius: 24px;
    padding: 28px 28px 32px;
    transition: transform .4s cubic-bezier(.22,1,.36,1);
    position: relative;
  }
  .work-card:hover { transform: translateY(-3px); }
  .work-card.featured:nth-child(even) { margin-top: 56px; }
  .work-art {
    height: 160px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
  }
  .work-art svg { width: 180px; height: 130px; overflow: visible; }
  .work-title {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 600;
    letter-spacing: -0.03em;
  }
  .work-tagline {
    margin-top: 10px;
    font-size: 15px;
    line-height: 1.7;
  }
  .work-meta {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }
  .work-arrow {
    position: absolute; right: 28px; bottom: 28px;
    font-family: var(--font-display);
    font-size: 18px; color: var(--ink-soft);
    transition: transform .3s, color .3s;
  }
  .work-card:hover .work-arrow {
    transform: translate(3px,-3px);
    color: var(--ink);
  }
  .mascot-peek {
    position: absolute; top: -18px; right: 40px;
    width: 56px; height: 56px; pointer-events: none;
    filter: drop-shadow(0 2px 0 rgba(24,24,26,0.04));
  }

  .works-bento {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding-top: 8px;
    border-top: 1px solid var(--line-faint);
  }
  .work-card.bento {
    padding: 24px 20px 28px;
    margin-top: 16px;
  }
  .work-card.bento .work-art { height: 88px; margin-bottom: 16px; }
  .work-card.bento .work-art svg { width: 100px; height: 72px; }
  .work-card.bento .work-title { font-size: 18px; }
  .work-card.bento .work-tagline { font-size: 13px; color: var(--ink-soft); }
  .work-card.bento .work-arrow { right: 20px; bottom: 18px; font-size: 15px; }

  .works-empty {
    text-align: center; color: var(--ink-soft);
    padding: 56px; border: 1px dashed var(--line-faint); border-radius: 24px;
  }

  /* About */
  .about-manifesto {
    text-align: center;
    font-family: var(--font-display);
    font-size: clamp(22px, 3.2vw, 34px);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 72px;
  }
  .timeline {
    list-style: none;
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: "";
    position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 1px; background: var(--line-soft);
  }
  .timeline li {
    position: relative;
    padding: 0 0 52px 36px;
  }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: "";
    position: absolute; left: -33px; top: 8px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
  }
  .timeline .year {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--ink-soft);
    letter-spacing: 0.06em;
  }
  .timeline .event {
    margin-top: 6px;
    font-size: 16px;
    letter-spacing: 0.02em;
  }

  /* Notes — match reference layout */
  .notes-all { justify-self: end; }
  .note-row {
    display: grid;
    grid-template-columns: 120px 1fr 28px;
    gap: 20px;
    align-items: center;
    padding: 26px 8px;
    border-top: 1px solid var(--line-faint);
    transition: background .25s, padding .25s;
  }
  .note-row:last-child { border-bottom: 1px solid var(--line-faint); }
  .note-row:hover {
    background: rgba(24,24,26,0.015);
    padding-left: 14px;
  }
  .note-date {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  .note-title {
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .note-title.zh {
    font-family: var(--font-cjk);
    letter-spacing: 0.02em;
    font-size: 14px;
  }
  .note-arrow {
    font-family: var(--font-display);
    color: var(--ink-soft);
    font-size: 15px;
    transition: transform .25s, color .25s;
  }
  .note-row:hover .note-arrow {
    transform: translate(2px,-2px);
    color: var(--ink);
  }

  /* Waystation */
  .waystation { text-align: center; padding-top: 80px; }
  .mailbox-wrap {
    position: relative;
    width: 112px; height: 112px;
    margin: 10px auto 30px;
  }
  .mail-box { width: 112px; height: 112px; overflow: visible; display: block; }
  .mb-star { opacity: 0; }
  .mailbox-wrap:hover .mb-star {
    animation: starPop .85s cubic-bezier(.34,1.56,.64,1) 1 forwards;
  }
  @keyframes starPop {
    0%   { opacity: 0; transform: translate(0, 4px) scale(.3); }
    35%  { opacity: 1; }
    100% { opacity: 0; transform: translate(0, -18px) scale(1); }
  }
  .email-link {
    display: inline-block;
    font-family: var(--font-display);
    font-size: clamp(24px, 3.5vw, 36px);
    font-weight: 600;
    letter-spacing: -0.03em;
    padding-bottom: 6px;
    border-bottom: 1.5px solid var(--ink);
    transition: border-color .25s, color .25s;
  }
  .email-link:hover {
    color: var(--accent-orange);
    border-color: var(--accent-orange);
  }
  .socials {
    margin-top: 28px;
    display: flex; justify-content: center; gap: 28px;
  }
  .socials a {
    font-family: var(--font-display);
    font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .socials a:hover { color: var(--ink); }

  /* Open Road */
  .openroad {
    text-align: center;
    padding: 96px 24px 100px;
    border-top: 1px solid var(--line-faint);
  }
  .vanish {
    width: min(420px, 70%);
    height: 70px;
    margin-bottom: 28px;
  }
  .openroad-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 4.5vw, 48px);
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .openroad-title .zh {
    font-family: var(--font-cjk);
    letter-spacing: 0.12em;
    font-weight: 500;
  }
  .openroad-credit {
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); border: 0;
  }

  /* ── 滚动描出：进入视口后一笔画出 ── */
  .js .rv {
    opacity: 0; transform: translateY(16px);
    transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);
    transition-delay: var(--rvd, 0s);
  }
  .js .rv.in { opacity: 1; transform: none; }
  /* 空心标题由未被裁剪的父容器触发描出（clip-path 会令 IO 交叉比恒为 0） */
  .js .hollow {
    clip-path: inset(-30% 100% -30% -6px);
    transition: clip-path .9s cubic-bezier(.4,0,.2,1) .15s;
  }
  .js .section-head.in .hollow { clip-path: inset(-30% -6px -30% -6px); }

  .hint-pulse { animation: hintPulse 1.8s ease 1; }
  @keyframes hintPulse {
    0% { opacity: .5 } 30% { opacity: 1 } 50% { opacity: .55 }
    70% { opacity: 1 } 100% { opacity: .8 }
  }

  .work-art svg { transition: transform .55s cubic-bezier(.34,1.56,.64,1); }
  .work-card:hover .work-art svg { transform: translateY(-5px) rotate(-2deg); }
  .js .work-card.in:hover { transform: translateY(-3px); }
  .mascot-peek { transform-origin: 30% 100%; }
  .work-card:hover .mascot-peek {
    animation: peekKnock 1.1s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes peekKnock {
    0% { transform: rotate(0); }
    30% { transform: rotate(-10deg); }
    55% { transform: rotate(7deg); }
    78% { transform: rotate(-4deg); }
    100% { transform: rotate(0); }
  }

  @media (max-width: 880px) {
    .sheet { margin: 0; border-radius: 0; border-left: none; border-right: none; }
    .section { padding: 72px 24px 56px; }
    .works-featured { grid-template-columns: 1fr; gap: 28px; }
    .work-card.featured:nth-child(even) { margin-top: 0; }
    .works-bento { grid-template-columns: 1fr 1fr; }
    .section-head {
      grid-template-columns: 1fr;
      justify-items: center;
      gap: 10px;
    }
    .section-head .side { justify-content: center !important; }
    .hero-bar { padding: 4px 18px 18px; }
    .hero-hint { text-align: left; }
  }
  @media (max-width: 540px) {
    .works-bento { grid-template-columns: 1fr; }
    .nav { left: 10px; right: 10px; transform: none; width: auto; max-width: none; overflow-x: auto; }
    .nav-links a { padding: 7px 8px; font-size: 10px; }
    .note-row { grid-template-columns: 92px 1fr 20px; gap: 8px; padding: 20px 4px; }
    .hero-title { font-size: clamp(28px, 9vw, 40px); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .work-card, .work-arrow, .note-arrow, .btn-setout, .note-row { transition: none; }
    .js .rv { opacity: 1; transform: none; transition: none; }
    .js .hollow { clip-path: none; transition: none; }
    .work-art svg { transition: none; }
    .mailbox-wrap:hover .mb-star,
    .work-card:hover .mascot-peek,
    .work-card:hover .work-art svg,
    .hint-pulse { animation: none; }
  }
</style>
</head>
<body class="intro-lock">

<nav class="nav" aria-label="Primary">
  <div class="nav-brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3.5 17.5c5-1.5 8.5-6 14-14" stroke="#18181A" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M15 3.2l5.2 1.3-1.3 5.2" stroke="#18181A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3.5 17.5c1.3 1.5 3 1.8 5 1" stroke="#FF9F43" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span>lucky</span>
  </div>
  <div class="nav-links">
    <a href="#works" data-i18n="nav.works">作品</a>
    <a href="#about" data-i18n="nav.about">关于</a>
    <a href="#notes" data-i18n="nav.notes">手记</a>
    <a href="#contact" data-i18n="nav.contact">联系</a>
  </div>
  <button class="nav-lang" id="lang-btn" type="button" aria-label="Switch language">中 / EN</button>
</nav>

<div class="sheet">
  <canvas id="stage" aria-label="Interactive road scene" role="img"></canvas>

  <header class="hero" id="hero">
    <div class="hero-copy">
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-sub" id="hero-sub"></p>
    </div>
    <div class="intro-ui hidden" id="intro-ui">
      <button class="btn-setout" id="btn-setout" type="button" data-i18n="hero.setout">出发</button>
      <button class="btn-skip" id="btn-skip" type="button" data-i18n="hero.skip">跳过出发</button>
    </div>
    <div class="hero-bar">
      <div class="hero-controls">
        <button class="ctrl-btn" id="btn-redraw" type="button">↺ 重绘</button>
        <button class="ctrl-btn" id="btn-pause" type="button">⏸ 暂停</button>
      </div>
      <p class="hero-hint" id="hero-hint"></p>
    </div>
    <p class="sr-only" id="a11y-controls"></p>
  </header>

  <section class="section" id="works">
    <div class="section-head rv">
      <div class="side"></div>
      <div class="center">
        <h2 class="hollow">WORKS</h2>
        <p class="section-sub" data-i18n="works.sub">精选项目</p>
      </div>
      <div class="side right"></div>
    </div>
    <div class="works-featured" id="works-featured"></div>
    <div class="works-bento" id="works-bento"></div>
  </section>

  <section class="section" id="about">
    <div class="section-head rv">
      <div class="side"></div>
      <div class="center">
        <h2 class="hollow">ABOUT</h2>
        <p class="section-sub" data-i18n="about.sub">路上的人</p>
      </div>
      <div class="side right"></div>
    </div>
    <p class="about-manifesto rv" data-i18n="about.manifesto">路是边走边画出来的。</p>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section class="section" id="notes">
    <div class="section-head rv">
      <div class="side"></div>
      <div class="center">
        <h2 class="hollow">NOTES</h2>
        <p class="section-sub" data-i18n="notes.sub">制作笔记</p>
      </div>
      <div class="side right">
        <a class="text-link notes-all" href="#" data-i18n="notes.all">阅读全部 ↗</a>
      </div>
    </div>
    <div id="notes-list"></div>
  </section>

  <section class="section waystation" id="contact">
    <div class="section-head rv">
      <div class="side"></div>
      <div class="center">
        <h2 class="hollow">CONTACT</h2>
        <p class="section-sub" data-i18n="contact.sub">寄一张明信片</p>
      </div>
      <div class="side right"></div>
    </div>
    <div class="mailbox-wrap rv">

      const title = (w.title && (w.title[lang] || w.title.en)) || w.id;

  function renderTimeline() {

  function renderNotes() {

  document.getElementById("lang-btn").addEventListener("click", () => {

  document.body.classList.add("js");

  /* ── 滚动描出：进入视口后一笔画出 ── */
  const revealIO = "IntersectionObserver" in window
    ? new IntersectionObserver((entries) => {
        for (const en of entries) {
          if (en.isIntersecting) {
            en.target.classList.add("in");
            revealIO.unobserve(en.target);
          }
        }
      }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" })
    : null;
  const revealedSet = new WeakSet();
  function bindReveals() {
    document.querySelectorAll(".rv:not(.in)").forEach((el) => {
      if (revealedSet.has(el)) return;
      revealedSet.add(el);
      if (!revealIO) { el.classList.add("in"); return; }
      revealIO.observe(el);
    });
  }

  /* ═══════════ Canvas scene ═══════════ */
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1, baseY = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth || window.innerWidth;
    H = canvas.clientHeight || 640;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    baseY = H * 0.64;
  }
  window.addEventListener("resize", () => { resize(); });

  })();
  const srand = (s) => { seed = s >>> 0; };
  const rnd = () => {

  let departBlend = 0;    // 角色从营地休息位自然融入行进队形

  let hintPulsed = false;
  let stageVisible = true;

  // 平滑值噪声（手绘抖动），替代毛糙的白噪声
  function hash1(i) {
    const s = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function noise1(x) {
    const i = Math.floor(x), f = x - i;
    const u = f * f * (3 - 2 * f);
    return (hash1(i) * (1 - u) + hash1(i + 1) * u) * 2 - 1;
  }

  function terrainY(worldX) {
    // 自然缓坡 + 微小有机起伏（对齐参考图连续手绘感）
    let y = baseY + 10 * Math.sin(worldX / 320) + 4 * Math.sin(worldX / 110 + 0.7);
    for (const o of obstacles) {
      const dx = worldX - o.x;
      const hw = o.w;
      if (dx > -hw && dx < hw) {
        const u = dx / hw; // -1..1
        const bell = Math.cos((u * Math.PI) / 2); // 0 at edges, 1 center
        if (o.type === "pit" || o.type === "stream") y += (o.depth || 22) * bell * bell;
        if (o.type === "valley") y += 18 * bell * bell;
        if (o.type === "rock" || o.type === "stone") y -= (o.h || 14) * bell * bell;
        if (o.type === "mud") y += 10 * bell * bell;
      }
    }
    // 小尺度手绘抖动
    return y + noise1(worldX * 0.11) * 0.7 + noise1(worldX * 0.03) * 0.5;
  }
  const tangentAt = (wx) => (terrainY(wx + 4) - terrainY(wx - 4)) / 8;

  /* ── 一笔画场景 ──

  function objectStrokes(kind) {

    // 小店：一笔墙 + 波浪雨棚 + 门
    if (kind === "shop") return [[

    // 石桥外轮廓（一笔）；洞口内缘在 back 第二笔仅作内线
    if (kind === "bridge") return [[
      [-38, 0], [-38, -10], [-30, -24], [-12, -34], [12, -34], [30, -24], [38, -10], [38, 0],

    // 山洞外轮廓（一笔）
    if (kind === "cave") return [[

    // 山坡

    // 小溪水纹（一笔）

    // 山谷底线

    // 花丛：一笔连画三朵

      [8, -1], [8, -9], [5, -12], [8, -15], [11, -12], [8, -9],

    // 石头：一笔闭合
    if (kind === "stone") return [[

    ]];
    // 土坑
    if (kind === "mud") return [[

    // 蘑菇：一笔
    if (kind === "mush") return [[

    // 木箱：一笔箱体 + 加固线
    if (kind === "crate") return [[
      [-14, 0], [-14, -18], [14, -18], [14, 0], [-14, 0],
      [-14, -9], [14, -9], [10, -18], [10, 0], [-10, 0], [-10, -18],
    ]];
    // 指路牌：牌面一笔 + Next→ 箭头（不写 Finish，文档 §5.1）
    if (kind === "sign") return [
      [[-2, 0], [-2, -26], [-16, -26], [-16, -38], [16, -38], [16, -26], [5, -26], [5, 0]],
      [[-9, -32], [7, -32], [2.5, -35.5], [7, -32], [2.5, -28.5]],

    return [[[0, 0], [0, -8]]];
  }

  /** 前景遮挡：滑行时压住角色（白填充 + 轮廓） */
  function objectFrontStrokes(kind) {
    if (kind === "bridge") {
      // 桥体实体：外拱与内拱之间填白
      return [{
        fill: [[
          [-38, 0], [-38, -10], [-30, -24], [-12, -34], [12, -34], [30, -24], [38, -10], [38, 0],
          [26, 0], [26, -8], [14, -16], [0, -20], [-14, -16], [-26, -8], [-26, 0], [-38, 0],
        ]],
        stroke: [
          [[-38, 0], [-38, -10], [-30, -24], [-12, -34], [12, -34], [30, -24], [38, -10], [38, 0]],
          [[-26, 0], [-26, -8], [-14, -16], [0, -20], [14, -16], [26, -8], [26, 0]],
        ],
      }];
    }
    if (kind === "cave") {
      return [{
        fill: [[
          [-36, 0], [-36, -14], [-24, -32], [0, -42], [24, -32], [36, -14], [36, 0],
          [22, 0], [20, -8], [0, -18], [-20, -8], [-22, 0], [-36, 0],

  function strokeTotal(points) {
    let L = 0;
    for (let i = 1; i < points.length; i++) {
      const dx = points[i][0] - points[i - 1][0];
      const dy = points[i][1] - points[i - 1][1];
      L += Math.hypot(dx, dy);
    }
    return L;
  }

  /** draw polyline only up to `progress` (0-1) of total length */
  function drawStrokeReveal(pts, progress, ox, oy, scale) {
    if (progress <= 0) return;
    const total = strokeTotal(pts);
    if (total === 0) return;
    let remain = total * Math.min(1, progress);
    ctx.beginPath();
    ctx.moveTo(ox + pts[0][0] * scale, oy + pts[0][1] * scale);
    for (let i = 1; i < pts.length; i++) {
      const x0 = pts[i - 1][0], y0 = pts[i - 1][1];
      const x1 = pts[i][0], y1 = pts[i][1];
      const seg = Math.hypot(x1 - x0, y1 - y0);
      if (remain >= seg) {
        ctx.lineTo(ox + x1 * scale, oy + y1 * scale);
        remain -= seg;
      } else if (remain > 0) {
        const r = remain / seg;
        ctx.lineTo(ox + (x0 + (x1 - x0) * r) * scale, oy + (y0 + (y1 - y0) * r) * scale);
        remain = 0;
        break;
      } else break;
    }
    ctx.stroke();
  }

  function ensureWorld(xTo) {
    while (obstacles.length < 50) {
      const last = obstacles.length ? obstacles[obstacles.length - 1].x : 620;
      const x = last + 320 + rnd() * 380;
      if (x > xTo + 1500 && obstacles.length > 3) break;
      const r = rnd();

      if (r < 0.14) {
        // 小溪 → 跳
        obstacles.push({ x, type: "stream", w: 28, depth: 18 });
        objects.push({ x, kind: "stream", s: 1, p: 0, on: false, strokes: null });
      } else if (r < 0.26) {
        // 山谷 → 跳
        obstacles.push({ x, type: "valley", w: 36, depth: 22 });
        objects.push({ x, kind: "valley", s: 1, p: 0, on: false, strokes: null });
      } else if (r < 0.38) {
        // 土坑 → 跳
        obstacles.push({ x, type: "mud", w: 22, depth: 14 });
        objects.push({ x, kind: "mud", s: 1, p: 0, on: false, strokes: null });
      } else if (r < 0.5) {
        // 石头 → 跳
        obstacles.push({ x, type: "stone", w: 18, h: 16 });
        objects.push({ x, kind: "stone", s: 1, p: 0, on: false, strokes: null });
      } else if (r < 0.64) {
        // 石桥洞 → 翻滚（clear=站立必撞、翻滚可穿）
        obstacles.push({ x, type: "roll", w: 34, clear: 20 });
        objects.push({ x, kind: "bridge", s: 1, p: 0, on: false, strokes: null });
      } else if (r < 0.78) {
        // 山洞 → 翻滚
        obstacles.push({ x, type: "roll", w: 32, clear: 18 });
        objects.push({ x, kind: "cave", s: 1, p: 0, on: false, strokes: null });
      } else {
        // 纯风景（一笔画出）
        const decor = ["cabin", "tree", "clocktower", "shop", "hill", "flower", "mush"];
        const k = decor[(rnd() * decor.length) | 0];
        objects.push({ x, kind: k, s: 0.85 + rnd() * 0.35, p: 0, on: false, strokes: null });
        if (rnd() < 0.55) {
          objects.push({
            x: x + 55 + rnd() * 50,
            kind: ["tree", "flower", "mush", "stone"][(rnd() * 4) | 0],
            s: 0.75 + rnd() * 0.3, p: 0, on: false, strokes: null,
          });
        }
        continue;
      }
    }
    while (hills.length < 20) {
      const last = hills.length ? hills[hills.length - 1].x : -180;
      hills.push({
        x: last + 240 + rnd() * 280,
        h: 36 + rnd() * 64,
        w: 110 + rnd() * 130,
        kind: rnd() < 0.22 ? "tower" : "hill",
      });
    }
    const penX = cameraX + W * 0.85;
    if (!pathPoints.length) pathPoints.push({ x: 0, y: terrainY(0) });
    let lastX = pathPoints[pathPoints.length - 1].x;
    while (lastX < penX + 16) {
      lastX += 6;
      pathPoints.push({ x: lastX, y: terrainY(lastX) });
      if (pathPoints.length > 2400) pathPoints.splice(0, 240);
    }
    // 回收离场对象：内存平稳，路径点有上限
    const keepFrom = cameraX - 400;
    while (obstacles.length && obstacles[0].x < keepFrom) obstacles.shift();
    while (objects.length && objects[0].x < keepFrom) objects.shift();
  }

  function resetWorld(newSeed) {
    srand(newSeed);
    cameraX = 0;
    pathPoints = [{ x: 0, y: terrainY(0) }];
    obstacles = [];
    // 起点营地构图（首帧静态可读，文档 §6.3）：屋—火—箱—树—小店—指路牌—钟楼
    objects = [
      { x: 52, kind: "cabin", s: 1.0, p: 1, on: true, strokes: null },
      { x: 168, kind: "crate", s: 0.95, p: 1, on: true, strokes: null },
      { x: 226, kind: "tree", s: 1.05, p: 1, on: true, strokes: null },
      { x: 288, kind: "shop", s: 0.95, p: 1, on: true, strokes: null },
      { x: 366, kind: "flower", s: 0.8, p: 1, on: true, strokes: null },
      { x: 396, kind: "mush", s: 0.85, p: 1, on: true, strokes: null },
      { x: 470, kind: "sign", s: 1.0, p: 1, on: true, strokes: null },
      { x: 560, kind: "clocktower", s: 0.9, p: 1, on: true, strokes: null },
    ];
    hills = [];
    particles = [];
    playerY = 0; vy = 0; jumping = false; rolling = 0;
    stumbleT = 0; gaitBoost = 1;
    departBlend = mode === "camp" || mode === "point" ? 0 : departBlend;
    ensureWorld(cameraX + W + 200);
  }

  const playerWorldX = () => cameraX + W * 0.22;

  const INK_MAX = 64; // 粒子池上限（文档 §9.3）
  function emitParticles(x, y, n, burst) {
    for (let i = 0; i < n; i++) {
      if (particles.length >= INK_MAX) return;
      const a = rnd() * Math.PI * 2;
      const sp = burst ? 50 + rnd() * 90 : 18 + rnd() * 40;
      const r = rnd();
      particles.push({
        x, y,
        vx: Math.cos(a) * sp * (r < 0.6 ? -0.55 : 1),  // 铅屑向后飘
        vy: -Math.abs(Math.sin(a)) * sp * 0.6 - 8,
        life: 0.35 + rnd() * 0.25,
        t: 0, r: 0.5 + rnd() * 1.2,
        // 墨点 / 铅屑 / 星光 ≈ 3:6:1（文档 §4.3）
        kind: r < 0.3 ? "ink" : r < 0.9 ? "fleck" : "star",
      });
    }
  }

  /** Reveal objects as the pen passes — pen draws them into existence */
  function revealByPen(dt) {
    const penX = cameraX + W * 0.85;
    for (const o of objects) {
      if (!o.strokes) o.strokes = objectStrokes(o.kind);
      if (!o.on && penX > o.x - 8) o.on = true;
      if (o.on && o.p < 1) {
        // 按时间推进（高刷屏不会加速）；reduced-motion 直接完整呈现
        o.p = mode === "await" ? 1 : Math.min(1, o.p + dt * 2.4);
      }
    }
  }

  function drawPath() {
    if (pathPoints.length < 2) return;
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    // 一笔画：地面是一条不断开的线，只留极轻微笔触呼吸
    ctx.beginPath();
    for (let i = 0; i < pathPoints.length; i++) {
      const p = pathPoints[i];
      const sx = p.x - cameraX;
      const sy = p.y;
      if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }

  function drawHills(parallax) {
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "rgba(24,24,26,0.28)";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.fillStyle = "none";
    for (const h of hills) {
      let x = (h.x - cameraX * parallax);
      const span = W + 500;
      x = ((x % span) + span) % span - 150;
      const y = baseY - 8;
      if (h.kind === "tower") {
        // one-line tower
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - h.h);
        ctx.lineTo(x + 7, y - h.h - 12);
        ctx.lineTo(x + 14, y - h.h);
        ctx.lineTo(x + 14, y);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(x - h.w / 2, y);
        ctx.quadraticCurveTo(x, y - h.h, x + h.w / 2, y);
        ctx.stroke();
      }
    }
  }

  function drawObjects(layer) {
    // layer: 'back' | 'front'
    ctx.lineWidth = 1.55;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (const o of objects) {
      const sx = o.x - cameraX;
      if (sx < -120 || sx > W + 120) continue;
      if (o.p <= 0) continue;
      const sy = terrainY(o.x);
      const sc = o.s || 1;

      if (layer === "back") {
        if (!o.strokes) o.strokes = objectStrokes(o.kind);
        for (let si = 0; si < o.strokes.length; si++) {
          const sp = Math.max(0, Math.min(1, (o.p - si * 0.15) / (1 - si * 0.05)));
          if (sp <= 0) continue;
          drawStrokeReveal(o.strokes[si], sp, sx, sy, sc);
        }
      } else if (layer === "front") {
        const front = objectFrontStrokes(o.kind);
        if (!front || o.p < 0.85) continue;
        const fade = Math.min(1, (o.p - 0.85) / 0.15);
        for (const f of front) {
          // 白填充实体 → 角色被遮挡
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.fillStyle = "#FFFFFF";
          ctx.beginPath();
          const fp = f.fill[0];
          ctx.moveTo(sx + fp[0][0] * sc, sy + fp[0][1] * sc);
          for (let i = 1; i < fp.length; i++)
            ctx.lineTo(sx + fp[i][0] * sc, sy + fp[i][1] * sc);
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
          for (const sp of f.stroke) drawStrokeReveal(sp, 1, sx, sy, sc);
          ctx.restore();
        }
      }
    }
  }

  /** 神笔。show: 0–1 落位进度（point 阶段从空中压下）；dt: 低通用 */
  function drawPen(show, dt) {
    if (show <= 0) return;
    const penX = W * 0.85;
    const worldPen = cameraX + penX;
    const penY = terrainY(worldPen) - 1;
    // 倾角 = 基础握笔角 + 切线(×0.85, clamp ±15°) 的低通，±0.8° 噪声
    const target = 0.35 + Math.max(-0.26, Math.min(0.26, Math.atan(tangentAt(worldPen)) * 0.85));
    penAng += (target - penAng) * Math.min(1, (dt || 0.016) * 8);
    const still = mode === "await";
    const bob = still ? 0 : Math.sin(modeT * 10) * 0.45;

    ctx.save();
    ctx.globalAlpha = show;
    const drop = 1 + (1 - show) * 0.22;
    ctx.translate(penX, penY - (1 - show) * 26 + bob);
    ctx.rotate(penAng + (still ? 0 : noise1(modeT * 3) * 0.014));
    ctx.scale(drop, drop);

    // 笔长 ≈ 视口高 18%，≥72px（文档 §4.2）
    const L = Math.max(72, Math.min(H * 0.18, 132));
    const hw = L * 0.034;

    ctx.lineWidth = 1.3;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-hw * 0.7, -L * 0.16);
    ctx.lineTo(-hw, -L);
    ctx.lineTo(hw, -L);
    ctx.lineTo(hw * 0.7, -L * 0.16);
    ctx.closePath();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-hw * 0.94, -L + L * 0.14);
    ctx.lineTo(hw * 0.94, -L + L * 0.14);
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = Math.max(0, a);
      if (p.kind === "star") {
        ctx.strokeStyle = "#FFDE59";
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(p.x - 3, p.y); ctx.lineTo(p.x + 3, p.y);
        ctx.moveTo(p.x, p.y - 3); ctx.lineTo(p.x, p.y + 3);
        ctx.stroke();
      } else if (p.kind === "fleck") {
        ctx.fillStyle = "rgba(24,24,26,0.35)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 0.7, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = "#18181A";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* 角色：干净比例 + 自然行走循环 + 翻滚（720°/0.55s，文档 §3/§5.3） */
  function walkPose(time, phase) {
    const p = time * 9 + phase;
    return {
      bob: Math.sin(p * 2) * 0.7,
      legL: Math.sin(p) * 3.4,
      legR: Math.sin(p + Math.PI) * 3.4,
      lean: Math.sin(p) * 0.035,
    };
  }
  // 翻滚姿态：以身体中心为轴 720° 自旋 + 压扁（hitbox ×0.4）
  function applyRoll(roll, sx, sy, pivot) {
    ctx.translate(0, -pivot);
    ctx.rotate(roll * Math.PI * 4);
    ctx.scale(sx, sy);
    ctx.translate(0, pivot);
  }

  function drawChestnut(x, y, squash, time, roll, phase, pose) {
    const w = walkPose(time, phase || 0);
    ctx.save();
    ctx.translate(x, y);
    const s = 0.8;
    if (roll != null) applyRoll(roll, s * 1.12, s * 0.6, 9);
    else {
      ctx.translate(0, -w.bob);
      ctx.rotate(w.lean);
      ctx.scale(s, s * (1 - squash * 0.08));
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 柠檬黄小背包（白底品牌点缀）
    ctx.fillStyle = "#FFDE59";
    ctx.beginPath();
    ctx.moveTo(11, -17); ctx.lineTo(16.5, -17); ctx.lineTo(16.5, -6); ctx.lineTo(11, -6);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // 身 + 头 + 双耳：一笔连续
    ctx.beginPath();
    ctx.moveTo(-5, -7);
    ctx.quadraticCurveTo(-7, -16, -5, -22);
    ctx.quadraticCurveTo(-8, -29, -2, -27);
    ctx.quadraticCurveTo(1, -33, 5, -28);
    ctx.quadraticCurveTo(11, -28, 11, -20);
    ctx.quadraticCurveTo(12, -12, 8, -7);
    ctx.stroke();

    // 尾
    ctx.beginPath();
    ctx.moveTo(-5, -11);
    ctx.quadraticCurveTo(-13, -15, -11, -23);
    ctx.stroke();

    // 腿（翻滚时收起）
    if (roll != null) {
      ctx.beginPath();
      ctx.moveTo(-3, -6); ctx.quadraticCurveTo(-1, -2, -4, -1);
      ctx.moveTo(4, -6); ctx.quadraticCurveTo(6, -2, 3, -1);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-2, -5); ctx.lineTo(-2 + w.legL, 0);
      ctx.moveTo(3, -5); ctx.lineTo(3 + w.legR, 0);
      ctx.stroke();
    }

    // 姿态：伸懒腰（营地呼吸）/ 指路（出发仪式，文档 §6.1）
    if (pose === "stretch") {
      ctx.beginPath();
      ctx.moveTo(0, -26); ctx.quadraticCurveTo(-2 - Math.sin(time * 2) * 1.5, -31, -4, -34);
      ctx.moveTo(6, -25); ctx.quadraticCurveTo(8 + Math.sin(time * 2) * 1.5, -30, 10, -33);
      ctx.stroke();
    } else if (pose === "point") {
      ctx.beginPath();
      ctx.moveTo(4, -21);
      ctx.quadraticCurveTo(10, -22, 15, -19);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(15.5, -19, 1, 0, Math.PI * 2);
      ctx.fillStyle = "#18181A"; ctx.fill();
    }

    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    ctx.arc(0, -21, 0.85, 0, Math.PI * 2);
    ctx.arc(5, -21, 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawCloudy(x, y, squash, time, roll, phase) {
    const w = walkPose(time, phase != null ? phase : 1.3);
    ctx.save();
    ctx.translate(x, y);
    const s = 0.8;
    if (roll != null) applyRoll(roll, s * 1.12, s * 0.6, 11);
    else {
      ctx.translate(0, -w.bob);
      ctx.rotate(w.lean);
      ctx.scale(s, s * (1 - squash * 0.08));
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 垂耳兔：一笔耳→头→身→耳（白填充遮住背后的线条）
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.moveTo(-7, -12);
    ctx.quadraticCurveTo(-13, -4, -11, 3);
    ctx.quadraticCurveTo(-7, -1, -6, -11);
    ctx.quadraticCurveTo(-4, -24, 3, -25);
    ctx.quadraticCurveTo(9, -24, 10, -16);
    ctx.quadraticCurveTo(14, -8, 15, 1);
    ctx.quadraticCurveTo(12, -6, 9, -12);
    ctx.quadraticCurveTo(10, -5, 5, -3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    if (roll != null) {
      ctx.beginPath();
      ctx.moveTo(-2, -6); ctx.quadraticCurveTo(0, -2, -3, -1);
      ctx.moveTo(4, -6); ctx.quadraticCurveTo(6, -2, 3, -1);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-1, -3); ctx.lineTo(-1 + w.legL, 0);
      ctx.moveTo(3, -3); ctx.lineTo(3 + w.legR, 0);
      ctx.stroke();
    }

    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    ctx.arc(1, -17, 0.85, 0, Math.PI * 2);
    ctx.arc(6, -17, 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawKuro(x, y, squash, time, roll, phase) {
    const w = walkPose(time * 1.25, phase != null ? phase : 2.6);
    ctx.save();
    ctx.translate(x, y);
    const s = 0.8;
    if (roll != null) applyRoll(roll, s * 1.1, s * 0.62, 10);
    else {
      ctx.translate(0, -w.bob * 0.85);
      ctx.rotate(w.lean);
      ctx.scale(s, s * (1 - squash * 0.08));
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 黑毛团（#18181A 填充，豆豆眼反白）
    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    ctx.arc(0, -10, 8.2, 0, Math.PI * 2);
    ctx.fill();

    if (roll != null) {
      ctx.beginPath();
      ctx.moveTo(-2, -4); ctx.quadraticCurveTo(0, -1, -3, 0);
      ctx.moveTo(2, -4); ctx.quadraticCurveTo(4, -1, 1, 0);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-2, -3); ctx.lineTo(-2 + w.legL, 0);
      ctx.moveTo(2, -3); ctx.lineTo(2 + w.legR, 0);
      ctx.stroke();
    }

    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.arc(-2.4, -12, 1.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(2.8, -12, 1.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawCampFire() {
    const fx = 118 - cameraX;               // 锚定在世界坐标，随路一起离场
    if (fx < -60 || fx > W + 60) return;
    const fade = Math.max(0, Math.min(1, 1 - (cameraX - 350) / 250));
    const fy = terrainY(118);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(fx, fy);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 一笔柴堆
    ctx.beginPath();
    ctx.moveTo(-16, 0); ctx.lineTo(16, -3);
    ctx.moveTo(-12, -3); ctx.lineTo(12, 2);
    ctx.stroke();

    // 火苗（营地唯一的暖橙浓度点）
    const fl = reduceMotion ? 1 : 1 + Math.sin(modeT * 5) * 0.08;
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.quadraticCurveTo(-10, -18, 0, -34 * fl);
    ctx.quadraticCurveTo(10, -18, 0, -6);
    ctx.stroke();

    ctx.strokeStyle = "#FF9F43";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, -7);
    ctx.quadraticCurveTo(-4.5, -15, 0, -24 * fl);
    ctx.quadraticCurveTo(4.5, -15, 0, -7);
    ctx.stroke();
    ctx.restore();
  }

  /** 角色群：营地休息位 → 行进队形连续过渡（无瞬移），翻滚/踉跄/跳跃姿态 */
  function drawMascots() {
    const px = W * 0.22;
    const worldX = playerWorldX();
    const gy = terrainY(worldX) + playerY;
    const ang = Math.atan(tangentAt(worldX)) * 0.35;
    const rollSpin = rolling > 0 ? 1 - rolling / P.rollDur : null;
    const squash = jumping && playerY < -16 ? 0.2 : stumbleT > 0 ? 0.15 : 0;

    const b = (mode === "walk" || mode === "play")
      ? departBlend * departBlend * (3 - 2 * departBlend)
      : 0;
    const tAnim = mode === "await" ? 0.3 : modeT * (0.45 + 0.55 * b) * gaitBoost;
    const pose = mode === "camp" ? (modeT > 0.9 ? "stretch" : "idle")
      : mode === "point" ? "point" : null;

    const spots = [196, 224, 252];            // 营地休息位（世界坐标）
    const phases = [0, 1.3, 2.6];
    const forms = [-20, 0, 18];                // 行进队形偏移（屏幕坐标）

    for (let i = 0; i < 3; i++) {
      const campScreenX = spots[i] - cameraX;            // 世界锚定
      const formScreenX = px + forms[i];                 // 屏幕锚定
      const X = campScreenX + (formScreenX - campScreenX) * b;
      const campY = terrainY(spots[i]);
      const Y = campY + (gy - campY) * b;
      const tilt = ang * b + (rollSpin == null && stumbleT > 0 ? Math.sin(modeT * 26) * 0.05 : 0);
      ctx.save();
      ctx.translate(X, Y);
      ctx.rotate(tilt);
      ctx.translate(-X, -Y);
      if (i === 0) drawChestnut(X, Y, squash, tAnim, rollSpin, phases[i], pose);
      else if (i === 1) drawCloudy(X, Y, squash, tAnim, rollSpin, phases[i]);
      else drawKuro(X, Y, squash, tAnim, rollSpin, phases[i]);
      ctx.restore();
    }

    // 滑行扬尘（翻滚拖出的短线）
    if (rollSpin != null) {
      ctx.strokeStyle = "rgba(24,24,26,0.22)";
      ctx.lineWidth = 1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(px - 36, gy + 1); ctx.lineTo(px - 27, gy);
      ctx.moveTo(px - 33, gy + 4); ctx.lineTo(px - 24, gy + 3);
      ctx.stroke();
    }
    if (jumping && playerY < -8) {
      ctx.strokeStyle = "rgba(24,24,26,0.25)";
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(px - 10, gy + 4, 5, 0.2, Math.PI - 0.2);
      ctx.arc(px + 6, gy + 5, 7, 0.2, Math.PI - 0.2);
      ctx.stroke();
    }
    if (stumbleT > 0) {
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 + (P.stumbleDur - stumbleT) * 5;
        const sx2 = px + Math.cos(a) * 18;
        const sy2 = gy - 28 + Math.sin(a) * 8;
        ctx.strokeStyle = "#FFDE59";
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(sx2 - 3, sy2); ctx.lineTo(sx2 + 3, sy2);
        ctx.moveTo(sx2, sy2 - 3); ctx.lineTo(sx2, sy2 + 3);
        ctx.stroke();
      }
    }
  }

  function collide() {
    if (mode !== "play" || stumbleT > 0) return;
    const wx = playerWorldX();
    const gy = terrainY(wx);
    const standH = rolling > 0 ? 11 : 28;   // 翻滚 hitbox ×0.4
    const head = gy + playerY - standH;
    const feet = gy + playerY;

    for (const o of obstacles) {
      const dx = Math.abs(wx - o.x);
      if (dx > o.w) continue;
      const u = (wx - o.x) / o.w;

      if (o.type === "roll") {
        // 桥洞 / 山洞：站立或跳跃撞顶 → 踉跄；翻滚可穿过
        const lintel = terrainY(o.x) - (o.clear || 20);
        if (head < lintel && Math.abs(u) < 0.88) { stun(); return; }
      } else if (o.type === "stone") {
        const top = terrainY(o.x) - (o.h || 16);
        if (feet > top + 4 && playerY > -(o.h || 16) * 0.6) { stun(); return; }
      } else if (o.type === "stream" || o.type === "mud" || o.type === "valley") {
        // 落在坑里
        if (Math.abs(u) < 0.65 && playerY > -4) { stun(); return; }
      }
    }
  }

  function stun() {
    stumbleT = P.stumbleDur;
    jumping = false; rolling = 0; playerY = 0; vy = 0;
    emitParticles(W * 0.22, terrainY(playerWorldX()) - 24, 5, true);
  }

  function doJump() {
    if (mode !== "play" || rolling > 0) return;
    if (jumping && playerY < -5) { jumpBuf = P.bufferJump; return; }
    if (coyote > 0 || playerY > -2) {
      vy = P.jumpV; jumping = true; jumpBuf = 0;
    } else jumpBuf = P.bufferJump;
  }

  function doRoll() {
    if (mode !== "play" || rolling > 0) return;
    rolling = P.rollDur;
  }

  /** 完成交权：进入行进态。withFlash: 跳过时补 200ms 交叉淡入 */
  function enterPlay(withFlash) {
    if (mode === "play") return;
    mode = "play";
    modeT = 0;
    departBlend = Math.max(departBlend, 0.35);
    penDrop = 1; pointLand = true;
    if (withFlash) flashT = 0.2;
    document.body.classList.remove("intro-lock");
    document.getElementById("intro-ui").classList.add("hidden");
    updateHint();
    if (!hintPulsed) {
      hintPulsed = true;
      const hint = document.getElementById("hero-hint");
      hint.classList.remove("hint-pulse");
      void hint.offsetWidth;
      hint.classList.add("hint-pulse");
    }
  }
  function skipIntro() { enterPlay(true); }

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  let touchStart = null, lpTimer = 0;

  canvas.addEventListener("pointerdown", (e) => {
    idleT = 0;
    if (e.button === 2) { e.preventDefault(); skipIntro(); doRoll(); return; }
    if (e.button !== 0) return;
    skipIntro();
    if (e.pointerType === "touch") {
      touchStart = { x: e.clientX, y: e.clientY, t: performance.now() };
      return;
    }
    lpTimer = window.setTimeout(() => { if (mode === "play") doRoll(); }, 200);
    doJump();
  });
  canvas.addEventListener("pointerup", (e) => {
    clearTimeout(lpTimer);
    if (!touchStart || e.pointerType !== "touch") return;
    const dx = e.clientX - touchStart.x;
    const dy = e.clientY - touchStart.y;
    const dt = performance.now() - touchStart.t;
    touchStart = null;
    if (dy > 36 && Math.abs(dx) < 50) doRoll();
    else if (dt < 320) doJump();
  });
  window.addEventListener("pointerup", () => clearTimeout(lpTimer));

  window.addEventListener("keydown", (e) => {
    idleT = 0;
    if (e.code === "Escape") {
      if (mode !== "play") { skipIntro(); return; }
      paused = !paused; window.__paused = paused;
      document.getElementById("btn-pause").textContent = paused ? t("hero.play") : t("hero.pause");
      return;
    }
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault(); skipIntro(); doJump(); return;
    }
    if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyS" || e.code === "ArrowDown") {
      e.preventDefault(); skipIntro(); doRoll(); return;
    }
    if (mode === "camp" || mode === "point" || mode === "walk") skipIntro();
  });

  document.getElementById("btn-skip").addEventListener("click", skipIntro);
  document.getElementById("btn-setout").addEventListener("click", () => enterPlay(false));
  document.getElementById("btn-redraw").addEventListener("click", () => {
    seed = (Math.random() * 1e9) >>> 0;
    try {
      const u = new URL(location.href);
      u.searchParams.set("seed", String(seed));
      history.replaceState(null, "", u);   // ?seed= 可分享
    } catch (err) { /* file:// 某些环境不支持时静默 */ }
    resetWorld(seed);
    emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 6, 8, true);
  });
  document.getElementById("btn-pause").addEventListener("click", () => {
    paused = !paused;
    window.__paused = paused;
    document.getElementById("btn-pause").textContent = paused ? t("hero.play") : t("hero.pause");
  });

  window.addEventListener("scroll", () => {
    if (mode === "camp" || mode === "point" || mode === "walk") skipIntro();
  }, { passive: true });
  window.addEventListener("wheel", () => {
    if (mode === "camp" || mode === "point" || mode === "walk") skipIntro();
  }, { passive: true });

  /** Idle 示范：一小段波浪（文档 §4.4） */
  function drawIdleWave(k) {
    const penX = W * 0.85;
    const base = terrainY(cameraX + penX);
    ctx.save();
    ctx.globalAlpha = Math.sin(Math.min(1, k) * Math.PI) * 0.6;
    ctx.strokeStyle = "#18181A";
    ctx.lineWidth = 1.2;
    ctx.lineCap = "round";
    ctx.beginPath();
    const n = 20;
    const upto = Math.round(n * Math.min(1, k * 2.2));
    for (let i = 0; i <= upto; i++) {
      const u = i / n;
      const x = penX - 42 + u * 46;
      const y = base - 24 - Math.sin(u * Math.PI * 2.4) * 6;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  /* ── loop ── */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!stageVisible) { requestAnimationFrame(frame); return; }   // 离屏冻结，省电
    if (!paused) modeT += dt;

    if (!paused) {
      if (mode === "camp") {
        // t 0–1.8s 营地呼吸：火苗轻晃、伸懒腰（文档 §6.1）
        revealByPen(dt);
        if (modeT > 1.8) { mode = "point"; modeT = 0; }
      } else if (mode === "point") {
        // t 1.8–3.2s 栗子鼠指向前方；画笔在 85% 处轻轻落位
        penDrop = Math.min(1, penDrop + dt / 0.9);
        if (penDrop >= 1 && !pointLand) {
          pointLand = true;
          emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 2, 4, true);
        }
        if (modeT > 1.4) { mode = "walk"; modeT = 0; }
      } else if (mode === "walk") {
        // t 3.2–6.0s 画笔绘出第一段路；小队起立走进队形（墨粒）
        departBlend = Math.min(1, departBlend + dt / 1.1);
        cameraX += P.speed * Math.min(1, modeT * 1.2) * dt;
        ensureWorld(cameraX + W + 200);
        revealByPen(dt);
        if (rnd() < dt * 3) emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 2, 1, false);
        if (modeT > 2.8) enterPlay(false);
      } else if (mode === "play") {
        idleT += dt;
        // 踉跄：先失速，后 1.15× 归队（文档 §5.3）
        const rejoin = stumbleT > 0 && stumbleT <= 0.55;
        const spd = stumbleT > 0 ? (rejoin ? P.speed * P.rejoinBoost : P.speed * 0.25) : P.speed;
        gaitBoost = rejoin ? P.rejoinBoost : 1;
        if (stumbleT > 0) stumbleT -= dt;
        departBlend = Math.min(1, departBlend + dt * 1.6);

        cameraX += spd * dt;
        ensureWorld(cameraX + W * 1.3);
        revealByPen(dt);

        if (jumpBuf > 0) {
          jumpBuf -= dt;
          if (playerY > -2) doJump();
        }
        if (rolling > 0) rolling -= dt;
        if (jumping || playerY < 0) {
          vy += P.gravity * dt;
          playerY += vy * dt;
          if (playerY >= 0) { playerY = 0; vy = 0; jumping = false; coyote = P.coyote; }
        } else coyote -= dt;

        if (rnd() < dt * 4) emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 2, 1, false);
        collide();
      } else if (mode === "await") {
        revealByPen(dt);   // reduced-motion：静态营地，无仪式
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.t += dt;
        if (p.t > p.life) { particles.splice(i, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt;
      }
    }

    baseY = H * 0.64;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, W, H);

    // 软云 — 天空原有，不参与描出
    ctx.strokeStyle = "rgba(24,24,26,0.2)";
    ctx.lineWidth = 1.1;
    ctx.lineCap = "round";
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 210 - cameraX * 0.06) % (W + 200)) - 50;
      const cy = 42 + (i % 3) * 28;
      ctx.beginPath();
      ctx.arc(cx, cy, 8, Math.PI * 0.15, Math.PI * 0.85);
      ctx.arc(cx + 10, cy - 3, 7, Math.PI * 0.2, Math.PI * 0.8);
      ctx.arc(cx + 20, cy, 6, Math.PI * 0.25, Math.PI * 0.75);
      ctx.stroke();
    }

    drawCampFire();
    drawPath();
    drawObjects("back");

    const penShow = mode === "camp" ? 0
      : mode === "point" ? penDrop * penDrop * (3 - 2 * penDrop) : 1;
    drawPen(penShow, paused ? 0 : dt);

    drawMascots();
    drawObjects("front");   // 前景遮挡：桥面/洞顶压在角色上
    drawParticles();

    if (mode === "play" && idleT > 4 && idleT < 5.8) drawIdleWave((idleT - 4) / 1.8);

    if (flashT > 0) {
      flashT -= dt;
      ctx.globalAlpha = Math.max(0, flashT / 0.2) * 0.6;
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(frame);
  }

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      const rr = typeof r === "number" ? r : 3;
      this.moveTo(x + rr, y);
      this.arcTo(x + w, y, x + w, y + h, rr);
      this.arcTo(x + w, y + h, x, y + h, rr);
      this.arcTo(x, y + h, x, y, rr);
      this.arcTo(x, y, x + w, y, rr);
      this.closePath();
      return this;
    };
  }

  // boot
  resize();
  resetWorld(seed);
  applyI18n();

  const introUI = document.getElementById("intro-ui");
  if (reduceMotion) {
    // 无仪式动画：静态营地 + 「出发」按钮（文档 §9.2），页面可正常滚动
    document.body.classList.remove("intro-lock");
    introUI.classList.remove("hidden");
    document.getElementById("btn-skip").style.display = "none";
  } else {
    document.body.classList.add("intro-lock");
    introUI.classList.remove("hidden");
    document.getElementById("btn-setout").style.display = "none";
    document.getElementById("hero-hint").textContent = t("hero.skipping");
  }

  if ("IntersectionObserver" in window) {
    new IntersectionObserver((es) => {
      stageVisible = es[es.length - 1].isIntersecting;
    }, { threshold: 0 }).observe(canvas);
  }

  requestAnimationFrame(frame);
  window.__lucky = {
    resetWorld, skipIntro, enterPlay,
    get mode() { return mode; },
    // 只读调试探针（供本地验证）
    get debug() {
      return {
        mode, cameraX, playerY, rolling: rolling > 0, stumbleT,
        particles: particles.length, objects: objects.length,
        pathPoints: pathPoints.length, stageVisible,
      };
    },
  };
})();
</script>
</body>
</html>
