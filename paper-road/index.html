    ]];
    // 小溪水纹只作辅助笔画；谷形来自同一条路线，避免叠成 X。
    if (kind === "stream") return [
      [[-18, -4], [-9, -7], [0, -4], [9, -7], [18, -4]],
      [[-12, -11], [-3, -13], [6, -11], [14, -13]],
    ];
    // 山谷：两侧草痕（不重复画谷底线）
    if (kind === "valley") return [
      [[-20, -1], [-16, -7], [-12, -2]],
      [[12, -2], [16, -7], [20, -1]],
    ];
    // 花丛：三朵错落
    if (kind === "flower") return [
      [[-12, 0], [-12, -12], [-16, -16], [-12, -20], [-8, -16], [-12, -12]],
      [[-2, -1], [-2, -18], [-6, -23], [-2, -28], [2, -23], [-2, -18]],
      [[10, 0], [10, -11], [7, -15], [10, -19], [13, -15], [10, -11]],
    ];
    // 石头：带棱面的石块
    if (kind === "stone") return [
      [[-16, 0], [-18, -10], [-6, -20], [12, -16], [16, -5], [10, 0], [-16, 0]],
      [[-6, -8], [4, -13]],
    ];
    // 土坑：坑口椭圆 + 内缘
    if (kind === "mud") return [
      [[-18, 1], [-16, 6], [0, 9], [16, 6], [18, 1], [0, -2], [-18, 1]],
      [[-10, 2], [0, 4], [10, 2]],
    ];
    // 蘑菇
    if (kind === "mush") return [[
      [-3, 0], [-3, -9], [-10, -9], [-7, -17], [0, -20], [8, -16], [10, -9], [3, -9], [3, 0],
    ]];
    // 木箱
    if (kind === "crate") return [[
      [-14, 0], [-14, -18], [14, -18], [14, 0], [-14, 0],
      [-14, -9], [14, -9], [10, -18], [10, 0], [-10, 0], [-10, -18],
    ]];
    // 指路牌
    if (kind === "sign") return [
      [[-2, 0], [-2, -26], [-16, -26], [-16, -38], [16, -38], [16, -26], [5, -26], [5, 0]],
      [[-9, -32], [7, -32], [2.5, -35.5], [7, -32], [2.5, -28.5]],
    ];
    // 里程碑大碑（每 1 km）：石柱 + 峰顶 + 基石线 + 刻字
    if (kind === "milestoneBig") return [
      [[-13, 0], [-15, -13], [-11, -30], [11, -30], [15, -13], [13, 0], [-13, 0]],
      [[-11, -30], [-6.5, -36], [-2.5, -32.5], [2, -36.5], [6.5, -31], [11, -30]],
      [[-18, 0], [18, 0]],
      ...textStrokes(label, -13, 1.0, 23),
    ];
    // 营地记录板：双柱 + 板面 + 星标 + 本 seed 最远里程
    if (kind === "record") return [
      [[-26, 0], [-26, -42], [26, -42], [26, 0]],
      [[-20, -38], [20, -38], [20, -22], [-20, -22], [-20, -38]],
      ...(label ? textStrokes(label, -25, 0.68, 36) : [[[-11, -30], [11, -30]]]),
      [[0, -50], [3, -54], [6, -50], [3, -46], [0, -50], [3, -54]],
    ];
    return [[[0, 0], [0, -8]]];
  }

  /** 物件度量：路径总长、占宽、笔尖需走过的距离（复杂件更长） */
  function ensureMetrics(o) {
    if (o._m) return o._m;
    if (!o.strokes) o.strokes = objectStrokes(o.kind, o.label);
    let total = 0, minX = 1e9, maxX = -1e9;
    for (const st of o.strokes) {
      total += strokeTotal(st);
      for (const p of st) {
        if (p[0] < minX) minX = p[0];
        if (p[0] > maxX) maxX = p[0];
      }
    }
    const s = o.s || 1;
    const span = Math.max(24, (maxX - minX) * s);
    // 笔尖空间行程 ≈ 路径长（复杂度）与占宽的加权 — 复杂地貌画更久
    const travel = Math.max(span * 1.15, total * s * 0.62);
    o._m = { total, span, travel, halfW: span / 2 };
    return o._m;
  }

  /** 前景遮挡：滑行时压住角色（白填充，轮廓在 back 随笔描出） */
  function objectFrontStrokes(kind) {
    if (kind === "bridge") {
      return [{
        fill: [[
          [-40, 0], [-40, -12], [-30, -28], [0, -38], [30, -28], [40, -12], [40, 0],
          [26, 0], [26, -8], [14, -18], [0, -24], [-14, -18], [-26, -8], [-26, 0], [-40, 0],
        ]],
        stroke: [],
      }];
    }
    if (kind === "cave") {
      return [{
        fill: [[
          [-38, 0], [-34, -18], [-20, -36], [0, -44], [20, -36], [34, -18], [38, 0],
          [22, 0], [18, -8], [0, -18], [-18, -8], [-22, 0], [-38, 0],
        ]],
        stroke: [],
      }];
    }
    return null;
  }

  function strokeTotal(points) {
    let L = 0;
    for (let i = 1; i < points.length; i++) {
      const dx = points[i][0] - points[i - 1][0];
      const dy = points[i][1] - points[i - 1][1];
      L += Math.hypot(dx, dy);
    }
    return L;
  }

  /** draw polyline only up to `progress` (0-1) of total length */
  function drawStrokeReveal(pts, progress, ox, oy, scale) {
    if (progress <= 0) return;
    const total = strokeTotal(pts);
    if (total === 0) return;
    let remain = total * Math.min(1, progress);
    ctx.beginPath();
    ctx.moveTo(ox + pts[0][0] * scale, oy + pts[0][1] * scale);
    for (let i = 1; i < pts.length; i++) {
      const x0 = pts[i - 1][0], y0 = pts[i - 1][1];
      const x1 = pts[i][0], y1 = pts[i][1];
      const seg = Math.hypot(x1 - x0, y1 - y0);
      if (remain >= seg) {
        ctx.lineTo(ox + x1 * scale, oy + y1 * scale);
        remain -= seg;
      } else if (remain > 0) {
        const r = remain / seg;
        ctx.lineTo(ox + (x0 + (x1 - x0) * r) * scale, oy + (y0 + (y1 - y0) * r) * scale);
        remain = 0;
        break;
      } else break;
    }
    ctx.stroke();
  }

  /** 估算物件半宽（未建 strokes 时按 kind 估值） */
  function halfWidthOf(kind, s) {
    const rough = {
      cabin: 22, tree: 22, clocktower: 14, shop: 20, hill: 46,
      stream: 18, valley: 22, flower: 14, stone: 16, mud: 18,
      bridge: 40, cave: 38, mush: 10, crate: 14, sign: 16,
      milestoneBig: 18, record: 28,
    };
    return (rough[kind] || 16) * (s || 1);
  }

  /** 辅助笔画只负责景物，不参与可走路线和碰撞。
      让位规则：① 不与任何障碍区间重叠（跳类/滑类/石台，留 16px 余量）
               ② 不与既有物件挨太近；两者互相牵制，循环到干净为止。
               ③ exact=true（里程碑/记录板）落点必须准：只让开障碍，撞到景物则把景物挪开。 */
  function placeObject(cursorX, kind, s, label, exact) {
    const hw = halfWidthOf(kind, s);
    const minGap = 48;
    const clear = 16;
    let x = exact ? cursorX : cursorX + hw + minGap + rnd() * 40;
    if (exact) {
      for (const f of routeFeatures) {
        if (f.interaction !== "jump" && f.interaction !== "slide") continue;
        if (x + hw > f.x0 - clear && x - hw < f.x1 + clear) x = f.x1 + clear + hw;
      }
      for (const e of objects) {
        if (e.kind === "record" || e.kind === "milestoneBig") continue;
        const eh = halfWidthOf(e.kind, e.s || 1);
        if (Math.abs(x - e.x) < hw + eh + 14) e.x += hw + eh + 26;
      }
      objects.push({ x, kind, s: s || 1, p: 0, on: false, strokes: null, label: label || null });
      return x + hw;
    }
    for (let guard = 0; guard < 12; guard++) {
      let moved = false;
      for (const f of routeFeatures) {
        if (f.interaction !== "jump" && f.interaction !== "slide") continue;
        if (x + hw > f.x0 - clear && x - hw < f.x1 + clear) { x = f.x1 + clear + hw; moved = true; }
      }
      for (const e of objects) {
        const eh = halfWidthOf(e.kind, e.s || 1);
        if (Math.abs(x - e.x) < hw + eh + minGap * 0.7) { x += 70; moved = true; break; }
      }
      if (!moved) break;
    }
    objects.push({ x, kind, s: s || 1, p: 0, on: false, strokes: null, label: label || null });
    return x + hw;
  }

  function ensureRoute(xTo) {
    if (!ensureRoute._deck) {
      ensureRoute._deck = [
        "flat", "hill", "stream", "cloud", "mud", "arch", "valley",
        "tunnel", "flat", "stone", "branch", "clothesline", "hill", "stream", "cloud", "bar", "tunnel", "longtunnel", "ruin",
        "combo-dual-valley", "combo-slide-jump", "combo-jump-slide", "combo-triple",
      ];
      ensureRoute._i = 0;
      ensureRoute._cursor = CAMP_END;
    }
    while (ensureRoute._cursor < xTo + 220) {
      let kind = ensureRoute._deck[ensureRoute._i++ % ensureRoute._deck.length];
      // 词汇按速度解锁：连招 ≥150 才出现，三连 ≥175（新东西=新难度）
      if (kind === "combo-triple" && speedRamp < 175) kind = "flat";
      else if (kind.startsWith("combo") && speedRamp < 150) kind = "flat";
      if (ensureRoute._i % ensureRoute._deck.length === 0) {
        for (let i = ensureRoute._deck.length - 1; i > 0; i--) {
          const j = (rnd() * (i + 1)) | 0;
          [ensureRoute._deck[i], ensureRoute._deck[j]] = [ensureRoute._deck[j], ensureRoute._deck[i]];
        }
      }
      // 统一入口间隔：连招的首个元素前也留一段平坦，避免障碍与前一障碍首尾相接
      const gap = (42 + rnd() * 58) * (speedRamp / 120);
      ensureRoute._cursor = appendFlat(ensureRoute._cursor, gap);
      // 滑跳连招模板：动词切换（落地续跳 / 滑完即跳 / 跳完即滑）
      if (kind === "combo-dual-valley") {
        const f1 = appendRouteFeature(ensureRoute._cursor, "valley");
        const land = appendFlat(f1.x, 56);            // 落地续跳区
        ensureRoute._cursor = appendRouteFeature(land, "valley").x;
        continue;
      }
      if (kind === "combo-slide-jump") {
        const built = isTouch ? "stream" : "tunnel";   // 触屏：双溪节奏
        const f1 = appendRouteFeature(ensureRoute._cursor, built);
        const land = appendFlat(f1.x, 90);            // 滑完起身，立刻要跳
        ensureRoute._cursor = appendRouteFeature(land, "stream").x;
        continue;
      }
      if (kind === "combo-jump-slide") {
        const f1 = appendRouteFeature(ensureRoute._cursor, "stone");
        const land = appendFlat(f1.x, 70);            // 跳完落地，立刻要滑
        const built = isTouch ? "stone" : "branch";
        ensureRoute._cursor = appendRouteFeature(land, built).x;
        continue;
      }
      if (kind === "combo-triple") {
        // 三连：通道 → 溪谷 → 矮枝（滑-跳-滑，高速段专属）
        const built1 = isTouch ? "stream" : "tunnel";
        const f1 = appendRouteFeature(ensureRoute._cursor, built1);
        const land1 = appendFlat(f1.x, 84);
        const f2 = appendRouteFeature(land1, "stream");
        const land2 = appendFlat(f2.x, 64);
        const built2 = isTouch ? "stone" : "branch";
        ensureRoute._cursor = appendRouteFeature(land2, built2).x;
        continue;
      }
      const slideFallback = { tunnel: "stream", longtunnel: "valley", branch: "stone", clothesline: "mud", bar: "stone", ruin: "mud" };   // 触屏无滑行：滑障降级为跳障
      const built = isTouch && slideFallback[kind] ? slideFallback[kind] : kind;
      ensureRoute._cursor = appendRouteFeature(ensureRoute._cursor, built).x;
    }
    const keepFrom = cameraX - 400;
    while (routeFeatures.length && routeFeatures[0].x1 < keepFrom) routeFeatures.shift();
    while (routePoints.length > ROUTE_MAX) routePoints.splice(0, Math.min(160, routePoints.length - ROUTE_MAX));
  }

  /* ── 距离换算与里程碑节奏 ──
     换算：10px = 1m（1000px = 100m）——HUD、营地记录板、碑面刻字共用这一把尺。
     里程碑：每 1 km 一座大碑 = 1000m × 10px = 10000px。
     节奏自检：顶速 210px/s 下 47.6s、起步约 83s，仍 ≥ MILE_MIN_GAP（30s）。 */
  const PX_PER_M = 10;                     // 换算：10px = 1m
  const MILE_MIN_GAP = 30;                 // s：两座碑之间的最小间隔（自检线）
  const MILE_M = 1000;                     // m：每 1 km 一座大碑
  const MILE_STEP = MILE_M * PX_PER_M;     // px = 10000

  /** 距离显示（与碑面刻字同源）：不足 1 km 用米，超过用 km */
  function fmtDist(px) {
    const m = px / PX_PER_M;
    return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(1) + " km";
  }

  function ensureWorld(xTo) {
    ensureRoute(xTo + 700);   // 路线先于物件生成：物件落点可避开坑
    if (ensureWorld._deck == null) {
      ensureWorld._deck = ["tree", "hill", "flower", "mush", "sign", "tree"];
      ensureWorld._i = 0;
      ensureWorld._cursor = 700;
      ensureWorld._mile = 0;
    }
    while (ensureWorld._cursor < xTo + 700) {
      const kind = ensureWorld._deck[ensureWorld._i++ % ensureWorld._deck.length];
      ensureWorld._cursor = placeObject(ensureWorld._cursor, kind, 0.78 + rnd() * 0.28)
        + 70 + rnd() * 90;
    }
    // 里程碑统计物：每 1 km（= MILE_STEP）一座大碑，碑面刻里程（与 HUD 同一把尺）——
    // 稀疏到每一次都算个「章节」，而不是路边又一块石头
    while (ensureWorld._mile + MILE_STEP < xTo) {
      ensureWorld._mile += MILE_STEP;
      placeObject(ensureWorld._mile, "milestoneBig", 1, ensureWorld._mile / PX_PER_M / 1000 + "km", true);
    }
    const keepFrom = cameraX - 400;
    while (objects.length && objects[0].x < keepFrom) objects.shift();
  }

  function resetWorld(newSeed) {
    srand(newSeed);
    cameraX = 0;
    fireX = W * 0.22;   // 单一锚点：篝火 = 开镜小队中心（与队形同源，任意窗宽重合）
    drawnX = mode === "play" ? CAMP_END      // redraw starts at the camp edge
      : cameraX + W * 0.85;             // camp state is pre-drawn to the pen
    speedRamp = 120; lastMile = 0;
    entrySeed = newSeed >>> 0;
    try { bestPx = parseInt(localStorage.getItem("lucky.bestPx." + entrySeed), 10) || 0; } catch (err) { bestPx = 0; }
    bestSaved = bestPx;
    // 营地段预画为水平路线；dy 相对 baseY，resize 后不需要重建。
    routePoints = [];
    for (let x = 0; x <= 420; x += ROUTE_STEP) routePoints.push({ x, dy: 0 });
    routeFeatures = [];
    objects = [
      { x: fireX - 205, kind: "cabin", s: 0.92, p: 1, on: true, strokes: null },
      { x: fireX - 112, kind: "shop", s: 0.88, p: 1, on: true, strokes: null },
      { x: fireX + 120, kind: "mush", s: 0.95, p: 1, on: true, strokes: null },
      { x: fireX + 168, kind: "flower", s: 0.85, p: 1, on: true, strokes: null },
      { x: fireX + 300, kind: "tree", s: 1.0, p: 1, on: true, strokes: null },
      { x: fireX + 620, kind: "clocktower", s: 0.85, p: 1, on: true, strokes: null },
      // 营地记录板：写下本 seed 的最远里程（还没出发则留空板）
      { x: fireX + 66, kind: "record", s: 1, p: 1, on: true, strokes: null,
        label: bestPx > 0 ? fmtDist(bestPx) : null },
    ];
    particles = [];
    mascotMotion = [];
    motionClock = 0;
    playerY = 0; vy = 0; jumping = false; sliding = 0;
    stumbleT = 0; gaitBoost = 1;
    departBlend = mode === "camp" || mode === "point" ? 0 : departBlend;
    ensureRoute._cursor = 420;
    ensureRoute._i = 0;
    ensureRoute._deck = null;
    ensureWorld._cursor = 880;
    ensureWorld._mile = 0;
    ensureWorld._i = 0;
    ensureWorld._deck = null;
    ensureWorld(cameraX + W + 200);
  }

  const playerWorldX = () => cameraX + W * 0.22;

  const INK_MAX = 64; // 粒子池上限（文档 §9.3）
  function emitParticles(x, y, n, burst) {
    for (let i = 0; i < n; i++) {
      if (particles.length >= INK_MAX) return;
      const a = rnd() * Math.PI * 2;
      const sp = burst ? 50 + rnd() * 90 : 18 + rnd() * 40;
      const r = rnd();
      particles.push({
        x, y,
        vx: Math.cos(a) * sp * (r < 0.6 ? -0.55 : 1),  // 铅屑向后飘
        vy: -Math.abs(Math.sin(a)) * sp * 0.6 - 8,
        life: 0.35 + rnd() * 0.25,
        t: 0, r: 0.5 + rnd() * 1.2,
        // 墨点 / 铅屑 / 星光 ≈ 3:6:1（文档 §4.3）
        kind: r < 0.3 ? "ink" : r < 0.9 ? "fleck" : "star",
      });
    }
  }

  /** Reveal objects as the pen passes — pen draws them into existence */
  function revealByPen(dt) {
    // 描出前沿 = 地线已画到的位置；skip/重绘后的快速补画时物件随前沿一起出现
    const front = mode === "await" ? cameraX + W * 0.85 : drawnX;
    for (const o of objects) {
      const m = ensureMetrics(o);
      // 笔尖进入物件左缘即开始描出
      const start = o.x - m.halfW - 6;
      if (!o.on && front >= start) o.on = true;
      if (!o.on) continue;
      if (mode === "await") { o.p = 1; continue; }
      // 空间描出：p 跟前沿位移走；复杂件 travel 更长 → 画得更慢
      o.p = Math.max(0, Math.min(1, (front - start) / m.travel));
    }
  }

  /** 补画前沿追赶笔尖：进度映射到路线已完成的实际采样位置。 */
  function advanceFront(dt, camSpd) {
    const penX = cameraX + W * 0.85;
    drawnX = Math.min(penX, drawnX + Math.max((camSpd || P.speed) * dt, (penX - drawnX) * Math.min(1, dt * 6)));
  }

  function drawPath() {
    if (routePoints.length < 2) return;
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < routePoints.length; i++) {
      const p = routePoints[i];
      if (p.x > drawnX) {
        if (i > 0 && routePoints[i - 1].x < drawnX) {
          const edge = sampleRoute(drawnX);
          ctx.lineTo(drawnX - cameraX, baseY + edge.dy);
        }
        break;
      }
      if (!started) { ctx.moveTo(p.x - cameraX, baseY + p.dy); started = true; }
      else ctx.lineTo(p.x - cameraX, baseY + p.dy);
    }
    ctx.stroke();
  }

  /** 矮枝：树干立在判定带外缘，横枝从干头伸展到枝尾，叶刺随进度生长 */
  function drawBranchFeature(f, start, progress) {
    const trunkX = f.x0 - cameraX - 2;
    const yBranch = start - (f.clear || TUNNEL_CLEAR);
    const reach = (f.x1 - f.x0) * Math.min(1, progress * 1.1);
    ctx.beginPath();
    ctx.moveTo(trunkX, start);
    ctx.lineTo(trunkX, yBranch - 2);
    const n = 10;
    for (let i = 0; i <= n * Math.min(1, progress); i++) {
      const u = i / n;
      const x = trunkX + (f.x1 - cameraX - trunkX) * u;
      const y = yBranch - Math.sin(u * Math.PI) * 3;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const u = 0.2 + i * 0.16;
      if (u > progress) continue;
      const x = trunkX + (f.x1 - cameraX - trunkX) * u;
      const yTop = yBranch - Math.sin(u * Math.PI) * 3;
      ctx.moveTo(x, yTop - 2);
      ctx.lineTo(x, yTop - 7 - Math.sin(u * Math.PI) * 4);
    }
    ctx.stroke();
  }

  /** 晾衣绳：双柱 + 下垂绳线 + 摆动小布，布下钻过 */
  function drawClotheslineFeature(f, start, progress) {
    const x0 = f.x0 - cameraX, x1 = f.x1 - cameraX;
    const top = start - (f.clear || TUNNEL_CLEAR) - 12;
    const ropeSag = 5;
    ctx.beginPath();
    ctx.moveTo(x0, start); ctx.lineTo(x0, top);
    if (progress > 0.25) {
      const n = 8, reach = Math.min(1, (progress - 0.2) / 0.6);
      for (let i = 0; i <= n * reach; i++) {
        const u = i / n;
        const x = x0 + (x1 - x0) * u;
        const y = top + Math.sin(u * Math.PI) * ropeSag;
        if (i === 0) ctx.lineTo(x, y); else ctx.lineTo(x, y);
      }
    }
    if (progress > 0.7) ctx.lineTo(x1, top);
    if (progress > 0.85) ctx.lineTo(x1, start);
    ctx.stroke();
    if (progress > 0.55) {
      const sway = reduceMotion ? 0 : Math.sin(modeT * 4 + f.x0) * 2;
      const cx = x0 + (x1 - x0) * 0.5, cy = top + Math.sin(Math.PI * 0.5) * ropeSag;
      ctx.beginPath();
      ctx.moveTo(cx - 7, cy); ctx.lineTo(cx + 7 + sway, cy + 1);
      ctx.lineTo(cx + 5 + sway, cy + 12); ctx.lineTo(cx - 5, cy + 11);
      ctx.closePath(); ctx.stroke();
    }
  }

  /** 横栏：双矮柱 + 横木 + 斜撑 */
  function drawBarFeature(f, start, progress) {
    const x0 = f.x0 - cameraX, x1 = f.x1 - cameraX;
    const top = start - (f.clear || TUNNEL_CLEAR);
    ctx.beginPath();
    if (progress > 0.2) { ctx.moveTo(x0, start); ctx.lineTo(x0, top); }
    if (progress > 0.5) { ctx.moveTo(x1, start); ctx.lineTo(x1, top); }
    if (progress > 0.75) { ctx.moveTo(x0 - 2, top); ctx.lineTo(x1 + 2, top); }
    if (progress > 0.9) { ctx.moveTo(x0 + 3, start - 6); ctx.lineTo(x0 + 8, top + 3); }
    ctx.stroke();
  }

  /** 拱形滑障的外轮廓高度（相对地面，向上为正）：隧道=高拱；残拱=顶缘带 V 形断口的高拱 */
  function outerAt(f, u) {
    let h = (f.roof || TUNNEL_ROOF) * Math.sin(Math.PI * u);
    if (f.kind === "ruin") {
      const d = Math.abs(u - 0.5) / 0.16;
      if (d < 1) h -= (1 - d) * 12;
    }
    return h;
  }

  /** 内洞口高度 = 碰撞净空（隧道 16 / 残拱 14）：一眼看出「洞很矮，必须趴下」 */
  function innerAt(f, u) {
    return (f.clear || TUNNEL_CLEAR) * Math.sin(Math.PI * u);
  }

  /** 残拱（后层）：外轮廓由 drawTunnelArches 统一画，这里只补基座落石 */
  function drawRuinFeature(f, start, progress) {
    const x1 = f.x1 - cameraX;
    if (progress > 0.8) {
      ctx.beginPath();
      ctx.moveTo(x1 - 14, start); ctx.lineTo(x1 - 10, start - 5); ctx.lineTo(x1 - 6, start);
      ctx.moveTo(x1 - 26, start); ctx.lineTo(x1 - 22, start - 4); ctx.lineTo(x1 - 18, start);
      ctx.stroke();
    }
  }

  /** 石台=立在线上的一件东西（线保持连续）：与山/云等可走装饰的剪影彻底区分 */
  function drawStoneFeature(f, start, progress) {
    const cx = (f.x0 + f.x1) / 2 - cameraX;
    for (const st of objectStrokes("stone")) drawStrokeReveal(st, progress, cx, start, 1);
  }

  /** 一笔草簇：三根短线自基点散开（h 为负向上长草，为正向下垂挂） */
  function drawTuft(x, y, h) {
    ctx.beginPath();
    for (let k = -1; k <= 1; k++) {
      ctx.moveTo(x + k * 0.8, y);
      ctx.lineTo(x + k * 3.4, y + h * (k === 0 ? 1 : 0.68));
    }
    ctx.stroke();
  }

  function drawTunnelArches() {
    ctx.strokeStyle = "#18181A";
    ctx.lineWidth = 1.55;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (const f of routeFeatures) {
      const isStone = f.kind === "stone";
      if ((f.interaction !== "slide" && !isStone) || f.x0 >= drawnX || f.x1 < cameraX - 80 || f.x0 > cameraX + W + 80) continue;
      const progress = Math.max(0, Math.min(1, (drawnX - f.x0) / (f.x1 - f.x0)));
      const start = heightAt(f.x0);
      if (isStone) { drawStoneFeature(f, start, progress); continue; }
      if (f.kind === "branch") { drawBranchFeature(f, start, progress); continue; }
      if (f.kind === "clothesline") { drawClotheslineFeature(f, start, progress); continue; }
      if (f.kind === "bar") { drawBarFeature(f, start, progress); continue; }
      // 拱形滑障（隧道/长隧道/残拱）：后层只画高外轮廓
      const n = 18;
      ctx.beginPath();
      for (let i = 0; i <= n * progress; i++) {
        const u = i / n;
        const x = f.x0 + (f.x1 - f.x0) * u - cameraX;
        const y = start - outerAt(f, u);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      // 隧道/长隧道：拱背草簇 —— 石拱像长在草地上的土丘，而不是悬空的贴纸
      if (f.kind === "tunnel" || f.kind === "longtunnel") {
        ctx.lineWidth = 1.15;
        for (const tu of [0.3, 0.5, 0.7]) {
          if (progress <= tu + 0.02) continue;   // 笔还没走到就长出来会很怪
          drawTuft(f.x0 + (f.x1 - f.x0) * tu - cameraX, start - outerAt(f, tu) + 0.5, -4.5);
        }
        ctx.lineWidth = 1.55;
      }
      if (f.kind === "ruin") drawRuinFeature(f, start, progress);
    }
  }

  /** 滑障实体（前景层，画在角色之后）：外轮廓与内洞口之间白填充 + 低洞口轮廓；
      滑行穿过时角色处在矮洞里、高出洞口的部分被实体掩住——「钻过去」有实物感 */
  function drawSlideFronts() {
    for (const f of routeFeatures) {
      if (f.interaction !== "slide") continue;
      if (f.kind !== "tunnel" && f.kind !== "longtunnel" && f.kind !== "ruin") continue;
      if (f.x1 < cameraX - 80 || f.x0 > cameraX + W + 80) continue;
      const start = heightAt(f.x0);
      const x0 = f.x0 - cameraX, x1 = f.x1 - cameraX;
      const n = Math.max(10, Math.round((x1 - x0) / 10));
      ctx.save();
      ctx.beginPath();
      ctx.rect(-10000, -10000, drawnX - cameraX + 10000, 20000);   // 随笔尖描出
      ctx.clip();
      ctx.beginPath();
      for (let i = 0; i <= n; i++) {
        const u = i / n;
        const x = x0 + (x1 - x0) * u;
        if (i === 0) ctx.moveTo(x, start - outerAt(f, u));
        else ctx.lineTo(x, start - outerAt(f, u));
      }
      for (let i = n; i >= 0; i--) {
        const u = i / n;
        ctx.lineTo(x0 + (x1 - x0) * u, start - innerAt(f, u));
      }
      ctx.closePath();
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();
      ctx.strokeStyle = "#18181A";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      // 砌缝：外拱到洞门石圈之间的短放射线，拱顶像一块块拱石砌起
      ctx.lineWidth = 1;
      for (const u of [0.26, 0.4, 0.6, 0.74]) {
        const x = x0 + (x1 - x0) * u;
        const yo = start - outerAt(f, u);
        const yr = start - innerAt(f, u) * 1.22;
        ctx.beginPath();
        ctx.moveTo(x, yo);
        ctx.lineTo(x, yo + (yr - yo) * 0.62 + 0.5);
        ctx.stroke();
      }
      // 洞门石圈：与洞口同形的内缩弧，一眼看出「这是个洞口」
      ctx.lineWidth = 1.15;
      ctx.beginPath();
      for (let i = 0; i <= n; i++) {
        const u = i / n;
        const x = x0 + (x1 - x0) * u;
        const y = start - innerAt(f, u) * 1.22;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      // 洞口净空线：最重的一笔，画在石圈之上
      ctx.lineWidth = 1.7;
      ctx.beginPath();
      for (let i = 0; i <= n; i++) {
        const u = i / n;
        const x = x0 + (x1 - x0) * u;
        const y = start - innerAt(f, u);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      // 长隧道：洞顶垂草，给纵深一点闷闷的线索（只垂很短，不挡角色）
      if (f.span > 200) {
        ctx.lineWidth = 1.15;
        for (const tx of [0.3, 0.5, 0.7])
          drawTuft(x0 + (x1 - x0) * tx, start - innerAt(f, tx), 5);
      }
      ctx.restore();
    }
  }

  function drawObjects(layer) {
    // layer: 'back' | 'front'
    ctx.lineWidth = 1.55;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (const o of objects) {
      const sx = o.x - cameraX;
      if (sx < -120 || sx > W + 120) continue;
      if (o.p <= 0) continue;
      const sy = heightAt(o.x);
      const sc = o.s || 1;

      if (layer === "back") {
        const m = ensureMetrics(o);
        // 按各笔路径长度分配进度（外轮廓先画完，再画内缘/细节）
        const lens = o.strokes.map((st) => strokeTotal(st));
        const sum = lens.reduce((a, b) => a + b, 0) || 1;
        let acc = 0;
        for (let si = 0; si < o.strokes.length; si++) {
          const t0 = acc / sum;
          const t1 = (acc + lens[si]) / sum;
          acc += lens[si];
          const sp = Math.max(0, Math.min(1, (o.p - t0) / (t1 - t0 || 1)));
          if (sp <= 0) continue;
          drawStrokeReveal(o.strokes[si], sp, sx, sy, sc);
        }
      } else if (layer === "front") {
        const front = objectFrontStrokes(o.kind);
        if (!front || o.p < 0.85) continue;
        const fade = Math.min(1, (o.p - 0.85) / 0.15);
        for (const f of front) {
          // 白填充实体 → 角色被遮挡（轮廓已在 back 随笔尖描出，这里只填遮挡）
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.fillStyle = "#FFFFFF";
          ctx.beginPath();
          const fp = f.fill[0];
          ctx.moveTo(sx + fp[0][0] * sc, sy + fp[0][1] * sc);
          for (let i = 1; i < fp.length; i++)
            ctx.lineTo(sx + fp[i][0] * sc, sy + fp[i][1] * sc);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }
    }
  }

  /** 神笔。show: 0–1 落位进度（point 阶段从空中压下）；dt: 低通用 */
  function drawPen(show, dt) {
    if (show <= 0) return;
    const penX = W * 0.85;
    const worldPen = cameraX + penX;
    // 笔尖严格锁在路径最前端（与 ensureWorld / particles 同一公式）
    const tipX = worldPen;
    const tipY = heightAt(tipX);
    const target = 0.22 + Math.max(-0.26, Math.min(0.26, Math.atan(tangentAt(tipX)) * 0.85));
    penAng += (target - penAng) * Math.min(1, (dt || 0.016) * 8);
    const still = mode === "await";
    // bob 只作用笔杆，不作用笔尖
    const bob = still ? 0 : Math.sin(modeT * 10) * 0.35;

    ctx.save();
    ctx.globalAlpha = show;
    const drop = 1 + (1 - show) * 0.18;
    // 锚点 = 笔尖 (0,0)，且该点就是 (penX, tipY)
    ctx.translate(penX, tipY);
    ctx.rotate(penAng + (still ? 0 : noise1(modeT * 3) * 0.012));
    ctx.scale(drop, drop);
    // 笔杆相对尖端的微浮（尖端保持贴线）
    ctx.translate(0, bob);

    // 小笔：约 20px 高（对齐参考图「小工具」体量）
    const L = Math.max(16, Math.min(H * 0.025, 22));
    const hw = L * 0.035;

    ctx.lineWidth = 1.15;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-hw * 0.7, -L * 0.16);
    ctx.lineTo(-hw, -L);
    ctx.lineTo(hw, -L);
    ctx.lineTo(hw * 0.7, -L * 0.16);
    ctx.closePath();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-hw * 0.94, -L + L * 0.16);
    ctx.lineTo(hw * 0.94, -L + L * 0.16);
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = Math.max(0, a);
      if (p.kind === "star") {
        ctx.strokeStyle = "#FFDE59";
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(p.x - 3, p.y); ctx.lineTo(p.x + 3, p.y);
        ctx.moveTo(p.x, p.y - 3); ctx.lineTo(p.x, p.y + 3);
        ctx.stroke();
      } else if (p.kind === "fleck") {
        ctx.fillStyle = "rgba(24,24,26,0.35)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 0.7, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = "#18181A";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* 角色：共享物理锚点 + 各自的呼吸、步态与二级动作。 */
  const MASCOTS = [
    { phase: 0, lag: 0, stride: 7.2, bob: 1.55, lean: 0.10 },
    { phase: 1.3, lag: 0.04, stride: 6.1, bob: 1.15, lean: 0.075 },
    { phase: 2.6, lag: 0.08, stride: 7.8, bob: 1.8, lean: 0.12 },
  ];

  function walkPose(time, config) {
    const p = time * 13 + config.phase;
    const blinkCycle = (time * 0.72 + config.phase * 0.13) % 1;
    return {
      bob: Math.abs(Math.sin(p)) * config.bob,
      legL: Math.sin(p) * config.stride,
      legR: Math.sin(p + Math.PI) * config.stride,
      lean: config.lean + Math.sin(p) * 0.03,
      breath: Math.sin(time * 3.1 + config.phase) * 0.55,
      blink: blinkCycle > 0.91 && blinkCycle < 0.965,
      step: Math.sin(p),
    };
  }

  function applySlide(sx, sy) {
    ctx.rotate(-0.28);
    ctx.scale(sx, sy);
  }

  function drawChestnut(x, y, squash, time, roll, config, pose) {
    const w = walkPose(time, config);
    ctx.save();
    ctx.translate(x, y);
    const s = 0.82;
    if (roll != null) applySlide(s * 1.18, s * 0.48);
    else {
      ctx.translate(0, -w.bob);
      ctx.rotate(w.lean);
      ctx.scale(s, s * (1 - squash * 0.10));
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 蓬松尾巴在身后，背包随步态摆动，保持小队唯一的明亮点。
    ctx.beginPath();
    ctx.moveTo(-6, -12);
    ctx.quadraticCurveTo(-15, -16 + w.step * 1.3, -12, -24);
    ctx.quadraticCurveTo(-8, -28, -6, -22);
    ctx.stroke();
    const packSwing = roll != null ? 0 : w.step * 1.8;
    ctx.fillStyle = "#FFDE59";
    ctx.beginPath();
    ctx.roundRect(10, -18 + packSwing, 7, 12, 2.5);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(11, -15 + packSwing); ctx.quadraticCurveTo(7, -20, 5, -16);
    ctx.stroke();

    // 饱满的脸颊与不对称耳形。
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.moveTo(-6, -7);
    ctx.quadraticCurveTo(-9, -14, -6, -21);
    ctx.quadraticCurveTo(-9, -29, -3, -28);
    ctx.quadraticCurveTo(0, -34, 5, -29);
    ctx.quadraticCurveTo(12, -29, 12, -20);
    ctx.quadraticCurveTo(13, -12, 8, -7);
    ctx.quadraticCurveTo(1, -3, -6, -7);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    if (roll != null) {
      ctx.beginPath();
      ctx.moveTo(-3, -6); ctx.quadraticCurveTo(-1, -2, -4, -1);
      ctx.moveTo(4, -6); ctx.quadraticCurveTo(6, -2, 3, -1);
    } else {
      ctx.beginPath();
      ctx.moveTo(-2, -5); ctx.lineTo(-2 + w.legL, 0);
      ctx.moveTo(3, -5); ctx.lineTo(3 + w.legR, 0);
    }
    ctx.stroke();

    if (pose === "stretch") {
      // 营地里回头整理背包，动作收在身体附近。
      ctx.beginPath();
      ctx.moveTo(5, -16); ctx.quadraticCurveTo(10, -12 + Math.sin(time * 2) * 1.2, 12, -9);
      ctx.moveTo(-1, -25); ctx.quadraticCurveTo(-2, -31, -5, -33);
      ctx.stroke();
    } else if (pose === "point") {
      ctx.beginPath();
      ctx.moveTo(4, -20); ctx.quadraticCurveTo(11, -22, 16, -19);
      ctx.stroke();
      ctx.fillStyle = "#18181A";
      ctx.beginPath(); ctx.arc(16.4, -19, 1.05, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    if (w.blink) {
      ctx.moveTo(-0.8, -21); ctx.lineTo(1, -21);
      ctx.moveTo(5.1, -21); ctx.lineTo(6.9, -21);
      ctx.stroke();
    } else {
      ctx.arc(0.2, -21, 0.95, 0, Math.PI * 2);
      ctx.arc(6, -21, 0.95, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(3.1, -17.5, 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawCloudy(x, y, squash, time, roll, config, pose) {
    const w = walkPose(time, config);
    ctx.save();
    ctx.translate(x, y);
    const s = 0.84;
    if (roll != null) applySlide(s * 1.18, s * 0.48);
    else {
      ctx.translate(0, -w.bob + w.breath * 0.35);
      ctx.rotate(w.lean);
      ctx.scale(s, s * (1 - squash * 0.10));
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    const earBounce = roll != null ? 0 : Math.max(0, -playerY / 42) * 2 + w.step * 1.2;
    // 水滴身形：一长一短的软垂耳包住圆脸。
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.moveTo(-7, -12);
    ctx.quadraticCurveTo(-15, -7 + earBounce, -12, 3);
    ctx.quadraticCurveTo(-8, 1, -6, -10);
    ctx.quadraticCurveTo(-5, -25, 3, -27);
    ctx.quadraticCurveTo(11, -25, 10, -15);
    ctx.quadraticCurveTo(15, -9 + earBounce * 0.65, 15, -1);
    ctx.quadraticCurveTo(11, -3, 8, -13);
    ctx.quadraticCurveTo(9, -3, 4, -2);
    ctx.quadraticCurveTo(-3, -1, -7, -12);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    if (roll != null) {
      ctx.beginPath();
      ctx.moveTo(-2, -5); ctx.quadraticCurveTo(0, -2, -3, -1);
      ctx.moveTo(4, -5); ctx.quadraticCurveTo(6, -2, 3, -1);
    } else {
      ctx.beginPath();
      ctx.moveTo(-1, -3); ctx.lineTo(-1 + w.legL, 0);
      ctx.moveTo(3, -3); ctx.lineTo(3 + w.legR, 0);
    }
    ctx.stroke();

    if (pose === "camp") {
      ctx.beginPath();
      ctx.moveTo(8, -17); ctx.quadraticCurveTo(12, -21, 11, -26);
      ctx.moveTo(-1, -13); ctx.quadraticCurveTo(-6, -14, -8, -17);
      ctx.stroke();
      ctx.strokeStyle = "#6CC6D9";
      ctx.beginPath();
      ctx.moveTo(-8, -17); ctx.lineTo(-9, -9); ctx.stroke();
      ctx.strokeStyle = "#18181A";
    }

    ctx.fillStyle = "#18181A";
    if (w.blink) {
      ctx.beginPath();
      ctx.moveTo(0, -18); ctx.lineTo(2.2, -18);
      ctx.moveTo(6.3, -18); ctx.lineTo(8.5, -18);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.ellipse(1.1, -18, 0.75, 1.15, 0, 0, Math.PI * 2);
      ctx.ellipse(7.1, -18, 0.75, 1.15, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (Math.sin(time * 0.9 + config.phase) > 0.78) {
      ctx.strokeStyle = "#FF9F43";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-1.5, -14); ctx.lineTo(0.5, -14); ctx.moveTo(8, -14); ctx.lineTo(10, -14); ctx.stroke();
    }
    ctx.restore();
  }

  function drawKuro(x, y, squash, time, roll, config, pose) {
    const w = walkPose(time * 1.16, config);
    ctx.save();
    ctx.translate(x, y);
    const s = 0.82;
    if (roll != null) applySlide(s * 1.15, s * 0.5);
    else {
      const hop = pose === "camp" ? Math.max(0, Math.sin(time * 5 + config.phase)) * 3 : 0;
      ctx.translate(0, -w.bob * 0.8 - hop);
      ctx.rotate(w.lean);
      ctx.scale(s, s * (1 - squash * 0.10));
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 略不规则的绒毛边缘与头顶小羽毛。
    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    ctx.moveTo(-7, -9);
    ctx.quadraticCurveTo(-9, -15, -5, -19);
    ctx.quadraticCurveTo(-2, -24, 1, -20);
    ctx.quadraticCurveTo(5, -24, 8, -18);
    ctx.quadraticCurveTo(11, -13, 7, -7);
    ctx.quadraticCurveTo(3, -2, -4, -4);
    ctx.quadraticCurveTo(-8, -4, -7, -9);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.quadraticCurveTo(-1, -26, 3, -28); ctx.quadraticCurveTo(4, -24, 5, -22);
    ctx.stroke();

    const wing = roll != null ? 0 : (jumping || pose === "camp" ? -4 - w.step * 2 : -1.5 + w.step * 1.3);
    ctx.beginPath();
    ctx.moveTo(-5, -12); ctx.quadraticCurveTo(-10, -13 + wing, -10, -8 + wing * 0.4);
    ctx.moveTo(7, -12); ctx.quadraticCurveTo(12, -13 - wing * 0.5, 11, -8 - wing * 0.25);
    ctx.stroke();

    if (roll != null) {
      ctx.beginPath();
      ctx.moveTo(-2, -4); ctx.quadraticCurveTo(0, -1, -3, 0);
      ctx.moveTo(2, -4); ctx.quadraticCurveTo(4, -1, 1, 0);
    } else {
      ctx.beginPath();
      ctx.moveTo(-2, -3); ctx.lineTo(-2 + w.legL, 0);
      ctx.moveTo(2, -3); ctx.lineTo(2 + w.legR, 0);
    }
    ctx.stroke();

    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath(); ctx.arc(-2.4, -13, 1.55, 0, Math.PI * 2); ctx.arc(3.2, -13, 1.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#18181A";
    ctx.beginPath(); ctx.arc(-2.1, -12.8, 0.6, 0, Math.PI * 2); ctx.arc(3.5, -12.8, 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath(); ctx.arc(-1.9, -13.1, 0.22, 0, Math.PI * 2); ctx.arc(3.7, -13.1, 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawCampFire() {
    // 篝火 = 小队中心的世界锚点（resetWorld 由 0.22·W 派生），出发后随路自然离场
    const fx = fireX - cameraX;
    if (fx < -60 || fx > W + 60) return;
    const fade = Math.max(0, Math.min(1, 1 - (cameraX - 600) / 250));
    const fy = heightAt(fireX);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(fx, fy);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 柴堆：三根交叉（二下一上）
    ctx.beginPath();
    ctx.moveTo(-17, -1); ctx.lineTo(15, -5);
    ctx.moveTo(-15, -4); ctx.lineTo(13, 0);
    ctx.moveTo(-8, -2); ctx.lineTo(9, -7);
    ctx.stroke();

    // 石圈：五颗小弧
    ctx.beginPath();
    for (const st of [[-20, 2], [-11, 4], [0, 5], [11, 4], [20, 2]]) {
      ctx.moveTo(st[0] - 3, st[1]);
      ctx.quadraticCurveTo(st[0], st[1] - 4, st[0] + 3, st[1]);
    }
    ctx.stroke();

    // 火焰：外焰墨线 + 焰尖分叉小苗（营地唯一的暖橙浓度点）
    const fl = reduceMotion ? 1 : 1 + Math.sin(modeT * 5) * 0.08;
    const sway = reduceMotion ? 0 : Math.sin(modeT * 3.1) * 2;
    ctx.beginPath();
    ctx.moveTo(0, -7);
    ctx.quadraticCurveTo(-11, -20, -1 + sway * 0.4, -36 * fl);
    ctx.quadraticCurveTo(9, -22, 0, -7);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-1 + sway * 0.4, -36 * fl);
    ctx.quadraticCurveTo(2 + sway, -43 * fl, 6 + sway, -40 * fl);
    ctx.stroke();

    ctx.strokeStyle = "#FF9F43";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.quadraticCurveTo(-5, -16, 0, -26 * fl);
    ctx.quadraticCurveTo(5, -16, 0, -8);
    ctx.stroke();
    ctx.restore();
  }

  /** 角色群：营地休息位 → 行进队形连续过渡（无瞬移），物理只由队首锚点判定。 */
  function drawMascots() {
    const px = W * 0.22;
    const worldX = playerWorldX();
    const ang = Math.atan(tangentAt(worldX)) * 0.35;
    const slideT = slidePose > 0 ? slidePose : null;
    const squash = jumping && playerY < -16 ? 0.2 : stumbleT > 0 ? 0.15 : 0;

    const b = (mode === "walk" || mode === "play")
      ? departBlend * departBlend * (3 - 2 * departBlend)
      : 0;
    const tAnim = mode === "await" ? 0.3 : modeT * (0.45 + 0.55 * b) * gaitBoost;
    const leaderPose = mode === "camp" ? (modeT > 0.9 ? "stretch" : "idle")
      : mode === "point" ? "point" : null;
    const companionsCampPose = mode === "camp" ? "camp" : null;
    const forms = [-26, 0, 24];

    // 每帧读取共享物理高度。Cloudy/Kuro-Kuro 只读较早的视觉样本，绝不影响碰撞。
    const delayedMotion = (lag) => {
      const target = motionClock - lag;
      for (let i = mascotMotion.length - 1; i >= 0; i--) {
        if (mascotMotion[i].t <= target) return mascotMotion[i];
      }
      return mascotMotion[0] || { y: playerY, slide: slideT };
    };

    const spots = [];
    for (let i = 0; i < 3; i++) {
      const config = MASCOTS[i];
      const visual = delayedMotion(config.lag);
      const X = px + forms[i];
      const Y = heightAt(cameraX + X) + visual.y * b;
      spots.push({ x: X, y: Y });
      const tilt = ang * b + (visual.slide == null && stumbleT > 0 ? Math.sin(modeT * 26) * 0.05 : 0);
      ctx.save();
      ctx.translate(X, Y);
      ctx.rotate(tilt);
      ctx.translate(-X, -Y);
      if (i === 0) drawChestnut(X, Y, squash, tAnim, visual.slide, config, leaderPose);
      else if (i === 1) drawCloudy(X, Y, squash, tAnim, visual.slide, config, companionsCampPose);
      else drawKuro(X, Y, squash, tAnim, visual.slide, config, companionsCampPose);
      ctx.restore();
    }

    // 特效锚点：取队形中位的视觉落脚点（各自贴地 + 跟随样本），斜坡上随角色而非固定高度
    const gy = spots[1].y;
    // 滑行扬尘（压低身姿拖出的短线）
    if (slideT != null) {
      ctx.strokeStyle = "rgba(24,24,26,0.22)";
      ctx.lineWidth = 1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(px - 36, gy + 1); ctx.lineTo(px - 27, gy);
      ctx.moveTo(px - 33, gy + 4); ctx.lineTo(px - 24, gy + 3);
      ctx.stroke();
    }
    if (jumping && playerY < -8) {
      // 短直线气流（禁止圆弧，避免读成云）
      ctx.strokeStyle = "rgba(24,24,26,0.28)";
      ctx.lineWidth = 1.1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(px - 14, gy + 3); ctx.lineTo(px - 8, gy + 2);
      ctx.moveTo(px - 6, gy + 6); ctx.lineTo(px + 1, gy + 5);
      ctx.moveTo(px + 8, gy + 3); ctx.lineTo(px + 14, gy + 1);
      ctx.stroke();
    }
    if (stumbleT > 0) {
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 + (P.stumbleDur - stumbleT) * 5;
        const sx2 = px + Math.cos(a) * 18;
        const sy2 = gy - 28 + Math.sin(a) * 8;
        ctx.strokeStyle = "#FFDE59";
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(sx2 - 3, sy2); ctx.lineTo(sx2 + 3, sy2);
        ctx.moveTo(sx2, sy2 - 3); ctx.lineTo(sx2, sy2 + 3);
        ctx.stroke();
      }
    }
  }

  function collide() {
    if (mode !== "play" || stumbleT > 0) return;
    const wx = playerWorldX();
    const feature = routeFeatureAt(wx);
    if (!feature) return;
    const gy = heightAt(wx);
    const standH = sliding > 0 ? 11 : 28;
    const head = gy + playerY - standH;
    const feet = gy + playerY;
    const mid = (feature.x0 + feature.x1) / 2;
    const half = (feature.x1 - feature.x0) / 2;
    const u = (wx - mid) / half;
    const zoneK = 0.5 * Math.pow(speedRamp / 120, 1.25);   // 难度进阶：判定带略快于速度收紧，顶速时间窗 −25%

    if (feature.interaction === "slide") {
      // 拱顶下沿给站姿撞头、滑行通过；整跃能过、低跳会撞——与画出的拱线同源。
      const ground = heightAt(wx);
      const lintel = ground - (feature.clear || TUNNEL_CLEAR);
      const roof = ground - (feature.roof || TUNNEL_ROOF);
      if (head < lintel && feet > roof && Math.abs(u) < zoneK) { stun(); return; }
    } else if (feature.interaction === "jump") {
      if (Math.abs(u) < zoneK && playerY > -4) stun();
    }
  }

  function stun() {
    stumbleT = P.stumbleDur;
    jumping = false; sliding = 0; playerY = 0; vy = 0;
    emitParticles(W * 0.22, heightAt(playerWorldX()) - 24, 5, true);
  }

  function doJump() {
    if (mode !== "play") return;
    if (sliding > 0 && !slideHeld) return;   // 定长滑剩余段中不可跳
    if (slideHeld) releaseSlide();           // 按住滑时跳跃 = 起身跳（恐龙同款）
    if (jumping && playerY < -5) { jumpBuf = P.bufferJump; return; }
    if (coyote > 0 || playerY > -2) {
      vy = P.jumpV; jumping = true; jumpBuf = 0;
    } else jumpBuf = P.bufferJump;
  }

  function doSlide(held) {
    if (mode !== "play") return;
    if (jumping && playerY < -8) {
      // 空中下滑 = 快速下坠（参考 Chrome 小恐龙），落地即滑
      vy = Math.max(vy, 1100);
      slideBuf = P.bufferSlide;
      slideHeld = held;
      return;
    }
    slideHeld = held;
    sliding = Math.max(sliding, P.slideMin);
  }
  function releaseSlide() {
    slideHeld = false;
    if (sliding > P.slideRelease) sliding = P.slideRelease;   // 松手 0.1s 内起身
  }

  /** 完成交权：进入行进态。withFlash: 跳过时补 200ms 交叉淡入 */
  function enterPlay(withFlash) {
    if (mode === "play") return;
    mode = "play";
    modeT = 0;
    departBlend = 1;   // 交权即满速步频（位置恒在队形上，无位移混合）
    penDrop = 1; pointLand = true;
    if (withFlash) flashT = 0.2;
    document.body.classList.remove("intro-lock");
    document.getElementById("intro-ui").classList.add("hidden");
    updateHint();
    if (!hintPulsed) {
      hintPulsed = true;
      const hint = document.getElementById("hero-hint");
      hint.classList.remove("hint-pulse");
      void hint.offsetWidth;
      hint.classList.add("hint-pulse");
    }
  }
  function skipIntro() { enterPlay(true); }

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  let touchStart = null;

  canvas.addEventListener("pointerdown", (e) => {
    idleT = 0;
    if (e.button === 2) { e.preventDefault(); skipIntro(); doSlide(true); return; }
    if (e.button !== 0) return;
    skipIntro();
    if (e.pointerType === "touch") {
      touchStart = { x: e.clientX, y: e.clientY, t: performance.now(), slid: false };
      return;
    }
    // 左键只跳，绝不长按误触滑行（滑行 = 右键 / Shift / ↓）
    doJump();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!touchStart || e.pointerType !== "touch" || touchStart.slid) return;
    const dy = e.clientY - touchStart.y;
    const dx = e.clientX - touchStart.x;
    // 只接管短距离、明确向下的意图；其余保留给页面纵向滚动。
    if (dy > 38 && dy > Math.abs(dx) * 1.25 && performance.now() - touchStart.t < 460) {
      touchStart.slid = true;
      doSlide(false);
    }
  });
  canvas.addEventListener("pointerup", (e) => {
    if (e.button === 2) { releaseSlide(); return; }
    if (!touchStart || e.pointerType !== "touch") return;
    const dx = e.clientX - touchStart.x;
    const dy = e.clientY - touchStart.y;
    const dt = performance.now() - touchStart.t;
    const tapped = !touchStart.slid && dt < 320 && Math.abs(dx) < 24 && Math.abs(dy) < 24;
    touchStart = null;
    if (tapped) doJump();
  });
  canvas.addEventListener("pointercancel", () => { touchStart = null; });

  window.addEventListener("keydown", (e) => {
    idleT = 0;
    if (e.code === "Escape") {
      if (mode !== "play") { skipIntro(); return; }
      paused = !paused; window.__paused = paused;
      const pb = document.getElementById("btn-pause");
    pb.textContent = paused ? "▶" : "⏸";
    pb.setAttribute("aria-label", paused ? t("hero.play") : t("hero.pause"));
      return;
    }
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault(); skipIntro(); doJump(); return;
    }
    if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyS" || e.code === "ArrowDown") {
      e.preventDefault(); skipIntro(); doSlide(true); return;
    }
    if (mode === "camp" || mode === "point" || mode === "walk") skipIntro();
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowDown" || e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyS") releaseSlide();
  });

  document.getElementById("btn-skip").addEventListener("click", skipIntro);
  document.getElementById("btn-setout").addEventListener("click", () => enterPlay(false));
  document.getElementById("btn-redraw").addEventListener("click", () => {
    seed = (Math.random() * 1e9) >>> 0;
    try {
      const u = new URL(location.href);
      u.searchParams.set("seed", String(seed));
      history.replaceState(null, "", u);   // ?seed= 可分享
    } catch (err) { /* file:// 某些环境不支持时静默 */ }
    resetWorld(seed);
    emitParticles(W * 0.85, heightAt(cameraX + W * 0.85) - 6, 8, true);
  });
  document.getElementById("btn-pause").addEventListener("click", () => {
    paused = !paused;
    window.__paused = paused;
    const pb = document.getElementById("btn-pause");
    pb.textContent = paused ? "▶" : "⏸";
    pb.setAttribute("aria-label", paused ? t("hero.play") : t("hero.pause"));
  });

  window.addEventListener("scroll", () => {
    if (mode === "camp" || mode === "point" || mode === "walk") skipIntro();
  }, { passive: true });
  window.addEventListener("wheel", () => {
    if (mode === "camp" || mode === "point" || mode === "walk") skipIntro();
  }, { passive: true });

  /** Idle 示范：一小段波浪（文档 §4.4） */
  function drawIdleWave(k) {
    const penX = W * 0.85;
    const base = heightAt(cameraX + penX);
    ctx.save();
    ctx.globalAlpha = Math.sin(Math.min(1, k) * Math.PI) * 0.6;
    ctx.strokeStyle = "#18181A";
    ctx.lineWidth = 1.2;
    ctx.lineCap = "round";
    ctx.beginPath();
    const n = 20;
    const upto = Math.round(n * Math.min(1, k * 2.2));
    for (let i = 0; i <= upto; i++) {
      const u = i / n;
      const x = penX - 42 + u * 46;
      const y = base - 24 - Math.sin(u * Math.PI * 2.4) * 6;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  /* ── loop ── */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    // 离屏只跳过模拟，始终重绘，避免 resize/回滚后画布空白
    const sim = !paused && stageVisible;
    if (sim) modeT += dt;

    if (sim) {
      motionClock += dt;
      mascotMotion.push({ t: motionClock, y: playerY, slide: slidePose > 0 ? slidePose : null });
      while (mascotMotion.length > 12) mascotMotion.shift();
      if (mode === "camp") {
        // 营地呼吸约 2.4s：镜头锁死，完整看到村舍/火+小队/预画线；篝火偶尔冒火星
        cameraX = 0;
        revealByPen(dt);
        if (rnd() < dt * 1.5) emitParticles(fireX - cameraX, heightAt(fireX) - 34, 1, false);
        if (modeT > 2.4) { mode = "point"; modeT = 0; }
      } else if (mode === "point") {
        // 指路 + 笔落位，仍不卷动
        cameraX = 0;
        penDrop = Math.min(1, penDrop + dt / 0.9);
        if (penDrop >= 1 && !pointLand) {
          pointLand = true;
          emitParticles(W * 0.85, heightAt(cameraX + W * 0.85) - 2, 4, true);
        }
        if (modeT > 1.6) { mode = "walk"; modeT = 0; }
      } else if (mode === "walk") {
        // 小队原地起跑（追笔行走），镜头缓缓跟上；补画前沿扫过树/钟楼；篝火留在身后
        departBlend = Math.min(1, departBlend + dt / 1.1);
        const walkSpd = P.speed * Math.min(1, modeT * 0.8);
        cameraX += walkSpd * dt;
        advanceFront(dt, walkSpd);
        ensureWorld(cameraX + W + 200);
        revealByPen(dt);
        if (rnd() < dt * 3) emitParticles(W * 0.85, heightAt(cameraX + W * 0.85) - 2, 1, false);
        if (modeT > 2.6) enterPlay(false);
      } else if (mode === "play") {
        idleT += dt;
        // 节奏曲线：120 → 190（+0.8/s），踉跄时冻结爬升
        if (stumbleT <= 0) speedRamp = Math.min(P.rampMax, speedRamp + P.rampA * dt);
        // 踉跄：先失速，后 1.15× 归队（文档 §5.3）
        const rejoin = stumbleT > 0 && stumbleT <= 0.55;
        const spd = stumbleT > 0 ? (rejoin ? speedRamp * P.rejoinBoost : speedRamp * 0.25) : speedRamp;
        gaitBoost = rejoin ? P.rejoinBoost : 1;
        if (stumbleT > 0) stumbleT -= dt;

        cameraX += spd * dt;
        advanceFront(dt, spd);
        ensureWorld(cameraX + W * 1.3);
        revealByPen(dt);

        if (jumpBuf > 0) {
          jumpBuf -= dt;
          if (playerY > -2) doJump();
        }
        if (slideBuf > 0) {
          slideBuf -= dt;
          if (sliding <= 0 && playerY > -4) doSlide();
        }
        if (sliding > 0 && !slideHeld) sliding -= dt;
        if (slideHeld && sliding <= 0 && playerY > -4) sliding = 0.02;   // 按住持续滑
        slidePose = Math.max(0, Math.min(1, slidePose + ((sliding > 0) ? 1 : -1) * dt / P.slideEase));
        prevY = playerY;
        if (jumping || playerY < 0) {
          // 抛物线加弧度：顶点附近(|vy|<160)减重力悬挂，起跳/落地依旧干脆
          vy += (Math.abs(vy) < 160 ? 1500 : P.gravity) * dt;
          playerY += vy * dt;
          if (playerY >= 0) {
            if (prevY < -40) emitParticles(W * 0.22, heightAt(playerWorldX()) - 1, 3, false);
            playerY = 0; vy = 0; jumping = false; coyote = P.coyote;
          }
        } else coyote -= dt;

        if (rnd() < dt * 4) emitParticles(W * 0.85, heightAt(cameraX + W * 0.85) - 2, 1, false);
        collide();

        // 整公里：HUD 里程读数轻脉冲（路边的大碑也正好在这一格）
        const mile = Math.floor(cameraX / MILE_STEP);
        if (mile > lastMile) {
          lastMile = mile;
          if (hudKmEl) {
            hudKmEl.classList.remove("pulse");
            void hudKmEl.offsetWidth;
            hudKmEl.classList.add("pulse");
          }
        }
        // 最远里程：连续记录，每 10 m（= 100px）落一次盘——出发营地的记录板下次开营就是它
        const pxNow = Math.floor(cameraX);
        if (pxNow > bestPx) {
          bestPx = pxNow;
          if (pxNow - bestSaved >= 100) {
            bestSaved = pxNow;
            try { localStorage.setItem("lucky.bestPx." + entrySeed, String(bestPx)); } catch (err) {}
          }
        }
        if (hudKmEl) hudKmEl.textContent = fmtDist(cameraX);
      } else if (mode === "await") {
        drawnX = cameraX + W * 0.85;   // reduced-motion：静态营地，地线一次画全
        revealByPen(dt);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.t += dt;
        if (p.t > p.life) { particles.splice(i, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt;
      }
    }

    // 纸面恒为纸白
    baseY = H * 0.64;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, W, H);

    // 夜：月牙与星（随系统时间，缓慢视差）
    if (isNight) {
      ctx.strokeStyle = "rgba(24,24,26,0.35)";
      ctx.lineWidth = 1.2;
      ctx.lineCap = "round";
      const span2 = W + 200;
      const mx = (((90 - cameraX * 0.04) % span2) + span2) % span2 - 60;
      ctx.beginPath();
      ctx.arc(mx, 58, 13, Math.PI * 0.3, Math.PI * 1.7, true);
      ctx.stroke();
      for (const st of [[180, 40], [330, 86], [520, 50]]) {
        const x2 = (((st[0] - cameraX * 0.04) % span2) + span2) % span2 - 60;
        ctx.beginPath();
        ctx.moveTo(x2 - 2.5, st[1]); ctx.lineTo(x2 + 2.5, st[1]);
        ctx.moveTo(x2, st[1] - 2.5); ctx.lineTo(x2, st[1] + 2.5);
        ctx.stroke();
      }
    }

    // 软云 — 天空原有，经典云形（平底 + 三圆顶）；随里程 3 → 6 缓增
    ctx.strokeStyle = "rgba(24,24,26,0.32)";
    ctx.lineWidth = 1.15;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const cloudN = 3 + Math.min(3, Math.floor(cameraX / 2000));
    for (let i = 0; i < cloudN; i++) {
      const cx = ((i * 320 - cameraX * 0.06) % (W + 360)) - 70;
      const cy = 36 + (i % 3) * 32;
      const w = 22 + (i % 2) * 6;
      const h = 13 + (i % 2) * 3;
      ctx.beginPath();
      // 左下 → 右下 → 右顶 → 中顶 → 左顶 → 闭合底边
      ctx.moveTo(cx - w, cy);
      ctx.lineTo(cx + w, cy);
      ctx.quadraticCurveTo(cx + w + 3, cy - h * 0.55, cx + w * 0.5, cy - h * 0.95);
      ctx.quadraticCurveTo(cx + w * 0.3, cy - h * 1.55, cx, cy - h * 1.05);
      ctx.quadraticCurveTo(cx - w * 0.35, cy - h * 1.55, cx - w * 0.55, cy - h * 0.95);
      ctx.quadraticCurveTo(cx - w - 3, cy - h * 0.55, cx - w, cy);
      ctx.closePath();
      ctx.stroke();
    }

    drawCampFire();
    drawPath();
    drawTunnelArches();
    drawObjects("back");

    const penShow = mode === "camp" ? 0
      : mode === "point" ? penDrop * penDrop * (3 - 2 * penDrop) : 1;
    drawPen(penShow, paused ? 0 : dt);

    drawMascots();
    drawSlideFronts();
    drawParticles();

    if (mode === "play" && idleT > 4 && idleT < 5.8) drawIdleWave((idleT - 4) / 1.8);

    if (flashT > 0) {
      flashT -= dt;
      ctx.globalAlpha = Math.max(0, flashT / 0.2) * 0.6;
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(frame);
  }

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      const rr = typeof r === "number" ? r : 3;
      this.moveTo(x + rr, y);
      this.arcTo(x + w, y, x + w, y + h, rr);
      this.arcTo(x + w, y + h, x, y + h, rr);
      this.arcTo(x, y + h, x, y, rr);
      this.arcTo(x, y, x + w, y, rr);
      this.closePath();
      return this;
    };
  }

  // boot：等布局完成后再建世界，避免 clientHeight=0 时 baseY 算歪
  function bootWorld() {
    resize();
    resetWorld(seed);
  }
  resize();
  applyI18n();

  const introUI = document.getElementById("intro-ui");
  if (reduceMotion) {
    // 无仪式动画：静态营地 + 「出发」按钮（文档 §9.2），页面可正常滚动
    document.body.classList.remove("intro-lock");
    introUI.classList.remove("hidden");
    document.getElementById("btn-skip").style.display = "none";
  } else {
    document.body.classList.add("intro-lock");
    introUI.classList.remove("hidden");
    document.getElementById("btn-setout").style.display = "none";
    document.getElementById("hero-hint").textContent = t("hero.skipping");
  }

  if ("IntersectionObserver" in window) {
    new IntersectionObserver((es) => {
      stageVisible = es[es.length - 1].isIntersecting;
    }, { threshold: 0 }).observe(canvas);
  }

  // 若 canvas 已有高度则立即建；否则等一帧布局
  if (canvas.clientHeight > 0) bootWorld();
  else requestAnimationFrame(() => { bootWorld(); requestAnimationFrame(frame); });

  if (canvas.clientHeight > 0) requestAnimationFrame(frame);
  window.__lucky = {
    resetWorld, skipIntro, enterPlay,
    get mode() { return mode; },
    // 只读调试探针（供本地验证）
    get debug() {
      return {
        mode, cameraX, playerY, sliding: sliding > 0, stumbleT,
        particles: particles.length, objects: objects.length,
        routePoints: routePoints.length, routeFeatures: routeFeatures.length, stageVisible,
        routeX0: routePoints[0] && routePoints[0].x,
        routeXN: routePoints[routePoints.length - 1] && routePoints[routePoints.length - 1].x,
        feature: routeFeatureAt(playerWorldX()),
        penTip: { x: Math.round(cameraX + W * 0.85), y: Math.round(heightAt(cameraX + W * 0.85)) },
        drawnX: Math.round(drawnX),
        baseY: Math.round(baseY), W, H,
      };
    },
  };
})();
</script>
</body>
</html>
