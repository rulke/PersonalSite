<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lucky — Code with craft. Design with soul.</title>
<meta name="description" content="lucky portfolio — 边走边画的数字手艺人。 Code with craft. Design with soul." />
<style>
  :root {
    --paper: #ffffff;
    --ground: #f3f2ef;
    --ink: #18181a;
    --ink-soft: #8a8a90;
    --line-faint: #e6e5e3;
    --line-soft: #d9d8d5;
    --accent-lemon: #ffde59;
    --accent-orange: #ff9f43;
    --accent-sage: #70a07b;
    --font-display: "SF Pro Display", "Inter", -apple-system, "Segoe UI", sans-serif;
    --font-cjk: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-cjk);
    color: var(--ink);
    background: var(--ground);
    line-height: 1.75;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body.intro-lock { overflow: hidden; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
    mix-blend-mode: multiply;
  }

  a { color: inherit; text-decoration: none; }
  button {
    font: inherit; color: inherit; background: none; border: none; cursor: pointer;
  }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  /* ── Paper sheet ── */
  .sheet {
    position: relative;
    z-index: 1;
    background: var(--paper);
    max-width: 1200px;
    margin: 12px auto 24px;
    border: 1px solid var(--line-faint);
    border-radius: 36px;
    overflow: clip;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 24px 60px rgba(24,24,26,0.04);
  }

  /* ── Nav ── */
  /* ── Nav：裸浮层（方案 A，无外框胶囊）── */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 28px 16px;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.92) 0%,
      rgba(255, 255, 255, 0.72) 55%,
      rgba(255, 255, 255, 0) 100%
    );
  }
  .nav-brand {
    pointer-events: auto;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-display);
    font-weight: 600; font-size: 15px; letter-spacing: -0.03em;
    color: var(--ink);
  }
  .nav-brand .logo { width: 16px; height: 16px; }
  .nav-right {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-links { display: flex; align-items: center; gap: 2px; }
  .nav-links a, .nav-lang {
    font-family: var(--font-display);
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.06em;
    padding: 8px 12px;
    color: var(--ink-soft);
    transition: color .25s;
    white-space: nowrap;
    background: none;
    border: none;
  }
  .nav-links a:hover, .nav-lang:hover { color: var(--ink); }
  .nav-links a.active {
    color: var(--ink);
  }
  .nav-links a.active::after {
    content: "";
    display: block;
    margin: 2px auto 0;
    width: 14px;
    height: 1.5px;
    border-radius: 1px;
    background: var(--ink);
  }
  .nav-lang {
    margin-left: 10px;
    padding: 8px 2px 8px 12px;
    border-left: 1px solid var(--line-faint);
    font-size: 11px;
    letter-spacing: 0.1em;
  }

  /* ── Stage canvas ── */
  #stage {
    display: block;
    width: 100%;
    height: min(68vh, 560px);
    touch-action: pan-y;
    cursor: default;
    background: var(--paper);
  }

  .stage-wrap { position: relative; }
  .stage-hud {
    position: absolute; top: 12px; right: 16px;
    font-family: var(--font-mono); font-size: 12px;
    color: var(--ink-soft); letter-spacing: 0.08em;
    pointer-events: none; opacity: 0.85;
  }
  .stage-hud.pulse { animation: hintPulse 1.2s ease 1; }
  .hud-btns { position: absolute; top: 10px; left: 12px; display: flex; gap: 8px; }
  .hud-btn {
    width: 34px; height: 34px; border-radius: 999px;
    border: 1px solid var(--line-faint);
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 13px; color: var(--ink-soft);
    transition: color .2s, border-color .2s;
  }
  .hud-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .nav-sound {
    margin-left: 4px; padding: 8px 10px; border-radius: 999px;
    border: 1px solid var(--line-faint); color: var(--ink-soft);
    font-size: 12px; transition: color .2s, opacity .2s;
  }
  .nav-sound[aria-pressed="true"] { color: var(--ink); }
  .nav-sound[aria-pressed="false"] { opacity: 0.55; }

  .hero-copy {
    text-align: center;
    padding: 12px 24px 8px;
    margin-top: -20px;
  }
  .hero-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 4.8vw, 56px);
    line-height: 1.12;
    letter-spacing: -0.035em;
  }
  .hero-title .zh {
    font-family: var(--font-cjk);
    font-weight: 500;
    letter-spacing: 0.06em;
    line-height: 1.4;
  }
  .hero-sub {
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .hero-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 28px 22px;
    flex-wrap: wrap;
  }
  .hero-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .ctrl-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid var(--line-faint);
    color: var(--ink-soft);
    transition: color .2s, border-color .2s, background .2s;
    background: var(--paper);
  }
  .ctrl-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .hero-hint {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    text-align: right;
    flex: 1;
    min-width: 200px;
  }

  .intro-ui {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 0 24px 18px;
  }
  .intro-ui.hidden { display: none; }
  .btn-setout {
    font-family: var(--font-display);
    font-weight: 600; font-size: 13px; letter-spacing: 0.08em;
    padding: 12px 32px; border-radius: 999px;
    background: var(--ink); color: var(--paper);
    transition: transform .25s cubic-bezier(.34,1.4,.64,1);
  }
  .btn-setout:hover { transform: scale(1.03); }
  .btn-skip {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.04em;
  }
  .btn-skip:hover { color: var(--ink); }

  /* ── Sections ── */
  .section {
    padding: 72px 56px 56px;
    max-width: 980px;
    margin: 0 auto;
    scroll-margin-top: 96px;
  }
  .openroad { scroll-margin-top: 88px; }
  .section-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    margin-bottom: 56px;
    gap: 12px;
  }
  .section-head .side {
    display: flex;
    align-items: center;
  }
  .section-head .side.right { justify-content: flex-end; }
  .section-head .center {
    text-align: center;
  }
  .hollow {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(40px, 7.5vw, 68px);
    letter-spacing: 0.04em;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px #cfcdc8;
    text-stroke: 2px #cfcdc8;
    user-select: none;
    white-space: nowrap;
  }
  .section-sub {
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.28em;
  }
  .text-link {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    transition: color .2s;
  }
  .text-link:hover { color: var(--ink); }

  /* Works */
  .works-featured {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px 40px;
    margin-bottom: 32px;
  }
  .work-card {
    display: block;
    border-radius: 24px;
    padding: 20px 20px 28px;
    transition: transform .4s cubic-bezier(.22,1,.36,1);
    position: relative;
  }
  .work-card:hover { transform: translateY(-3px); }
  .work-card.featured:nth-child(even) { margin-top: 40px; }
  .work-art {
    height: 120px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .work-art svg { width: 140px; height: 100px; overflow: visible; }
  .work-title {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 600;
    letter-spacing: -0.03em;
  }
  .work-tagline {
    margin-top: 10px;
    font-size: 15px;
    line-height: 1.7;
  }
  .work-meta {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }
  .work-arrow {
    position: absolute; right: 28px; bottom: 28px;
    font-family: var(--font-display);
    font-size: 18px; color: var(--ink-soft);
    transition: transform .3s, color .3s;
  }
  .work-card:hover .work-arrow {
    transform: translate(3px,-3px);
    color: var(--ink);
  }
  .mascot-peek {
    position: absolute; top: -18px; right: 40px;
    width: 56px; height: 56px; pointer-events: none;
    filter: drop-shadow(0 2px 0 rgba(24,24,26,0.04));
  }

  .works-bento {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding-top: 8px;
    border-top: 1px solid var(--line-faint);
  }
  .work-card.bento {
    padding: 24px 20px 28px;
    margin-top: 16px;
  }
  .work-card.bento .work-art { height: 88px; margin-bottom: 16px; }
  .work-card.bento .work-art svg { width: 100px; height: 72px; }
  .work-card.bento .work-title { font-size: 18px; }
  .work-card.bento .work-tagline { font-size: 13px; color: var(--ink-soft); }
  .work-card.bento .work-arrow { right: 20px; bottom: 18px; font-size: 15px; }

  .works-empty {
    text-align: center; color: var(--ink-soft);
    padding: 56px; border: 1px dashed var(--line-faint); border-radius: 24px;
  }

  /* About */
  .about-manifesto {
    text-align: center;
    font-family: var(--font-display);
    font-size: clamp(22px, 3.2vw, 34px);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 48px;
  }
  .timeline {
    list-style: none;
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: "";
    position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 1px; background: var(--line-soft);
  }
  .timeline li {
    position: relative;
    padding: 0 0 52px 36px;
  }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: "";
    position: absolute; left: -33px; top: 8px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
  }
  .timeline .year {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--ink-soft);
    letter-spacing: 0.06em;
  }
  .timeline .event {
    margin-top: 6px;
    font-size: 16px;
    letter-spacing: 0.02em;
  }

  /* Notes — match reference layout */
  .notes-all { justify-self: end; }
  .note-row {
    display: grid;
    grid-template-columns: 120px 1fr 28px;
    gap: 20px;
    align-items: center;
    padding: 26px 8px;
    border-top: 1px solid var(--line-faint);
    transition: background .25s, padding .25s;
  }
  .note-row:last-child { border-bottom: 1px solid var(--line-faint); }
  .note-row:hover {
    background: rgba(24,24,26,0.015);
    padding-left: 14px;
  }
  .note-date {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  .note-title {
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .note-title.zh {
    font-family: var(--font-cjk);
    letter-spacing: 0.02em;
    font-size: 14px;
  }
  .note-arrow {
    font-family: var(--font-display);
    color: var(--ink-soft);
    font-size: 15px;
    transition: transform .25s, color .25s;
  }
  .note-row:hover .note-arrow {
    transform: translate(2px,-2px);
    color: var(--ink);
  }

  /* Waystation */
  .waystation { text-align: center; padding-top: 80px; }
  .mailbox-wrap {
    position: relative;
    width: 112px; height: 112px;
    margin: 10px auto 30px;
  }
  .mail-box { width: 112px; height: 112px; overflow: visible; display: block; }
  .mb-star { opacity: 0; }
  .mailbox-wrap:hover .mb-star {
    animation: starPop .85s cubic-bezier(.34,1.56,.64,1) 1 forwards;
  }
  @keyframes starPop {
    0%   { opacity: 0; transform: translate(0, 4px) scale(.3); }
    35%  { opacity: 1; }
    100% { opacity: 0; transform: translate(0, -18px) scale(1); }
  }
  .email-link {
    display: inline-block;
    font-family: var(--font-display);
    font-size: clamp(24px, 3.5vw, 36px);
    font-weight: 600;
    letter-spacing: -0.03em;
    padding-bottom: 6px;
    border-bottom: 1.5px solid var(--ink);
    transition: border-color .25s, color .25s;
  }
  .email-link:hover {
    color: var(--accent-orange);
    border-color: var(--accent-orange);
  }
  .socials {
    margin-top: 28px;
    display: flex; justify-content: center; gap: 28px;
  }
  .socials a {
    font-family: var(--font-display);
    font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .socials a:hover { color: var(--ink); }

  /* Open Road */
  .openroad {
    text-align: center;
    padding: 96px 24px 100px;
    border-top: 1px solid var(--line-faint);
  }
  .vanish {
    width: min(420px, 70%);
    height: 70px;
    margin-bottom: 28px;
  }
  .openroad-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 4.5vw, 48px);
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .openroad-title .zh {
    font-family: var(--font-cjk);
    letter-spacing: 0.12em;
    font-weight: 500;
  }
  .openroad-credit {
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); border: 0;
  }

  /* ── 滚动描出：进入视口后一笔画出 ── */
  .js .rv {
    opacity: 0; transform: translateY(16px);
    transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);
    transition-delay: var(--rvd, 0s);
  }
  .js .rv.in { opacity: 1; transform: none; }
  /* 空心标题：由父级 .in 触发描出 */
  .js .hollow {
    clip-path: inset(-40% 100% -40% -12px);
    transition: clip-path .55s cubic-bezier(.4,0,.2,1) .05s;
  }
  .js .section-head.in .hollow { clip-path: inset(-40% -12px -40% -12px); }

  .hint-pulse { animation: hintPulse 1.8s ease 1; }
  @keyframes hintPulse {
    0% { opacity: .5 } 30% { opacity: 1 } 50% { opacity: .55 }
    70% { opacity: 1 } 100% { opacity: .8 }
  }

  .work-art svg { transition: transform .55s cubic-bezier(.34,1.56,.64,1); }
  .work-card:hover .work-art svg { transform: translateY(-5px) rotate(-2deg); }
  .js .work-card.in:hover { transform: translateY(-3px); }
  .mascot-peek { transform-origin: 30% 100%; }
  .work-card:hover .mascot-peek {
    animation: peekKnock 1.1s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes peekKnock {
    0% { transform: rotate(0); }
    30% { transform: rotate(-10deg); }
    55% { transform: rotate(7deg); }
    78% { transform: rotate(-4deg); }
    100% { transform: rotate(0); }
  }

  @media (max-width: 880px) {
    #stage { height: min(58vh, 480px); }
    .sheet { margin: 0; border-radius: 0; border-left: none; border-right: none; }
    .section { padding: 56px 20px 40px; scroll-margin-top: 80px; }
    #stage { height: min(48vh, 360px); }
    .hero-copy { margin-top: -20px; padding: 4px 16px; }
    .hero-title { font-size: clamp(26px, 7vw, 40px); }
    .works-featured { grid-template-columns: 1fr; gap: 20px; }
    .work-card.featured:nth-child(even) { margin-top: 0; }
    .works-bento { grid-template-columns: 1fr 1fr; }
    .section-head {
      grid-template-columns: 1fr;
      justify-items: center;
      gap: 8px;
      margin-bottom: 36px;
    }
    .section-head .side { justify-content: center !important; }
    .hollow { font-size: clamp(32px, 10vw, 48px); }
    .hero-bar { padding: 4px 14px 14px; gap: 8px; }
    .hero-hint { text-align: left; min-width: 0; width: 100%; font-size: 11px; }
    .ctrl-btn { padding: 7px 10px; font-size: 10px; }
    .intro-ui { padding-bottom: 10px; }
  }
  @media (max-width: 540px) {
    .works-bento { grid-template-columns: 1fr; }
    .nav { padding: 14px 14px 10px; gap: 8px; }
    .nav-links a { padding: 6px 6px; font-size: 11px; letter-spacing: 0.04em; }
    .nav-brand { font-size: 13px; }
    .nav-lang { margin-left: 4px; padding: 6px 2px 6px 8px; font-size: 10px; }
    .note-row { grid-template-columns: 88px 1fr 18px; gap: 8px; padding: 16px 2px; }
    .about-manifesto { margin-bottom: 32px; }
    .timeline li { padding-bottom: 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .work-card, .work-arrow, .note-arrow, .btn-setout, .note-row { transition: none; }
    .js .rv { opacity: 1; transform: none; transition: none; }
    .js .hollow { clip-path: none; transition: none; }
    .work-art svg { transition: none; }
    .mailbox-wrap:hover .mb-star,
    .work-card:hover .mascot-peek,
    .work-card:hover .work-art svg,
    .hint-pulse { animation: none; }
  }
</style>
</head>
<body class="intro-lock">

<nav class="nav" aria-label="Primary">
  <div class="nav-brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3.5 17.5c5-1.5 8.5-6 14-14" stroke="#18181A" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M15 3.2l5.2 1.3-1.3 5.2" stroke="#18181A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3.5 17.5c1.3 1.5 3 1.8 5 1" stroke="#FF9F43" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span>lucky</span>
  </div>
  <div class="nav-right">
    <div class="nav-links">
      <a href="#works" data-i18n="nav.works">作品</a>
      <a href="#about" data-i18n="nav.about">关于</a>
      <a href="#notes" data-i18n="nav.notes">手记</a>
      <a href="#contact" data-i18n="nav.contact">联系</a>
    </div>
    <button class="nav-lang" id="lang-btn" type="button" aria-label="Switch language">EN</button>
    <button class="nav-sound" id="btn-sound" type="button" aria-pressed="false" aria-label="Sound">♪</button>
  </div>
</nav>

<div class="sheet">
  <div class="stage-wrap">
    <canvas id="stage" aria-label="Interactive road scene" role="img"></canvas>
    <div class="stage-hud" id="hud-km"></div>
    <div class="hud-btns">
      <button class="hud-btn" id="btn-pause" type="button" aria-label="Pause">⏸</button>
      <button class="hud-btn" id="btn-redraw" type="button" aria-label="Redraw">↺</button>
    </div>

<script>
(() => {

    renderWorks(); renderTimeline(); renderNotes();
    bindReveals();
  }

  function updateHint() {
    const touchHint = matchMedia("(hover: none), (pointer: coarse)").matches;
    const hint = document.getElementById("hero-hint");
    hint.textContent = t(touchHint ? "hero.hint.touch" : "hero.hint");
    // 交权后提示自动淡出
    if (hintTimer) clearTimeout(hintTimer);
    hint.style.opacity = "";
    if (mode === "play") hintTimer = setTimeout(() => { hint.style.opacity = "0"; }, 6000);
  }

  /* illustrations */
  const artSvg = (kind) => {
    const S = (inner) =>
      `<svg viewBox="0 0 200 140" fill="none" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
    const ink = 'stroke="#18181A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"';
    if (kind === "clock") return S(`
      <path d="M100 36a36 36 0 1 1 0 72 36 36 0 1 1 0-72M100 52a20 20 0 1 1 0 40 20 20 0 1 1 0-40" ${ink}/>
      <path d="M100 58v16l12 8M78 30l-8-10M122 30l8-10" ${ink}/>
      <path d="M150 96c6-2 8-8 4-12" ${ink}/>
    `);
    if (kind === "cat") return S(`
      <path d="M40 100h90M62 100c-2-22 14-38 36-28 10 4 14 16 12 28M78 72l-8-14 16 6M102 70l12-12 2 16" ${ink}/>
      <path d="M86 82h2M100 82h2M92 92c2 2 6 2 8 0M140 48c10 2 12 12 4 16" ${ink}/>
    `);
    if (kind === "pen") return S(`
      <path d="M48 108c24-10 48-36 80-62M122 36l22 8-8 22-20-10 6-20z" ${ink}/>
      <path d="M56 112h2M68 106h1" ${ink}/>
    `);
    if (kind === "list") return S(`
      <path d="M64 36h72v88H64zM64 28h56" ${ink}/>
      <path d="M80 58h40M80 78h40M80 98h26" ${ink}/>
    `);
    return S(`<path d="M68 44h64v52H68zM68 62h64" ${ink}/>`);
  };

  const peekSvg = `
    <svg class="mascot-peek" viewBox="0 0 56 56" aria-hidden="true">
      <ellipse cx="28" cy="36" rx="17" ry="15" fill="#C4A574" stroke="#18181A" stroke-width="1.4"/>
      <circle cx="17" cy="18" r="5.5" fill="#C4A574" stroke="#18181A" stroke-width="1.3"/>
      <circle cx="38" cy="18" r="5.5" fill="#C4A574" stroke="#18181A" stroke-width="1.3"/>
      <rect x="36" y="30" width="13" height="15" rx="3" fill="#FFDE59" stroke="#18181A" stroke-width="1.2"/>
      <circle cx="22" cy="36" r="1.5" fill="#18181A"/>
      <circle cx="33" cy="36" r="1.5" fill="#18181A"/>
      <path d="M26 42c2 1 4 1 6 0" stroke="#18181A" stroke-width="1.2" stroke-linecap="round"/>
    </svg>`;

  function renderWorks() {
    const all = (window.WORKS || []).filter((w) => w.status !== "draft");
    all.sort((a, b) => (a.order || 0) - (b.order || 0));
    const featured = all.filter((w) => w.status === "featured").slice(0, 2);
    const bento = all.filter((w) => w.status === "bento");
    const peeked = new Set();

    const card = (w, kind, allowPeek, idx) => {
      const title = (w.title && (w.title[lang] || w.title.en)) || w.id;
      const tagline = (w.tagline && (w.tagline[lang] || w.tagline.en)) || "";
      const meta = (w.meta && (w.meta[lang] || w.meta.en)) || "";
      const doPeek = allowPeek && w.mascot === "peek" && !peeked.size;
      if (doPeek) peeked.add("peek");
      const d = (idx * 0.07).toFixed(2);
      return `<a class="work-card ${kind} rv" style="--rvd:${d}s" href="${w.link || "#"}">
        ${doPeek ? peekSvg : ""}
        <div class="work-art">${artSvg(w.art)}</div>
        <h3 class="work-title">${title}</h3>
        <p class="work-tagline">${tagline}</p>
        <p class="work-meta">${meta}</p>
        <span class="work-arrow" aria-hidden="true">↗</span>
      </a>`;
    };

    const fEl = document.getElementById("works-featured");
    const bEl = document.getElementById("works-bento");
    if (!all.length) {
      fEl.innerHTML = "";
      bEl.innerHTML = `<div class="works-empty rv">${t("works.empty")}</div>`;
      return;
    }
    fEl.innerHTML = featured.map((w, i) => card(w, "featured", true, i)).join("");
    bEl.innerHTML = bento.map((w, i) => card(w, "bento", false, i)).join("");
  }

  function renderTimeline() {
    document.getElementById("timeline").innerHTML = (TIMELINE[lang] || TIMELINE.en)
      .map((r, i) => `<li class="rv" style="--rvd:${(i * 0.12).toFixed(2)}s"><div class="year">${r.year}</div><div class="event">${r.event}</div></li>`)
      .join("");
  }

  function renderNotes() {
    document.getElementById("notes-list").innerHTML = (NOTES[lang] || NOTES.en)
      .map((n, i) => `<a class="note-row rv" style="--rvd:${(i * 0.08).toFixed(2)}s" href="#">
        <span class="note-date">${n.date}</span>
        <span class="note-title${lang === "zh" ? " zh" : ""}">${n.title}</span>
        <span class="note-arrow" aria-hidden="true">↗</span></a>`)
      .join("");
  }

  document.getElementById("lang-btn").addEventListener("click", () => {
    lang = lang === "zh" ? "en" : "zh";
    applyI18n();
  });

  document.body.classList.add("js");

  /* 占位链接（href="#"）：原型期拦截默认跳转，避免「点一下飞回开头」 */
  document.addEventListener("click", (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[href="#"]') : null;
    if (a) e.preventDefault();
  });

  /* ── 滚动描出：进入视口后一笔画出 ── */
  const revealIO = "IntersectionObserver" in window
    ? new IntersectionObserver((entries) => {
        for (const en of entries) {
          if (en.isIntersecting) {
            en.target.classList.add("in");
            revealIO.unobserve(en.target);
          }
        }
      }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" })
    : null;
  const revealedSet = new WeakSet();
  function bindReveals() {
    document.querySelectorAll(".rv:not(.in)").forEach((el) => {
      if (revealedSet.has(el)) return;
      revealedSet.add(el);
      if (!revealIO) { el.classList.add("in"); return; }
      revealIO.observe(el);
    });
  }

  /* 当前章节高亮（裸导航下划线） */
  const navAnchors = () => document.querySelectorAll(".nav-links a");
  function syncNavActive() {
    const ids = ["works", "about", "notes", "contact"];
    let active = null;
    for (const id of ids) {
      const el = document.getElementById(id);
      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (r.top <= 140 && r.bottom > 140) active = id;
    }
    navAnchors().forEach((a) => {
      const href = a.getAttribute("href") || "";
      a.classList.toggle("active", active && href === "#" + active);
    });
  }
  window.addEventListener("scroll", syncNavActive, { passive: true });
  syncNavActive();

  /* ═══════════ Canvas scene ═══════════ */
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const hudKmEl = document.getElementById("hud-km");
  let W = 0, H = 0, dpr = 1, baseY = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth || window.innerWidth;
    // 未布局时不写死 640，避免 baseY 算歪
    H = canvas.clientHeight || Math.round((window.innerHeight || 800) * 0.55);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    baseY = H * 0.64;
    // 未出发时篝火始终对齐小队中心；出发后为世界物，不再随窗口挪动
    if (cameraX === 0) fireX = W * 0.22;
  }
  window.addEventListener("resize", () => { resize(); });

  let seed = (() => {
    const q = parseInt(new URLSearchParams(location.search).get("seed"), 10);
    return Number.isFinite(q) ? q >>> 0 : 20260215;   // ?seed= 可分享（文档 §4.4）
  })();
  const srand = (s) => { seed = s >>> 0; };
  const rnd = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 物理初值（文档 §5.3）
  const P = {
    gravity: 2600, jumpV: -860, slideDur: 0.75, speed: 120,
    bufferJump: 0.08, bufferSlide: 0.06, coyote: 0.08,
    stumbleDur: 1.5, rejoinBoost: 1.15,
  };

  let cameraX = 0, paused = false;
  let mode = reduceMotion ? "await" : "camp"; // camp → point → walk → play
  let modeT = 0;
  let pathPoints = [];
  let objects = [];
  let obstacles = [];
  let particles = [];
  let stumbleT = 0, jumpBuf = 0, coyote = 0;
  let jumping = false, sliding = 0, slideBuf = 0, vy = 0, playerY = 0;
  let penAng = 0.35, penDrop = 0, pointLand = false, flashT = 0;
  let idleT = 0;          // 无输入计时 → idle 波浪示范
  let departBlend = 0;    // 起身起跑进度：步频/贴地姿态渐入行进（位置恒在队形上，无位移混合）
  let gaitBoost = 1;      // 踉跄归队 1.15×
  let hintPulsed = false;
  let stageVisible = true;
  let fireX = 263;        // 篝火世界坐标 = 开镜小队中心（0.22·W），由 resetWorld/resize 派生
  let drawnX = 420;       // 地线已画到哪（补画前沿）：skip/重绘后从营地端快速追到笔尖
  let speedRamp = 120;    // 节奏曲线：120 → 190（+0.8/s），踉跄回落 40
  let prevY = 0;          // 落地检测（上一帧高度）
  let lastMile = 0;       // 里程碑计数（每 1000px = 100m）
  let bestMile = 0;       // 本 seed 最佳里程碑（localStorage，仅本地）
  let hintTimer = 0;
  const isTouch = matchMedia("(pointer: coarse)").matches;
  // 夜空点缀随系统时间（22:00–5:00 月牙与星）；纸面恒为纸白
  const isNight = (() => { const h = new Date().getHours(); return h >= 22 || h < 5; })();

  // 平滑值噪声（手绘抖动），替代毛糙的白噪声
  function hash1(i) {
    const s = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function noise1(x) {
    const i = Math.floor(x), f = x - i;
    const u = f * f * (3 - 2 * f);
    return (hash1(i) * (1 - u) + hash1(i + 1) * u) * 2 - 1;
  }

  function terrainY(worldX) {
    // 营地段近水平，500 后平滑接入起伏（避免台阶/折角）
    const k = worldX < 420 ? 0 : worldX > 620 ? 1 : (worldX - 420) / 200;
    const s = k * k * (3 - 2 * k);
    let y = baseY + (10 * Math.sin(worldX / 320) + 4 * Math.sin(worldX / 110 + 0.7)) * s;
    for (const o of obstacles) {
      const dx = worldX - o.x;
      const hw = o.w;
      if (dx > -hw && dx < hw) {
        const u = dx / hw;
        const bell = Math.cos((u * Math.PI) / 2);
        if (o.type === "pit" || o.type === "stream") y += (o.depth || 22) * bell * bell;
        if (o.type === "valley") y += 18 * bell * bell;
        if (o.type === "rock" || o.type === "stone") y -= (o.h || 14) * bell * bell;
        if (o.type === "mud") y += 10 * bell * bell;
      }
    }
    return y + (noise1(worldX * 0.11) * 0.7 + noise1(worldX * 0.03) * 0.5) * s;
  }
  const tangentAt = (wx) => (terrainY(wx + 4) - terrainY(wx - 4)) / 8;

  /* ── 一笔画场景 ──
     除天空云朵外，全部由笔尖 stroke-reveal 描出。
     back: 角色身后的单线轮廓（一笔一条）
     front: 滑行时的前景遮挡（桥面/洞顶，白填充压在角色上） */
  function objectStrokes(kind) {
    // 小屋：墙 + 坡顶 + 门 + 烟囱与一缕淡烟
    if (kind === "cabin") return [
      [[-22, 0], [-22, -24], [0, -44], [22, -24], [22, 0], [-22, 0]],
      [[-7, 0], [-7, -14], [7, -14], [7, 0]],
      [[9, -33], [9, -42], [14, -42], [14, -36]],
      [[13, -48], [11, -53], [15, -58], [13, -63]],
    ];
    // 树：细干 + 圆云冠（避免像屋顶）
    if (kind === "tree") return [[
      [-2, 0], [-2, -20],
      [-14, -26], [-22, -36], [-18, -48], [-4, -54],
      [10, -54], [22, -48], [24, -36], [14, -26], [2, -20], [2, 0],
    ]];
    // 钟楼：檐口塔身 + 尖顶 + 圆表盘 + 指针
    if (kind === "clocktower") return [
      [[-10, 0], [-10, -58], [-14, -62], [0, -82], [14, -62], [10, -58], [10, 0], [-10, 0]],
      // 表盘（圆）
      [[0, -50], [-7, -48], [-8, -42], [-5, -37], [0, -35], [5, -37], [8, -42], [7, -48], [0, -50]],
      // 指针
      [[0, -42], [0, -37], [5, -40]],
    ];
    // 小店：墙 + 波浪雨棚 + 门
    if (kind === "shop") return [
      [[-16, 0], [-16, -28], [16, -28], [16, 0], [-16, 0]],
      [[-20, -28], [-16, -34], [-8, -34], [-4, -28], [4, -28], [8, -34], [16, -34], [20, -28]],
      [[-7, 0], [-7, -14], [7, -14], [7, 0]],
    ];
    // 石桥：外拱 + 内拱（两笔）
    if (kind === "bridge") return [
      [[-40, 0], [-40, -12], [-30, -28], [0, -38], [30, -28], [40, -12], [40, 0]],
      [[-26, 0], [-26, -8], [-14, -18], [0, -24], [14, -18], [26, -8], [26, 0]],
    ];
    // 山洞：岩丘外轮廓 + 洞口（两笔）
    if (kind === "cave") return [
      [[-38, 0], [-34, -18], [-20, -36], [0, -44], [20, -36], [34, -18], [38, 0]],
      [[-22, 0], [-18, -8], [0, -18], [18, -8], [22, 0]],
    ];
    // 山坡：双峰
    if (kind === "hill") return [[
      [-46, 0], [-28, -14], [-12, -22], [0, -14], [16, -24], [32, -12], [46, 0],
    ]];
    // 小溪：只画水纹（谷形交给 terrainY，避免叠成 X）
    if (kind === "stream") return [
      [[-18, -4], [-9, -7], [0, -4], [9, -7], [18, -4]],
      [[-12, -11], [-3, -13], [6, -11], [14, -13]],
    ];
    // 山谷：两侧草痕（不重复画谷底线）
    if (kind === "valley") return [
      [[-20, -1], [-16, -7], [-12, -2]],
      [[12, -2], [16, -7], [20, -1]],
    ];
    // 花丛：三朵错落
    if (kind === "flower") return [
      [[-12, 0], [-12, -12], [-16, -16], [-12, -20], [-8, -16], [-12, -12]],
      [[-2, -1], [-2, -18], [-6, -23], [-2, -28], [2, -23], [-2, -18]],
      [[10, 0], [10, -11], [7, -15], [10, -19], [13, -15], [10, -11]],
    ];
    // 石头：带棱面的石块
    if (kind === "stone") return [
      [[-16, 0], [-18, -10], [-6, -20], [12, -16], [16, -5], [10, 0], [-16, 0]],
      [[-6, -8], [4, -13]],
    ];
    // 土坑：坑口椭圆 + 内缘
    if (kind === "mud") return [
      [[-18, 1], [-16, 6], [0, 9], [16, 6], [18, 1], [0, -2], [-18, 1]],
      [[-10, 2], [0, 4], [10, 2]],
    ];
    // 蘑菇
    if (kind === "mush") return [[
      [-3, 0], [-3, -9], [-10, -9], [-7, -17], [0, -20], [8, -16], [10, -9], [3, -9], [3, 0],
    ]];
    // 木箱
    if (kind === "crate") return [[
      [-14, 0], [-14, -18], [14, -18], [14, 0], [-14, 0],
      [-14, -9], [14, -9], [10, -18], [10, 0], [-10, 0], [-10, -18],
    ]];
    // 指路牌
    if (kind === "sign") return [
      [[-2, 0], [-2, -26], [-16, -26], [-16, -38], [16, -38], [16, -26], [5, -26], [5, 0]],
      [[-9, -32], [7, -32], [2.5, -35.5], [7, -32], [2.5, -28.5]],
    ];
    // 里程碑石：立石 + 小旗
    if (kind === "milestone") return [
      [[-6, 0], [-8, -14], [-3, -26], [5, -26], [7, -12], [4, 0], [-6, 0]],
      [[5, -26], [14, -23], [5, -19]],
    ];
    return [[[0, 0], [0, -8]]];
  }

  /** 物件度量：路径总长、占宽、笔尖需走过的距离（复杂件更长） */
  function ensureMetrics(o) {
    if (o._m) return o._m;
    if (!o.strokes) o.strokes = objectStrokes(o.kind);
    let total = 0, minX = 1e9, maxX = -1e9;
    for (const st of o.strokes) {
      total += strokeTotal(st);
      for (const p of st) {
        if (p[0] < minX) minX = p[0];
        if (p[0] > maxX) maxX = p[0];
      }
    }
    const s = o.s || 1;
    const span = Math.max(24, (maxX - minX) * s);
    // 笔尖空间行程 ≈ 路径长（复杂度）与占宽的加权 — 复杂地貌画更久
    const travel = Math.max(span * 1.15, total * s * 0.62);
    o._m = { total, span, travel, halfW: span / 2 };
    return o._m;
  }

  /** 前景遮挡：滑行时压住角色（白填充，轮廓在 back 随笔描出） */
  function objectFrontStrokes(kind) {
    if (kind === "bridge") {
      return [{
        fill: [[
          [-40, 0], [-40, -12], [-30, -28], [0, -38], [30, -28], [40, -12], [40, 0],
          [26, 0], [26, -8], [14, -18], [0, -24], [-14, -18], [-26, -8], [-26, 0], [-40, 0],
        ]],
        stroke: [],
      }];
    }
    if (kind === "cave") {
      return [{
        fill: [[
          [-38, 0], [-34, -18], [-20, -36], [0, -44], [20, -36], [34, -18], [38, 0],
          [22, 0], [18, -8], [0, -18], [-18, -8], [-22, 0], [-38, 0],
        ]],
        stroke: [],
      }];
    }
    return null;
  }

  function strokeTotal(points) {
    let L = 0;
    for (let i = 1; i < points.length; i++) {
      const dx = points[i][0] - points[i - 1][0];
      const dy = points[i][1] - points[i - 1][1];
      L += Math.hypot(dx, dy);
    }
    return L;
  }

  /** draw polyline only up to `progress` (0-1) of total length */
  function drawStrokeReveal(pts, progress, ox, oy, scale) {
    if (progress <= 0) return;
    const total = strokeTotal(pts);
    if (total === 0) return;
    let remain = total * Math.min(1, progress);
    ctx.beginPath();
    ctx.moveTo(ox + pts[0][0] * scale, oy + pts[0][1] * scale);
    for (let i = 1; i < pts.length; i++) {
      const x0 = pts[i - 1][0], y0 = pts[i - 1][1];
      const x1 = pts[i][0], y1 = pts[i][1];
      const seg = Math.hypot(x1 - x0, y1 - y0);
      if (remain >= seg) {
        ctx.lineTo(ox + x1 * scale, oy + y1 * scale);
        remain -= seg;
      } else if (remain > 0) {
        const r = remain / seg;
        ctx.lineTo(ox + (x0 + (x1 - x0) * r) * scale, oy + (y0 + (y1 - y0) * r) * scale);
        remain = 0;
        break;
      } else break;
    }
    ctx.stroke();
  }

  /** 估算物件半宽（未建 strokes 时按 kind 估值） */
  function halfWidthOf(kind, s) {
    const rough = {
      cabin: 22, tree: 22, clocktower: 14, shop: 20, hill: 46,
      stream: 18, valley: 22, flower: 14, stone: 16, mud: 18,
      bridge: 40, cave: 38, mush: 10, crate: 14, sign: 16,
    };
    return (rough[kind] || 16) * (s || 1);
  }

  /** 在不与已有地貌重合的前提下落一件 */
  function placeObject(cursorX, kind, s, withObstacle) {
    const hw = halfWidthOf(kind, s);
    const minGap = 48;
    let x = cursorX + hw + minGap + rnd() * 40;
    // 若与已有 objects 过近则右推（双保险）
    for (let guard = 0; guard < 8; guard++) {
      let hit = false;
      for (const e of objects) {
        const eh = halfWidthOf(e.kind, e.s || 1);
        if (Math.abs(x - e.x) < hw + eh + minGap * 0.7) { hit = true; break; }
      }
      if (!hit) break;
      x += 70;
    }
    const obj = { x, kind, s: s || 1, p: 0, on: false, strokes: null };
    objects.push(obj);
    if (withObstacle === "jump-pit") obstacles.push({ x, type: "stream", w: 28, depth: 18 });
    else if (withObstacle === "jump-valley") obstacles.push({ x, type: "valley", w: 36, depth: 22 });
    else if (withObstacle === "jump-mud") obstacles.push({ x, type: "mud", w: 22, depth: 14 });
    else if (withObstacle === "jump-stone") obstacles.push({ x, type: "stone", w: 18, h: 16 });
    else if (withObstacle === "roll-bridge") obstacles.push({ x, type: "roll", w: 36, clear: 22, tall: 38 });
    else if (withObstacle === "roll-cave") obstacles.push({ x, type: "roll", w: 34, clear: 20, tall: 44 });
    return x + hw;
  }

  function ensureWorld(xTo) {
    // 生成牌堆：11 类地貌各至少按序出现，再洗牌循环（治「缺项」）
    if (!ensureWorld._deck) {
      ensureWorld._deck = [
        "cabin", "tree", "hill", "stream", "flower", "stone",
        "valley", "bridge", "mud", "cave", "clocktower", "shop",
        "combo-pits", "tree", "flower", "hill", "mush",
        "combo-bridge-pit",
      ];
    }
    if (ensureWorld._i == null) ensureWorld._i = 0;
    if (ensureWorld._cursor == null) ensureWorld._cursor = 700;

    while (obstacles.length < 50) {
      const xHint = ensureWorld._cursor;
      if (xHint > xTo + 1500 && obstacles.length > 3) break;

      // 营地段（<900）只出风景，禁止 roll 桥/洞挖断地线
      if (xHint < 900) {
        const k = ensureWorld._deck[ensureWorld._i++ % ensureWorld._deck.length];
        if (["cabin", "tree", "clocktower", "shop", "hill", "flower", "mush"].includes(k)) {
          ensureWorld._cursor = placeObject(xHint, k, 0.9 + rnd() * 0.25, null);
        } else {
          ensureWorld._cursor = xHint + 200;
        }
        continue;
      }

      const k = ensureWorld._deck[ensureWorld._i++ % ensureWorld._deck.length];
      if (ensureWorld._i % ensureWorld._deck.length === 0) {
        for (let i = ensureWorld._deck.length - 1; i > 0; i--) {
          const j = (rnd() * (i + 1)) | 0;
          const t = ensureWorld._deck[i];
          ensureWorld._deck[i] = ensureWorld._deck[j];
          ensureWorld._deck[j] = t;
        }
      }

      let right;
      if (k === "stream") right = placeObject(xHint, "stream", 1, "jump-pit");
      else if (k === "valley") right = placeObject(xHint, "valley", 1, "jump-valley");
      else if (k === "mud") right = placeObject(xHint, "mud", 1, "jump-mud");
      else if (k === "stone") right = placeObject(xHint, "stone", 1, "jump-stone");
      else if (k === "bridge") right = placeObject(xHint, "bridge", 1, isTouch && ensureWorld._i % 2 === 0 ? null : "roll-bridge");
      else if (k === "cave") right = placeObject(xHint, "cave", 1, isTouch && ensureWorld._i % 2 === 0 ? null : "roll-cave");
      else if (k === "combo-pits") {
        const x1 = placeObject(xHint, "stream", 1, "jump-pit");
        right = placeObject(x1 + 58, "stream", 1, "jump-pit");
      }
      else if (k === "combo-bridge-pit") {
        const x1 = placeObject(xHint, "bridge", 1, isTouch && ensureWorld._i % 2 === 0 ? null : "roll-bridge");
        right = placeObject(x1 + 70, "stream", 1, "jump-pit");
      }
      else {
        right = placeObject(xHint, k, 0.88 + rnd() * 0.28, null);
        // 伴生也走防重叠
        if (rnd() < 0.35) {
          const ck = ["tree", "flower", "mush"][(rnd() * 3) | 0];
          right = placeObject(right, ck, 0.75 + rnd() * 0.25, null);
        }
      }
      // 间距随节奏曲线等比放大：速度上升时时间节奏保持连贯
      ensureWorld._cursor = right + (60 + rnd() * 80) * (speedRamp / 120);
    }
    // 里程碑石：每 1000px（100m）由笔画出
    ensureWorld._mile = ensureWorld._mile || 1000;
    while (ensureWorld._mile < xTo) {
      placeObject(ensureWorld._mile, "milestone", 1, null);
      ensureWorld._mile += 1000;
    }
    const penX = cameraX + W * 0.85;
    if (!pathPoints.length) pathPoints.push({ x: 0 });
    let lastX = pathPoints[pathPoints.length - 1].x;
    // 统一 5px 步长，避免 5/6 混用在衔接处留缝
    while (lastX < penX) {
      lastX += 5;
      pathPoints.push({ x: lastX });
      if (pathPoints.length > 2400) pathPoints.splice(0, 240);
    }
    // 回收离场对象：内存平稳，路径点有上限
    const keepFrom = cameraX - 400;
    while (obstacles.length && obstacles[0].x < keepFrom) obstacles.shift();
    while (objects.length && objects[0].x < keepFrom) objects.shift();
  }

  function resetWorld(newSeed) {
    srand(newSeed);
    cameraX = 0;
    fireX = W * 0.22;   // 单一锚点：篝火 = 开镜小队中心（与队形同源，任意窗宽重合）
    drawnX = mode === "play" ? 420      // 行进中重绘：地线回营地端，补画前沿快速重描
      : cameraX + W * 0.85;             // 首次进入/营地态：预画到笔尖（LCP，地面已存在）
    speedRamp = 120; lastMile = 0;
    try { bestMile = parseInt(localStorage.getItem("lucky.best." + newSeed), 10) || 0; } catch (err) { bestMile = 0; }
    // 营地段预画地线（t=0 即可见、略粗）：只存 x，Y 绘制时现算
    pathPoints = [];
    for (let x = 0; x <= 420; x += 5) {
      pathPoints.push({ x });
    }
    obstacles = [];
    // 村落开镜：屋舍在小队身后（跟随 0.22·W 锚点，pre-drawn），前方只有路
    objects = [
      { x: fireX - 205, kind: "cabin", s: 0.92, p: 1, on: true, strokes: null },
      { x: fireX - 112, kind: "shop", s: 0.88, p: 1, on: true, strokes: null },
      { x: fireX + 300, kind: "tree", s: 1.0, p: 1, on: true, strokes: null },
      { x: fireX + 620, kind: "clocktower", s: 0.85, p: 1, on: true, strokes: null },
    ];
    particles = [];
    playerY = 0; vy = 0; jumping = false; sliding = 0;
    stumbleT = 0; gaitBoost = 1;
    departBlend = mode === "camp" || mode === "point" ? 0 : departBlend;
    // 生成游标从营地塔之后开始，禁止与营地地貌重合
    ensureWorld._cursor = 880;
    ensureWorld._mile = 1000;
    ensureWorld._i = ensureWorld._i || 0;
    ensureWorld(cameraX + W + 200);
  }

  const playerWorldX = () => cameraX + W * 0.22;

  const INK_MAX = 64; // 粒子池上限（文档 §9.3）
  function emitParticles(x, y, n, burst) {
    for (let i = 0; i < n; i++) {
      if (particles.length >= INK_MAX) return;
      const a = rnd() * Math.PI * 2;
      const sp = burst ? 50 + rnd() * 90 : 18 + rnd() * 40;
      const r = rnd();
      particles.push({
        x, y,
        vx: Math.cos(a) * sp * (r < 0.6 ? -0.55 : 1),  // 铅屑向后飘
        vy: -Math.abs(Math.sin(a)) * sp * 0.6 - 8,
        life: 0.35 + rnd() * 0.25,
        t: 0, r: 0.5 + rnd() * 1.2,
        // 墨点 / 铅屑 / 星光 ≈ 3:6:1（文档 §4.3）
        kind: r < 0.3 ? "ink" : r < 0.9 ? "fleck" : "star",
      });
    }
  }

  /** Reveal objects as the pen passes — pen draws them into existence */
  function revealByPen(dt) {
    // 描出前沿 = 地线已画到的位置；skip/重绘后的快速补画时物件随前沿一起出现
    const front = mode === "await" ? cameraX + W * 0.85 : drawnX;
    for (const o of objects) {
      const m = ensureMetrics(o);
      // 笔尖进入物件左缘即开始描出
      const start = o.x - m.halfW - 6;
      if (!o.on && front >= start) o.on = true;
      if (!o.on) continue;
      if (mode === "await") { o.p = 1; continue; }
      // 空间描出：p 跟前沿位移走；复杂件 travel 更长 → 画得更慢
      o.p = Math.max(0, Math.min(1, (front - start) / m.travel));
    }
  }

  /** 补画前沿追赶笔尖：正常行进时贴着笔，skip/重绘后 0.3–0.5s 把欠账快速画完 */
  function advanceFront(dt) {
    const penX = cameraX + W * 0.85;
    drawnX = Math.min(penX, drawnX + Math.max(P.speed * dt, (penX - drawnX) * Math.min(1, dt * 6)));
  }

  function drawPath() {
    if (pathPoints.length < 2) return;
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    // 单条连续折线：无分段、无断口，杜绝竖线接缝；只画到补画前沿
    ctx.beginPath();
    for (let i = 0; i < pathPoints.length; i++) {
      const x = pathPoints[i].x;
      if (x > drawnX) break;
      const sx = x - cameraX;
      const sy = terrainY(x);
      if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }

  function drawObjects(layer) {
    // layer: 'back' | 'front'
    ctx.lineWidth = 1.55;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (const o of objects) {
      const sx = o.x - cameraX;
      if (sx < -120 || sx > W + 120) continue;
      if (o.p <= 0) continue;
      const sy = terrainY(o.x);
      const sc = o.s || 1;

      if (layer === "back") {
        const m = ensureMetrics(o);
        // 按各笔路径长度分配进度（外轮廓先画完，再画内缘/细节）
        const lens = o.strokes.map((st) => strokeTotal(st));
        const sum = lens.reduce((a, b) => a + b, 0) || 1;
        let acc = 0;
        for (let si = 0; si < o.strokes.length; si++) {
          const t0 = acc / sum;
          const t1 = (acc + lens[si]) / sum;
          acc += lens[si];
          const sp = Math.max(0, Math.min(1, (o.p - t0) / (t1 - t0 || 1)));
          if (sp <= 0) continue;
          drawStrokeReveal(o.strokes[si], sp, sx, sy, sc);
        }
      } else if (layer === "front") {
        const front = objectFrontStrokes(o.kind);
        if (!front || o.p < 0.85) continue;
        const fade = Math.min(1, (o.p - 0.85) / 0.15);
        for (const f of front) {
          // 白填充实体 → 角色被遮挡（轮廓已在 back 随笔尖描出，这里只填遮挡）
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.fillStyle = "#FFFFFF";
          ctx.beginPath();
          const fp = f.fill[0];
          ctx.moveTo(sx + fp[0][0] * sc, sy + fp[0][1] * sc);
          for (let i = 1; i < fp.length; i++)
            ctx.lineTo(sx + fp[i][0] * sc, sy + fp[i][1] * sc);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }
    }
  }

  /** 神笔。show: 0–1 落位进度（point 阶段从空中压下）；dt: 低通用 */
  function drawPen(show, dt) {
    if (show <= 0) return;
    const penX = W * 0.85;
    const worldPen = cameraX + penX;
    // 笔尖严格锁在路径最前端（与 ensureWorld / particles 同一公式）
    const tipX = worldPen;
    const tipY = terrainY(tipX);
    const target = 0.22 + Math.max(-0.26, Math.min(0.26, Math.atan(tangentAt(tipX)) * 0.85));
    penAng += (target - penAng) * Math.min(1, (dt || 0.016) * 8);
    const still = mode === "await";
    // bob 只作用笔杆，不作用笔尖
    const bob = still ? 0 : Math.sin(modeT * 10) * 0.35;

    ctx.save();
    ctx.globalAlpha = show;
    const drop = 1 + (1 - show) * 0.18;
    // 锚点 = 笔尖 (0,0)，且该点就是 (penX, tipY)
    ctx.translate(penX, tipY);
    ctx.rotate(penAng + (still ? 0 : noise1(modeT * 3) * 0.012));
    ctx.scale(drop, drop);
    // 笔杆相对尖端的微浮（尖端保持贴线）
    ctx.translate(0, bob);

    // 小笔：约 20px 高（对齐参考图「小工具」体量）
    const L = Math.max(16, Math.min(H * 0.025, 22));
    const hw = L * 0.035;

    ctx.lineWidth = 1.15;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-hw * 0.7, -L * 0.16);
    ctx.lineTo(-hw, -L);
    ctx.lineTo(hw, -L);
    ctx.lineTo(hw * 0.7, -L * 0.16);
    ctx.closePath();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-hw * 0.94, -L + L * 0.16);
    ctx.lineTo(hw * 0.94, -L + L * 0.16);
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = Math.max(0, a);
      if (p.kind === "star") {
        ctx.strokeStyle = "#FFDE59";
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(p.x - 3, p.y); ctx.lineTo(p.x + 3, p.y);
        ctx.moveTo(p.x, p.y - 3); ctx.lineTo(p.x, p.y + 3);
        ctx.stroke();
      } else if (p.kind === "fleck") {
        ctx.fillStyle = "rgba(24,24,26,0.35)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 0.7, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = "#18181A";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* 角色：干净比例 + 自然行走循环 + 翻滚（720°/0.55s，文档 §3/§5.3） */
  function walkPose(time, phase) {
    // 快步跑：大一点的步幅 + 前倾，避免「原地滑步」
    const p = time * 13 + phase;
    return {
      bob: Math.abs(Math.sin(p)) * 1.4,
      legL: Math.sin(p) * 7,
      legR: Math.sin(p + Math.PI) * 7,
      lean: 0.1 + Math.sin(p) * 0.03,
    };
  }
  // 翻滚姿态：以身体中心为轴 720° 自旋 + 压扁（hitbox ×0.4）
  /** 滑行：压低身姿 + 前倾，不自旋 */
  function applySlide(sx, sy) {
    ctx.rotate(-0.28);
    ctx.scale(sx, sy);
  }

  function drawChestnut(x, y, squash, time, roll, phase, pose) {
    const w = walkPose(time, phase || 0);
    ctx.save();
    ctx.translate(x, y);
    const s = 0.8;
    if (roll != null) applySlide(s * 1.18, s * 0.48);
    else {
      ctx.translate(0, -w.bob);
      ctx.rotate(w.lean);
      ctx.scale(s, s * (1 - squash * 0.08));
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 柠檬黄小背包（白底品牌点缀）
    ctx.fillStyle = "#FFDE59";
    ctx.beginPath();
    ctx.moveTo(11, -17); ctx.lineTo(16.5, -17); ctx.lineTo(16.5, -6); ctx.lineTo(11, -6);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // 身 + 头 + 双耳：一笔连续
    ctx.beginPath();
    ctx.moveTo(-5, -7);
    ctx.quadraticCurveTo(-7, -16, -5, -22);
    ctx.quadraticCurveTo(-8, -29, -2, -27);
    ctx.quadraticCurveTo(1, -33, 5, -28);
    ctx.quadraticCurveTo(11, -28, 11, -20);
    ctx.quadraticCurveTo(12, -12, 8, -7);
    ctx.stroke();

    // 尾
    ctx.beginPath();
    ctx.moveTo(-5, -11);
    ctx.quadraticCurveTo(-13, -15, -11, -23);
    ctx.stroke();

    // 腿（翻滚时收起）
    if (roll != null) {
      ctx.beginPath();
      ctx.moveTo(-3, -6); ctx.quadraticCurveTo(-1, -2, -4, -1);
      ctx.moveTo(4, -6); ctx.quadraticCurveTo(6, -2, 3, -1);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-2, -5); ctx.lineTo(-2 + w.legL, 0);
      ctx.moveTo(3, -5); ctx.lineTo(3 + w.legR, 0);
      ctx.stroke();
    }

    // 姿态：伸懒腰（营地呼吸）/ 指路（出发仪式，文档 §6.1）
    if (pose === "stretch") {
      ctx.beginPath();
      ctx.moveTo(0, -26); ctx.quadraticCurveTo(-2 - Math.sin(time * 2) * 1.5, -31, -4, -34);
      ctx.moveTo(6, -25); ctx.quadraticCurveTo(8 + Math.sin(time * 2) * 1.5, -30, 10, -33);
      ctx.stroke();
    } else if (pose === "point") {
      ctx.beginPath();
      ctx.moveTo(4, -21);
      ctx.quadraticCurveTo(10, -22, 15, -19);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(15.5, -19, 1, 0, Math.PI * 2);
      ctx.fillStyle = "#18181A"; ctx.fill();
    }

    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    ctx.arc(0, -21, 0.85, 0, Math.PI * 2);
    ctx.arc(5, -21, 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawCloudy(x, y, squash, time, roll, phase) {
    const w = walkPose(time, phase != null ? phase : 1.3);
    ctx.save();
    ctx.translate(x, y);
    const s = 0.8;
    if (roll != null) applySlide(s * 1.18, s * 0.48);
    else {
      ctx.translate(0, -w.bob);
      ctx.rotate(w.lean);
      ctx.scale(s, s * (1 - squash * 0.08));
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 垂耳兔：一笔耳→头→身→耳（白填充遮住背后的线条）
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.moveTo(-7, -12);
    ctx.quadraticCurveTo(-13, -4, -11, 3);
    ctx.quadraticCurveTo(-7, -1, -6, -11);
    ctx.quadraticCurveTo(-4, -24, 3, -25);
    ctx.quadraticCurveTo(9, -24, 10, -16);
    ctx.quadraticCurveTo(14, -8, 15, 1);
    ctx.quadraticCurveTo(12, -6, 9, -12);
    ctx.quadraticCurveTo(10, -5, 5, -3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    if (roll != null) {
      ctx.beginPath();
      ctx.moveTo(-2, -6); ctx.quadraticCurveTo(0, -2, -3, -1);
      ctx.moveTo(4, -6); ctx.quadraticCurveTo(6, -2, 3, -1);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-1, -3); ctx.lineTo(-1 + w.legL, 0);
      ctx.moveTo(3, -3); ctx.lineTo(3 + w.legR, 0);
      ctx.stroke();
    }

    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    ctx.arc(1, -17, 0.85, 0, Math.PI * 2);
    ctx.arc(6, -17, 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawKuro(x, y, squash, time, roll, phase) {
    const w = walkPose(time * 1.25, phase != null ? phase : 2.6);
    ctx.save();
    ctx.translate(x, y);
    const s = 0.8;
    if (roll != null) applySlide(s * 1.15, s * 0.5);
    else {
      ctx.translate(0, -w.bob * 0.85);
      ctx.rotate(w.lean);
      ctx.scale(s, s * (1 - squash * 0.08));
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 黑毛团（#18181A 填充，豆豆眼反白）
    ctx.fillStyle = "#18181A";
    ctx.beginPath();
    ctx.arc(0, -10, 8.2, 0, Math.PI * 2);
    ctx.fill();

    if (roll != null) {
      ctx.beginPath();
      ctx.moveTo(-2, -4); ctx.quadraticCurveTo(0, -1, -3, 0);
      ctx.moveTo(2, -4); ctx.quadraticCurveTo(4, -1, 1, 0);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-2, -3); ctx.lineTo(-2 + w.legL, 0);
      ctx.moveTo(2, -3); ctx.lineTo(2 + w.legR, 0);
      ctx.stroke();
    }

    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.arc(-2.4, -12, 1.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(2.8, -12, 1.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /** 铅笔底稿远景：0.45× 视差的淡灰山影，纯装饰不碰撞 */
  function drawPencilUnderlay() {
    ctx.strokeStyle = "rgba(24,24,26,0.11)";
    ctx.lineWidth = 1.3;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const step = 300, span = W + step * 2;
    const n = Math.ceil(span / step) + 1;
    for (let i = -1; i < n; i++) {
      const bx = ((((i * step - cameraX * 0.45) % span) + span) % span) - step;
      const h = 26 + hash1(i * 7.3) * 18;
      const y = baseY + 4;
      ctx.beginPath();
      ctx.moveTo(bx - 70, y);
      ctx.quadraticCurveTo(bx - 20, y - h, bx + 18, y - h * 0.4);
      ctx.quadraticCurveTo(bx + 40, y - h * 0.9, bx + 76, y);
      ctx.stroke();
      if (hash1(i * 3.1) > 0) {
        ctx.beginPath();
        ctx.moveTo(bx + 110, y);
        ctx.lineTo(bx + 110, y - 16 - hash1(i * 5.7) * 10);
        ctx.stroke();
      }
    }
  }

  function drawCampFire() {
    // 篝火 = 小队中心的世界锚点（resetWorld 由 0.22·W 派生），出发后随路自然离场
    const fx = fireX - cameraX;
    if (fx < -60 || fx > W + 60) return;
    const fade = Math.max(0, Math.min(1, 1 - (cameraX - 600) / 250));
    const fy = terrainY(fireX);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(fx, fy);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 柴堆：三根交叉（二下一上）
    ctx.beginPath();
    ctx.moveTo(-17, -1); ctx.lineTo(15, -5);
    ctx.moveTo(-15, -4); ctx.lineTo(13, 0);
    ctx.moveTo(-8, -2); ctx.lineTo(9, -7);
    ctx.stroke();

    // 石圈：五颗小弧
    ctx.beginPath();
    for (const st of [[-20, 2], [-11, 4], [0, 5], [11, 4], [20, 2]]) {
      ctx.moveTo(st[0] - 3, st[1]);
      ctx.quadraticCurveTo(st[0], st[1] - 4, st[0] + 3, st[1]);
    }
    ctx.stroke();

    // 火焰：外焰墨线 + 焰尖分叉小苗（营地唯一的暖橙浓度点）
    const fl = reduceMotion ? 1 : 1 + Math.sin(modeT * 5) * 0.08;
    const sway = reduceMotion ? 0 : Math.sin(modeT * 3.1) * 2;
    ctx.beginPath();
    ctx.moveTo(0, -7);
    ctx.quadraticCurveTo(-11, -20, -1 + sway * 0.4, -36 * fl);
    ctx.quadraticCurveTo(9, -22, 0, -7);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-1 + sway * 0.4, -36 * fl);
    ctx.quadraticCurveTo(2 + sway, -43 * fl, 6 + sway, -40 * fl);
    ctx.stroke();

    ctx.strokeStyle = "#FF9F43";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.quadraticCurveTo(-5, -16, 0, -26 * fl);
    ctx.quadraticCurveTo(5, -16, 0, -8);
    ctx.stroke();
    ctx.restore();
  }

  /** 角色群：营地休息位 → 行进队形连续过渡（无瞬移），翻滚/踉跄/跳跃姿态 */
  function drawMascots() {
    const px = W * 0.22;
    const worldX = playerWorldX();
    const gy = terrainY(worldX) + playerY;
    const ang = Math.atan(tangentAt(worldX)) * 0.35;
    const slideT = sliding > 0 ? 1 - sliding / P.slideDur : null;
    const squash = jumping && playerY < -16 ? 0.2 : stumbleT > 0 ? 0.15 : 0;

    const b = (mode === "walk" || mode === "play")
      ? departBlend * departBlend * (3 - 2 * departBlend)
      : 0;
    const tAnim = mode === "await" ? 0.3 : modeT * (0.45 + 0.55 * b) * gaitBoost;
    const pose = mode === "camp" ? (modeT > 0.9 ? "stretch" : "idle")
      : mode === "point" ? "point" : null;

    // 单一锚点：休息位 = cameraX=0 时的队形位（同由 0.22·W 派生）。
    // 起点与终点恒重合，混合只剩步频/贴地姿态过渡——任意窗宽下零位移残差。
    const phases = [0, 1.3, 2.6];
    const forms = [-26, 0, 24];

    for (let i = 0; i < 3; i++) {
      const X = px + forms[i];
      const Y = terrainY(cameraX + X) + playerY * b;
      const tilt = ang * b + (slideT == null && stumbleT > 0 ? Math.sin(modeT * 26) * 0.05 : 0);
      ctx.save();
      ctx.translate(X, Y);
      ctx.rotate(tilt);
      ctx.translate(-X, -Y);
      if (i === 0) drawChestnut(X, Y, squash, tAnim, slideT, phases[i], pose);
      else if (i === 1) drawCloudy(X, Y, squash, tAnim, slideT, phases[i]);
      else drawKuro(X, Y, squash, tAnim, slideT, phases[i]);
      ctx.restore();
    }

    // 滑行扬尘（翻滚拖出的短线）
    if (slideT != null) {
      ctx.strokeStyle = "rgba(24,24,26,0.22)";
      ctx.lineWidth = 1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(px - 36, gy + 1); ctx.lineTo(px - 27, gy);
      ctx.moveTo(px - 33, gy + 4); ctx.lineTo(px - 24, gy + 3);
      ctx.stroke();
    }
    if (jumping && playerY < -8) {
      // 短直线气流（禁止圆弧，避免读成云）
      ctx.strokeStyle = "rgba(24,24,26,0.28)";
      ctx.lineWidth = 1.1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(px - 14, gy + 3); ctx.lineTo(px - 8, gy + 2);
      ctx.moveTo(px - 6, gy + 6); ctx.lineTo(px + 1, gy + 5);
      ctx.moveTo(px + 8, gy + 3); ctx.lineTo(px + 14, gy + 1);
      ctx.stroke();
    }
    if (stumbleT > 0) {
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 + (P.stumbleDur - stumbleT) * 5;
        const sx2 = px + Math.cos(a) * 18;
        const sy2 = gy - 28 + Math.sin(a) * 8;
        ctx.strokeStyle = "#FFDE59";
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(sx2 - 3, sy2); ctx.lineTo(sx2 + 3, sy2);
        ctx.moveTo(sx2, sy2 - 3); ctx.lineTo(sx2, sy2 + 3);
        ctx.stroke();
      }
    }
  }

  function collide() {
    if (mode !== "play" || stumbleT > 0) return;
    const wx = playerWorldX();
    const gy = terrainY(wx);
    const standH = sliding > 0 ? 11 : 28;   // 滑行 hitbox 压低
    const head = gy + playerY - standH;
    const feet = gy + playerY;

    for (const o of obstacles) {
      const dx = Math.abs(wx - o.x);
      if (dx > o.w) continue;
      const u = (wx - o.x) / o.w;

      if (o.type === "roll") {
        // 桥洞 / 山洞：身体撞在结构带上才踉跄；滑行可穿过、整体跃过放行
        const ground = terrainY(o.x);
        const lintel = ground - (o.clear || 20);
        const roof = ground - (o.tall || 40);
        // 判定带只算洞口正上方（0.65）：两侧拱脚不撞头，整体跃过放行
        if (head < lintel && feet > roof && Math.abs(u) < 0.65) { stun(); return; }
      } else if (o.type === "stone") {
        const top = terrainY(o.x) - (o.h || 16);
        if (feet > top + 4 && playerY > -(o.h || 16) * 0.6) { stun(); return; }
      } else if (o.type === "stream" || o.type === "mud" || o.type === "valley") {
        // 落在坑里
        if (Math.abs(u) < 0.65 && playerY > -4) { stun(); return; }
      }
    }
  }

  function stun() {
    stumbleT = P.stumbleDur;
    jumping = false; sliding = 0; playerY = 0; vy = 0;
    emitParticles(W * 0.22, terrainY(playerWorldX()) - 24, 5, true);
  }

  function doJump() {
    if (mode !== "play" || sliding > 0) return;
    if (jumping && playerY < -5) { jumpBuf = P.bufferJump; return; }
    if (coyote > 0 || playerY > -2) {
      vy = P.jumpV; jumping = true; jumpBuf = 0; sJump();
    } else jumpBuf = P.bufferJump;
  }

  function doSlide() {
    if (mode !== "play" || sliding > 0) return;
    if (jumping && playerY < -8) {
      // 空中下滑 = 快速下坠（参考 Chrome 小恐龙），落地即滑
      vy = Math.max(vy, 1100);
      slideBuf = P.bufferSlide;
      return;
    }
    sliding = P.slideDur;
    slideBuf = 0;
    sSlide();
  }

  /** 完成交权：进入行进态。withFlash: 跳过时补 200ms 交叉淡入 */
  function enterPlay(withFlash) {
    if (mode === "play") return;
    mode = "play";
    modeT = 0;
    departBlend = 1;   // 交权即满速步频（位置恒在队形上，无位移混合）
    penDrop = 1; pointLand = true;
    if (withFlash) flashT = 0.2;
    document.body.classList.remove("intro-lock");
    document.getElementById("intro-ui").classList.add("hidden");
    updateHint();
    if (!hintPulsed) {
      hintPulsed = true;
      const hint = document.getElementById("hero-hint");
      hint.classList.remove("hint-pulse");
      void hint.offsetWidth;
      hint.classList.add("hint-pulse");
    }
  }
  function skipIntro() { enterPlay(true); }

  /* ── 声音：WebAudio 三枚极简音，默认静音（导航 ♪ 开关） ── */
  let audioOn = false, actx = null;
  function tone(freq, dur, delay, type) {
    if (!audioOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = actx.currentTime + (delay || 0);
      const osc = actx.createOscillator(), gn = actx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.linearRampToValueAtTime(0.05, t0 + 0.012);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gn).connect(actx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch (err) {}
  }
  const sJump = () => { tone(540, 0.09); tone(720, 0.08, 0.05); };
  const sSlide = () => tone(190, 0.14, 0, "triangle");
  const sMile = () => { tone(660, 0.09); tone(880, 0.12, 0.07); };
  document.getElementById("btn-sound").addEventListener("click", (e) => {
    audioOn = !audioOn;
    e.currentTarget.setAttribute("aria-pressed", String(audioOn));
    if (audioOn) tone(660, 0.08);
  });

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  let touchStart = null;

  canvas.addEventListener("pointerdown", (e) => {
    idleT = 0;
    if (e.button === 2) { e.preventDefault(); skipIntro(); doSlide(); return; }
    if (e.button !== 0) return;
    skipIntro();
    if (e.pointerType === "touch") {
      touchStart = { x: e.clientX, y: e.clientY, t: performance.now() };
      return;
    }
    // 左键只跳，绝不长按误触滑行（滑行 = 右键 / Shift / ↓）
    doJump();
  });
  canvas.addEventListener("pointerup", (e) => {
    if (!touchStart || e.pointerType !== "touch") return;
    const dx = e.clientX - touchStart.x;
    const dy = e.clientY - touchStart.y;
    const dt = performance.now() - touchStart.t;
    touchStart = null;
    // 触屏只保留轻点跳跃；滑动交给页面滚动（touch-action: pan-y）
    if (dt < 320 && Math.abs(dy) < 24) doJump();
  });

  window.addEventListener("keydown", (e) => {
    idleT = 0;
    if (e.code === "Escape") {
      if (mode !== "play") { skipIntro(); return; }
      paused = !paused; window.__paused = paused;
      const pb = document.getElementById("btn-pause");
    pb.textContent = paused ? "▶" : "⏸";
    pb.setAttribute("aria-label", paused ? t("hero.play") : t("hero.pause"));
      return;
    }
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault(); skipIntro(); doJump(); return;
    }
    if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyS" || e.code === "ArrowDown") {
      e.preventDefault(); skipIntro(); doSlide(); return;
    }
    if (mode === "camp" || mode === "point" || mode === "walk") skipIntro();
  });

  document.getElementById("btn-skip").addEventListener("click", skipIntro);
  document.getElementById("btn-setout").addEventListener("click", () => enterPlay(false));
  document.getElementById("btn-redraw").addEventListener("click", () => {
    seed = (Math.random() * 1e9) >>> 0;
    try {
      const u = new URL(location.href);
      u.searchParams.set("seed", String(seed));
      history.replaceState(null, "", u);   // ?seed= 可分享
    } catch (err) { /* file:// 某些环境不支持时静默 */ }
    resetWorld(seed);
    emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 6, 8, true);
  });
  document.getElementById("btn-pause").addEventListener("click", () => {
    paused = !paused;
    window.__paused = paused;
    const pb = document.getElementById("btn-pause");
    pb.textContent = paused ? "▶" : "⏸";
    pb.setAttribute("aria-label", paused ? t("hero.play") : t("hero.pause"));
  });

  window.addEventListener("scroll", () => {
    if (mode === "camp" || mode === "point" || mode === "walk") skipIntro();
  }, { passive: true });
  window.addEventListener("wheel", () => {
    if (mode === "camp" || mode === "point" || mode === "walk") skipIntro();
  }, { passive: true });

  /** Idle 示范：一小段波浪（文档 §4.4） */
  function drawIdleWave(k) {
    const penX = W * 0.85;
    const base = terrainY(cameraX + penX);
    ctx.save();
    ctx.globalAlpha = Math.sin(Math.min(1, k) * Math.PI) * 0.6;
    ctx.strokeStyle = "#18181A";
    ctx.lineWidth = 1.2;
    ctx.lineCap = "round";
    ctx.beginPath();
    const n = 20;
    const upto = Math.round(n * Math.min(1, k * 2.2));
    for (let i = 0; i <= upto; i++) {
      const u = i / n;
      const x = penX - 42 + u * 46;
      const y = base - 24 - Math.sin(u * Math.PI * 2.4) * 6;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  /* ── loop ── */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    // 离屏只跳过模拟，始终重绘，避免 resize/回滚后画布空白
    const sim = !paused && stageVisible;
    if (sim) modeT += dt;

    if (sim) {
      if (mode === "camp") {
        // 营地呼吸约 2.4s：镜头锁死，完整看到村舍/火+小队/预画线；篝火偶尔冒火星
        cameraX = 0;
        revealByPen(dt);
        if (rnd() < dt * 1.5) emitParticles(fireX - cameraX, terrainY(fireX) - 34, 1, false);
        if (hudKmEl) hudKmEl.textContent = bestMile > 0 ? "BEST " + (bestMile / 10).toFixed(1) + " km" : "";
        if (modeT > 2.4) { mode = "point"; modeT = 0; }
      } else if (mode === "point") {
        // 指路 + 笔落位，仍不卷动
        cameraX = 0;
        penDrop = Math.min(1, penDrop + dt / 0.9);
        if (penDrop >= 1 && !pointLand) {
          pointLand = true;
          emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 2, 4, true);
        }
        if (modeT > 1.6) { mode = "walk"; modeT = 0; }
      } else if (mode === "walk") {
        // 小队原地起跑（追笔行走），镜头缓缓跟上；补画前沿扫过树/钟楼；篝火留在身后
        departBlend = Math.min(1, departBlend + dt / 1.1);
        cameraX += P.speed * Math.min(1, modeT * 0.8) * dt;
        advanceFront(dt);
        ensureWorld(cameraX + W + 200);
        revealByPen(dt);
        if (rnd() < dt * 3) emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 2, 1, false);
        if (modeT > 2.6) enterPlay(false);
      } else if (mode === "play") {
        idleT += dt;
        // 节奏曲线：120 → 190（+0.8/s），踉跄时冻结爬升
        if (stumbleT <= 0) speedRamp = Math.min(190, speedRamp + 0.8 * dt);
        // 踉跄：先失速，后 1.15× 归队（文档 §5.3）
        const rejoin = stumbleT > 0 && stumbleT <= 0.55;
        const spd = stumbleT > 0 ? (rejoin ? speedRamp * P.rejoinBoost : speedRamp * 0.25) : speedRamp;
        gaitBoost = rejoin ? P.rejoinBoost : 1;
        if (stumbleT > 0) stumbleT -= dt;

        cameraX += spd * dt;
        advanceFront(dt);
        ensureWorld(cameraX + W * 1.3);
        revealByPen(dt);

        if (jumpBuf > 0) {
          jumpBuf -= dt;
          if (playerY > -2) doJump();
        }
        if (slideBuf > 0) {
          slideBuf -= dt;
          if (sliding <= 0 && playerY > -4) doSlide();
        }
        if (sliding > 0) sliding -= dt;
        prevY = playerY;
        if (jumping || playerY < 0) {
          // 抛物线加弧度：顶点附近(|vy|<160)减重力悬挂，起跳/落地依旧干脆
          vy += (Math.abs(vy) < 160 ? 1500 : P.gravity) * dt;
          playerY += vy * dt;
          if (playerY >= 0) {
            if (prevY < -40) emitParticles(W * 0.22, terrainY(playerWorldX()) - 1, 3, false);
            playerY = 0; vy = 0; jumping = false; coyote = P.coyote;
          }
        } else coyote -= dt;

        if (rnd() < dt * 4) emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 2, 1, false);
        collide();

        // 里程碑：每 1000px = 100m——HUD 轻脉冲 + 最佳里程落 localStorage
        const mile = Math.floor(cameraX / 1000);
        if (mile > lastMile) {
          lastMile = mile;
          sMile();
          if (hudKmEl) {
            hudKmEl.classList.remove("pulse");
            void hudKmEl.offsetWidth;
            hudKmEl.classList.add("pulse");
          }
          if (mile > bestMile) {
            bestMile = mile;
            try { localStorage.setItem("lucky.best." + seed, String(bestMile)); } catch (err) {}
          }
        }
        if (hudKmEl) hudKmEl.textContent = (cameraX / 1000).toFixed(1) + " km";
      } else if (mode === "await") {
        drawnX = cameraX + W * 0.85;   // reduced-motion：静态营地，地线一次画全
        revealByPen(dt);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.t += dt;
        if (p.t > p.life) { particles.splice(i, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt;
      }
    }

    // 纸面恒为纸白
    baseY = H * 0.64;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, W, H);

    // 夜：月牙与星（随系统时间，缓慢视差）
    if (isNight) {
      ctx.strokeStyle = "rgba(24,24,26,0.35)";
      ctx.lineWidth = 1.2;
      ctx.lineCap = "round";
      const span2 = W + 200;
      const mx = (((90 - cameraX * 0.04) % span2) + span2) % span2 - 60;
      ctx.beginPath();
      ctx.arc(mx, 58, 13, Math.PI * 0.3, Math.PI * 1.7, true);
      ctx.stroke();
      for (const st of [[180, 40], [330, 86], [520, 50]]) {
        const x2 = (((st[0] - cameraX * 0.04) % span2) + span2) % span2 - 60;
        ctx.beginPath();
        ctx.moveTo(x2 - 2.5, st[1]); ctx.lineTo(x2 + 2.5, st[1]);
        ctx.moveTo(x2, st[1] - 2.5); ctx.lineTo(x2, st[1] + 2.5);
        ctx.stroke();
      }
    }

    // 铅笔底稿远景 — 0.45× 视差的淡灰山影，纯装饰不碰撞
    drawPencilUnderlay();

    // 软云 — 天空原有，经典云形（平底 + 三圆顶）；随里程 3 → 6 缓增
    ctx.strokeStyle = "rgba(24,24,26,0.32)";
    ctx.lineWidth = 1.15;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const cloudN = 3 + Math.min(3, Math.floor(cameraX / 2000));
    for (let i = 0; i < cloudN; i++) {
      const cx = ((i * 320 - cameraX * 0.06) % (W + 360)) - 70;
      const cy = 36 + (i % 3) * 32;
      const w = 22 + (i % 2) * 6;
      const h = 13 + (i % 2) * 3;
      ctx.beginPath();
      // 左下 → 右下 → 右顶 → 中顶 → 左顶 → 闭合底边
      ctx.moveTo(cx - w, cy);
      ctx.lineTo(cx + w, cy);
      ctx.quadraticCurveTo(cx + w + 3, cy - h * 0.55, cx + w * 0.5, cy - h * 0.95);
      ctx.quadraticCurveTo(cx + w * 0.3, cy - h * 1.55, cx, cy - h * 1.05);
      ctx.quadraticCurveTo(cx - w * 0.35, cy - h * 1.55, cx - w * 0.55, cy - h * 0.95);
      ctx.quadraticCurveTo(cx - w - 3, cy - h * 0.55, cx - w, cy);
      ctx.closePath();
      ctx.stroke();
    }

    drawCampFire();
    drawPath();
    drawObjects("back");

    const penShow = mode === "camp" ? 0
      : mode === "point" ? penDrop * penDrop * (3 - 2 * penDrop) : 1;
    drawPen(penShow, paused ? 0 : dt);

    drawMascots();
    drawObjects("front");   // 前景遮挡：桥面/洞顶压在角色上
    drawParticles();

    if (mode === "play" && idleT > 4 && idleT < 5.8) drawIdleWave((idleT - 4) / 1.8);

    if (flashT > 0) {
      flashT -= dt;
      ctx.globalAlpha = Math.max(0, flashT / 0.2) * 0.6;
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(frame);
  }

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      const rr = typeof r === "number" ? r : 3;
      this.moveTo(x + rr, y);
      this.arcTo(x + w, y, x + w, y + h, rr);
      this.arcTo(x + w, y + h, x, y + h, rr);
      this.arcTo(x, y + h, x, y, rr);
      this.arcTo(x, y, x + w, y, rr);
      this.closePath();
      return this;
    };
  }

  // boot：等布局完成后再建世界，避免 clientHeight=0 时 baseY 算歪
  function bootWorld() {
    resize();
    resetWorld(seed);
  }
  resize();
  applyI18n();

  const introUI = document.getElementById("intro-ui");
  if (reduceMotion) {
    // 无仪式动画：静态营地 + 「出发」按钮（文档 §9.2），页面可正常滚动
    document.body.classList.remove("intro-lock");
    introUI.classList.remove("hidden");
    document.getElementById("btn-skip").style.display = "none";
  } else {
    document.body.classList.add("intro-lock");
    introUI.classList.remove("hidden");
    document.getElementById("btn-setout").style.display = "none";
    document.getElementById("hero-hint").textContent = t("hero.skipping");
  }

  if ("IntersectionObserver" in window) {
    new IntersectionObserver((es) => {
      stageVisible = es[es.length - 1].isIntersecting;
    }, { threshold: 0 }).observe(canvas);
  }

  // 若 canvas 已有高度则立即建；否则等一帧布局
  if (canvas.clientHeight > 0) bootWorld();
  else requestAnimationFrame(() => { bootWorld(); requestAnimationFrame(frame); });

  if (canvas.clientHeight > 0) requestAnimationFrame(frame);
  window.__lucky = {
    resetWorld, skipIntro, enterPlay,
    get mode() { return mode; },
    // 只读调试探针（供本地验证）
    get debug() {
      return {
        mode, cameraX, playerY, sliding: sliding > 0, stumbleT,
        particles: particles.length, objects: objects.length,
        pathPoints: pathPoints.length, stageVisible,
        pathX0: pathPoints[0] && pathPoints[0].x,
        pathXN: pathPoints[pathPoints.length - 1] && pathPoints[pathPoints.length - 1].x,
        drawnX: Math.round(drawnX),
        baseY: Math.round(baseY), W, H,
      };
    },
  };
})();
</script>
</body>
</html>
