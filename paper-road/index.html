<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lucky — Code with craft. Design with soul.</title>
<meta name="description" content="lucky portfolio — 边走边画的数字手艺人。 Code with craft. Design with soul." />
<style>
  :root {
    --paper: #ffffff;
    --ground: #f3f2ef;
    --ink: #18181a;
    --ink-soft: #8a8a90;
    --line-faint: #e6e5e3;
    --line-soft: #d9d8d5;
    --accent-lemon: #ffde59;
    --accent-orange: #ff9f43;
    --accent-sage: #70a07b;
    --font-display: "SF Pro Display", "Inter", -apple-system, "Segoe UI", sans-serif;
    --font-cjk: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-cjk);
    color: var(--ink);
    background: var(--ground);
    line-height: 1.75;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body.intro-lock { overflow: hidden; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
    mix-blend-mode: multiply;
  }

  a { color: inherit; text-decoration: none; }
  button {
    font: inherit; color: inherit; background: none; border: none; cursor: pointer;
  }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  /* ── Paper sheet ── */
  .sheet {
    position: relative;
    z-index: 1;
    background: var(--paper);
    max-width: 1200px;
    margin: 12px auto 24px;
    border: 1px solid var(--line-faint);
    border-radius: 36px;
    overflow: clip;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 24px 60px rgba(24,24,26,0.04);
  }

  /* ── Nav ── */
  /* ── Nav：裸浮层（方案 A，无外框胶囊）── */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 28px 16px;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.92) 0%,
      rgba(255, 255, 255, 0.72) 55%,
      rgba(255, 255, 255, 0) 100%
    );
  }
  .nav-brand {
    pointer-events: auto;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-display);
    font-weight: 600; font-size: 15px; letter-spacing: -0.03em;
    color: var(--ink);
  }
  .nav-brand .logo { width: 16px; height: 16px; }
  .nav-right {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-links { display: flex; align-items: center; gap: 2px; }
  .nav-links a, .nav-lang {
    font-family: var(--font-display);
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.06em;
    padding: 8px 12px;
    color: var(--ink-soft);
    transition: color .25s;
    white-space: nowrap;
    background: none;
    border: none;
  }
  .nav-links a:hover, .nav-lang:hover { color: var(--ink); }
  .nav-links a.active {
    color: var(--ink);
  }
  .nav-links a.active::after {
    content: "";
    display: block;
    margin: 2px auto 0;
    width: 14px;
    height: 1.5px;
    border-radius: 1px;
    background: var(--ink);
  }
  .nav-lang {
    margin-left: 10px;
    padding: 8px 2px 8px 12px;
    border-left: 1px solid var(--line-faint);
    font-size: 11px;
    letter-spacing: 0.1em;
  }

  /* ── Stage canvas ── */
  #stage {
    display: block;
    width: 100%;
    height: min(68vh, 560px, calc(100vh - 310px));   /* 预留：标题(含5vw放大)+副标+出发按钮+提示行 */
    touch-action: pan-y;
    cursor: default;
    background: var(--paper);
  }

  .stage-wrap { position: relative; }
  .stage-hud {
    position: absolute; top: 12px; right: 16px;
    font-family: var(--font-mono); font-size: 12px;
    color: var(--ink-soft); letter-spacing: 0.08em;
    pointer-events: none; opacity: 0.85;
  }
  .stage-hud.pulse { animation: hintPulse 1.2s ease 1; }
  .hud-btns { position: absolute; top: 10px; left: 12px; display: flex; gap: 8px; }
  .hud-btn {
    width: 34px; height: 34px; border-radius: 999px;
    border: 1px solid var(--line-faint);
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 13px; color: var(--ink-soft);
    transition: color .2s, border-color .2s;
  }
  .hud-btn:hover { color: var(--ink); border-color: var(--ink-soft); }

  .hero-copy {
    text-align: center;
    padding: 12px 24px 8px;
    margin-top: -20px;
  }
  .hero-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(34px, 5vw, 64px);
    line-height: 1.12;
    letter-spacing: -0.035em;
  }
  .hero-title .zh {
    font-family: var(--font-cjk);
    font-weight: 500;
    letter-spacing: 0.06em;
    line-height: 1.4;
  }
  .hero-sub {
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .hero-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 28px 22px;
    flex-wrap: wrap;
  }
  .hero-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .ctrl-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid var(--line-faint);
    color: var(--ink-soft);
    transition: color .2s, border-color .2s, background .2s;
    background: var(--paper);
  }
  .ctrl-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .hero-hint {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    text-align: right;
    flex: 1;
    min-width: 200px;
  }

  .intro-ui {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 0 24px 18px;
  }
  .intro-ui.hidden { display: none; }
  .btn-setout {
    font-family: var(--font-display);
    font-weight: 600; font-size: 13px; letter-spacing: 0.08em;
    padding: 12px 32px; border-radius: 999px;
    background: var(--ink); color: var(--paper);
    transition: transform .25s cubic-bezier(.34,1.4,.64,1);
  }
  .btn-setout:hover { transform: scale(1.03); }
  .btn-skip {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.04em;
  }
  .btn-skip:hover { color: var(--ink); }

  /* ── Sections ── */
  /* Crafted surface pass */
  .sheet {
    border-color: rgba(24,24,26,0.08);
    box-shadow: 0 1px 0 rgba(255,255,255,0.92) inset, 0 28px 80px rgba(24,24,26,0.07);
  }
  .nav-brand { letter-spacing: -0.045em; }
  .nav-links a, .nav-lang { transition: color .2s, background .2s, transform .2s; }
  .nav-links a:hover, .nav-links a:focus-visible, .nav-lang:hover {
    color: var(--accent-orange);
    background: rgba(255,159,67,0.08);
    border-radius: 999px;
  }
  .nav-links a.active { color: var(--accent-orange); }
  .nav-links a.active::after { background: var(--accent-orange); }
  .hero-copy { padding-top: 20px; }
  .hero-title { text-wrap: balance; }
  .hero-sub { max-width: 560px; margin-left: auto; margin-right: auto; }
  .hero-bar { border-top: 1px solid rgba(24,24,26,0.06); }
  .ctrl-btn { box-shadow: 0 3px 12px rgba(24,24,26,0.04); }
  .ctrl-btn:hover { background: #fffaf1; border-color: var(--accent-orange); }
  .btn-setout { box-shadow: 0 8px 20px rgba(24,24,26,0.14); }
  .section { padding-top: 104px; }
  .section-head { position: relative; }
  .section-head::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -26px;
    width: 34px; height: 3px;
    transform: translateX(-50%) rotate(-2deg);
    background: var(--accent-orange);
    border-radius: 999px;
    opacity: .78;
  }
  .hollow { -webkit-text-stroke-color: #d8d3ca; }
  .work-card {
    overflow: hidden;
    border: 1px solid rgba(24,24,26,0.08);
    background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(249,247,241,.9));
    box-shadow: 0 10px 28px rgba(24,24,26,0.045);
  }
  .work-card::before {
    content: "";
    position: absolute;
    inset: 0 auto auto 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--accent-orange), var(--accent-lemon));
    opacity: .8;
  }
  .work-card:hover { border-color: rgba(255,159,67,.55); box-shadow: 0 18px 36px rgba(24,24,26,0.09); }
  .work-art { background: radial-gradient(circle at 50% 52%, rgba(255,222,89,.2), transparent 58%); border-radius: 18px; }
  .work-card.bento { background: #fff; border-color: rgba(24,24,26,0.1); }
  .note-row { padding-left: 12px; padding-right: 12px; border-radius: 14px; transition: background .25s, color .25s, transform .25s; }
  .note-row:hover { background: #fffaf1; transform: translateX(4px); }
  .about-manifesto { text-wrap: balance; }
  .openroad { border-top-color: rgba(24,24,26,0.08); }

  .section {
    padding: 104px 56px 56px;
    max-width: 980px;
    margin: 0 auto;
    scroll-margin-top: 96px;
  }
  .openroad { scroll-margin-top: 88px; }
  .section-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    margin-bottom: 56px;
    gap: 12px;
  }
  .section-head .side {
    display: flex;
    align-items: center;
  }
  .section-head .side.right { justify-content: flex-end; }
  .section-head .center {
    text-align: center;
  }
  .hollow {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(40px, 7.5vw, 68px);
    letter-spacing: 0.04em;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px #cfcdc8;
    text-stroke: 2px #cfcdc8;
    user-select: none;
    white-space: nowrap;
  }
  .section-sub {
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.28em;
  }
  .text-link {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    transition: color .2s;
  }
  .text-link:hover { color: var(--ink); }

  /* Works */
  .works-featured {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px 40px;
    margin-bottom: 32px;
  }
  .work-card {
    display: block;
    border-radius: 24px;
    padding: 20px 20px 28px;
    transition: transform .4s cubic-bezier(.22,1,.36,1);
    position: relative;
  }
  .work-card:hover { transform: translateY(-3px); }
  .work-card.featured:nth-child(even) { margin-top: 40px; }
  .work-art {
    height: 120px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .work-art svg { width: 140px; height: 100px; overflow: visible; }
  .work-title {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 600;
    letter-spacing: -0.03em;
    transition: color .25s;
  }
  .work-tagline {
    margin-top: 10px;
    font-size: 15px;
    line-height: 1.7;
  }
  .work-meta {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }
  .work-arrow {
    position: absolute; right: 28px; bottom: 28px;
    font-family: var(--font-display);
    font-size: 18px; color: var(--ink-soft);
    transition: transform .3s, color .3s;
  }
  .work-card:hover .work-arrow {
    transform: translate(3px,-3px);
    color: var(--ink);
  }
  .mascot-peek {
    position: absolute; top: -18px; right: 40px;
    width: 56px; height: 56px; pointer-events: none;
    filter: drop-shadow(0 2px 0 rgba(24,24,26,0.04));
  }

  .works-bento {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding-top: 8px;
    border-top: 1px solid var(--line-faint);
  }
  .work-card.bento {
    padding: 24px 20px 28px;
    margin-top: 16px;
  }
  .work-card.bento .work-art { height: 88px; margin-bottom: 16px; }
  .work-card.bento .work-art svg { width: 100px; height: 72px; }
  .work-card.bento .work-title { font-size: 18px; }
  .work-card.bento .work-tagline { font-size: 13px; color: var(--ink-soft); }
  .work-card.bento .work-arrow { right: 20px; bottom: 18px; font-size: 15px; }

  .works-empty {
    text-align: center; color: var(--ink-soft);
    padding: 56px; border: 1px dashed var(--line-faint); border-radius: 24px;
  }

  /* About */
  .about-manifesto {
    text-align: center;
    font-family: var(--font-display);
    font-size: clamp(22px, 3.2vw, 34px);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 48px;
  }
  .timeline {
    list-style: none;
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: "";
    position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 1px; background: var(--line-soft);
  }
  .timeline li {
    position: relative;
    padding: 0 0 52px 36px;
  }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: "";
    position: absolute; left: -33px; top: 8px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
  }
  .timeline .year {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--ink-soft);
    letter-spacing: 0.06em;
  }
  .timeline .event {
    margin-top: 6px;
    font-size: 16px;
    letter-spacing: 0.02em;
  }

  /* Notes — match reference layout */
  .notes-all { justify-self: end; }
  .note-row {
    display: grid;
    grid-template-columns: 120px 1fr 28px;
    gap: 20px;
    align-items: center;
    padding: 26px 8px;
    border-top: 1px solid var(--line-faint);
    transition: background .25s, padding .25s;
  }
  .note-row:last-child { border-bottom: 1px solid var(--line-faint); }
  .note-date {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  .note-title {
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: -0.01em;
    transition: color .25s;
  }
  .note-title.zh {
    font-family: var(--font-cjk);
    letter-spacing: 0.02em;
    font-size: 14px;
  }
  .note-arrow {
    font-family: var(--font-display);
    color: var(--ink-soft);
    font-size: 15px;
    transition: transform .25s, color .25s;
  }
  .note-row:hover .note-arrow {
    transform: translate(2px,-2px);
    color: var(--ink);
  }

  /* Waystation */
  .waystation { text-align: center; padding-top: 80px; }
  .mailbox-wrap {
    position: relative;
    width: 112px; height: 112px;
    margin: 10px auto 30px;
  }
  .mail-box { width: 112px; height: 112px; overflow: visible; display: block; }
  .mb-star { opacity: 0; }
  .mailbox-wrap:hover .mb-star {
    animation: starPop .85s cubic-bezier(.34,1.56,.64,1) 1 forwards;
  }
  @keyframes starPop {
    0%   { opacity: 0; transform: translate(0, 4px) scale(.3); }
    35%  { opacity: 1; }
    100% { opacity: 0; transform: translate(0, -18px) scale(1); }
  }
  .email-link {
    display: inline-block;
    font-family: var(--font-display);
    font-size: clamp(24px, 3.5vw, 36px);
    font-weight: 600;
    letter-spacing: -0.03em;
    padding-bottom: 6px;
    border-bottom: 1.5px solid var(--ink);
    transition: border-color .25s, color .25s;
  }
  .email-link:hover {
    color: var(--accent-orange);
    border-color: var(--accent-orange);
  }

  /* 链接高亮：hover / 键盘 focus / 章节选中 一律暖橙（§2.1 accent-orange = hover） */
  .nav-links a:hover, .nav-links a:focus-visible, .nav-links a.active {
    color: var(--accent-orange);
    background: rgba(255, 159, 67, 0.08);
  }
  .text-link:hover, .text-link:focus-visible,
  .socials a:hover, .socials a:focus-visible,
  .note-row:hover .note-title, .note-row:hover .note-arrow,
  .note-row:focus-visible .note-title, .note-row:focus-visible .note-arrow,
  .work-card:hover .work-title, .work-card:hover .work-arrow {
    color: var(--accent-orange);
  }
  .socials {
    margin-top: 28px;
    display: flex; justify-content: center; gap: 28px;
  }
  .socials a {
    font-family: var(--font-display);
    font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    transition: color .25s;
  }
  .socials a:hover { color: var(--ink); }

  /* Open Road */
  .openroad {
    text-align: center;
    margin-top: 88px;
    padding: 96px 24px 100px;
    border-top: 1px solid var(--line-faint);
  }
  .vanish {
    width: min(420px, 70%);
    height: 70px;
    margin-bottom: 28px;
  }
  .openroad-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 4.5vw, 48px);
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .openroad-title .zh {
    font-family: var(--font-cjk);
    letter-spacing: 0.12em;
    font-weight: 500;
  }
  .openroad-credit {
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); border: 0;
  }

  /* ── 滚动描出：进入视口后一笔画出 ── */
  .js .rv {
    opacity: 0; transform: translateY(16px);
    transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);
    transition-delay: var(--rvd, 0s);
  }
  .js .rv.in { opacity: 1; transform: none; }
  /* 空心标题：由父级 .in 触发描出 */
  .js .hollow {
    clip-path: inset(-40% 100% -40% -12px);
    transition: clip-path .55s cubic-bezier(.4,0,.2,1) .05s;
  }
  .js .section-head.in .hollow { clip-path: inset(-40% -12px -40% -12px); }

  .hint-pulse { animation: hintPulse 1.8s ease 1; }
  @keyframes hintPulse {
    0% { opacity: .5 } 30% { opacity: 1 } 50% { opacity: .55 }
    70% { opacity: 1 } 100% { opacity: .8 }
  }

  .work-art svg { transition: transform .55s cubic-bezier(.34,1.56,.64,1); }
  .work-card:hover .work-art svg { transform: translateY(-5px) rotate(-2deg); }
  .js .work-card.in:hover { transform: translateY(-3px); }
  .mascot-peek { transform-origin: 30% 100%; }
  .work-card:hover .mascot-peek {
    animation: peekKnock 1.1s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes peekKnock {
    0% { transform: rotate(0); }
    30% { transform: rotate(-10deg); }
    55% { transform: rotate(7deg); }
    78% { transform: rotate(-4deg); }
    100% { transform: rotate(0); }
  }

  @media (max-width: 880px) {
    #stage { height: min(58vh, 480px, calc(100vh - 230px)); }
    .sheet { margin: 0; border-radius: 0; border-left: none; border-right: none; }
    .section { padding: 56px 20px 40px; scroll-margin-top: 80px; }
    #stage { height: min(48vh, 360px, calc(100vh - 230px)); }
    .hero-copy { margin-top: -20px; padding: 4px 16px; }
    .hero-title { font-size: clamp(26px, 7vw, 40px); }
    .works-featured { grid-template-columns: 1fr; gap: 20px; }
    .work-card.featured:nth-child(even) { margin-top: 0; }
    .works-bento { grid-template-columns: 1fr 1fr; }
    .section-head {
      grid-template-columns: 1fr;

<script>
(() => {

  };
  const TIMELINE = {
    zh: [
      { year: "2024", event: "独立开发，发布 TimeSense" },
      { year: "2025", event: "开源 UI 组件与手绘图标集" },
      { year: "2026", event: "lucky / 本站，把「边走边画」做成产品隐喻" },
    ],
    en: [
      { year: "2024", event: "Went indie and shipped TimeSense" },
      { year: "2025", event: "Open-sourced UI bits and hand-drawn icons" },
      { year: "2026", event: "lucky — this site as a walking-and-drawing metaphor" },
    ],
  };
  const NOTES = {
    zh: [
      { date: "2026.06.21", title: "TimeSense，在各个国家被学到了一些事。" },
      { date: "2026.02.15", title: "「知育時計・声音计时器」TimeSense 是什么？" },

    en: [
      { date: "2026.06.21", title: "What TimeSense keeps learning around the world." },
      { date: "2026.02.15", title: "What is TimeSense, the sound timer?" },
    ],
  };

  let lang = "zh";
  const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;

  function applyI18n() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const key = el.getAttribute("data-i18n");
      const val = t(key);

    const title = document.getElementById("hero-title");
    title.innerHTML = t("hero.title");
    title.classList.toggle("zh", lang === "zh");
    document.getElementById("hero-sub").textContent = t("hero.sub");
    updateHint();
    document.getElementById("a11y-controls").textContent = t("a11y.controls");
    document.getElementById("openroad-title").innerHTML = t("openroad.title");
    document.getElementById("btn-redraw").textContent = "↺";
    document.getElementById("btn-redraw").setAttribute("aria-label", t("hero.redraw"));
    const pauseBtn = document.getElementById("btn-pause");
    pauseBtn.textContent = window.__paused ? "▶" : "⏸";
    pauseBtn.setAttribute("aria-label", window.__paused ? t("hero.play") : t("hero.pause"));
    document.getElementById("lang-btn").textContent = lang === "zh" ? "EN" : "中文";
    renderWorks(); renderTimeline(); renderNotes();
    bindReveals();
  }

  function updateHint() {
    const touchHint = matchMedia("(hover: none), (pointer: coarse)").matches;
    const hint = document.getElementById("hero-hint");
    hint.textContent = t(touchHint ? "hero.hint.touch" : "hero.hint");
    // 交权后提示自动淡出
    if (hintTimer) clearTimeout(hintTimer);
    hint.style.opacity = "";
    if (mode === "play") hintTimer = setTimeout(() => { hint.style.opacity = "0"; }, 6000);
  }

  /* illustrations */
  const artSvg = (kind) => {
    const S = (inner) =>
      `<svg viewBox="0 0 200 140" fill="none" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
    const ink = 'stroke="#18181A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"';
    if (kind === "clock") return S(`
      <path d="M100 36a36 36 0 1 1 0 72 36 36 0 1 1 0-72M100 52a20 20 0 1 1 0 40 20 20 0 1 1 0-40" ${ink}/>
      <path d="M100 58v16l12 8M78 30l-8-10M122 30l8-10" ${ink}/>
      <path d="M150 96c6-2 8-8 4-12" ${ink}/>
    `);
    if (kind === "cat") return S(`
      <path d="M40 100h90M62 100c-2-22 14-38 36-28 10 4 14 16 12 28M78 72l-8-14 16 6M102 70l12-12 2 16" ${ink}/>
      <path d="M86 82h2M100 82h2M92 92c2 2 6 2 8 0M140 48c10 2 12 12 4 16" ${ink}/>
    `);
    if (kind === "pen") return S(`
      <path d="M48 108c24-10 48-36 80-62M122 36l22 8-8 22-20-10 6-20z" ${ink}/>
      <path d="M56 112h2M68 106h1" ${ink}/>
    `);
    if (kind === "list") return S(`
      <path d="M64 36h72v88H64zM64 28h56" ${ink}/>
      <path d="M80 58h40M80 78h40M80 98h26" ${ink}/>
    `);
    return S(`<path d="M68 44h64v52H68zM68 62h64" ${ink}/>`);
  };

  const peekSvg = `
    <svg class="mascot-peek" viewBox="0 0 56 56" aria-hidden="true">
      <ellipse cx="28" cy="36" rx="17" ry="15" fill="#C4A574" stroke="#18181A" stroke-width="1.4"/>
      <circle cx="17" cy="18" r="5.5" fill="#C4A574" stroke="#18181A" stroke-width="1.3"/>
      <circle cx="38" cy="18" r="5.5" fill="#C4A574" stroke="#18181A" stroke-width="1.3"/>
      <rect x="36" y="30" width="13" height="15" rx="3" fill="#FFDE59" stroke="#18181A" stroke-width="1.2"/>
      <circle cx="22" cy="36" r="1.5" fill="#18181A"/>
      <circle cx="33" cy="36" r="1.5" fill="#18181A"/>
      <path d="M26 42c2 1 4 1 6 0" stroke="#18181A" stroke-width="1.2" stroke-linecap="round"/>
    </svg>`;

  function renderWorks() {
    const all = (window.WORKS || []).filter((w) => w.status !== "draft");
    all.sort((a, b) => (a.order || 0) - (b.order || 0));
    const featured = all.filter((w) => w.status === "featured").slice(0, 2);
    const bento = all.filter((w) => w.status === "bento");
    const peeked = new Set();

    const card = (w, kind, allowPeek, idx) => {
      const title = (w.title && (w.title[lang] || w.title.en)) || w.id;
      const tagline = (w.tagline && (w.tagline[lang] || w.tagline.en)) || "";
      const meta = (w.meta && (w.meta[lang] || w.meta.en)) || "";
      const doPeek = allowPeek && w.mascot === "peek" && !peeked.size;
      if (doPeek) peeked.add("peek");
      const d = (idx * 0.07).toFixed(2);
      return `<a class="work-card ${kind} rv" style="--rvd:${d}s" href="${w.link || "#"}">
        ${doPeek ? peekSvg : ""}
        <div class="work-art">${artSvg(w.art)}</div>
        <h3 class="work-title">${title}</h3>
        <p class="work-tagline">${tagline}</p>
        <p class="work-meta">${meta}</p>
        <span class="work-arrow" aria-hidden="true">↗</span>
      </a>`;
    };

    const fEl = document.getElementById("works-featured");
    const bEl = document.getElementById("works-bento");
    if (!all.length) {
      fEl.innerHTML = "";
      bEl.innerHTML = `<div class="works-empty rv">${t("works.empty")}</div>`;
      return;
    }
    fEl.innerHTML = featured.map((w, i) => card(w, "featured", true, i)).join("");
    bEl.innerHTML = bento.map((w, i) => card(w, "bento", false, i)).join("");
  }

  function renderTimeline() {
    document.getElementById("timeline").innerHTML = (TIMELINE[lang] || TIMELINE.en)
      .map((r, i) => `<li class="rv" style="--rvd:${(i * 0.12).toFixed(2)}s"><div class="year">${r.year}</div><div class="event">${r.event}</div></li>`)
      .join("");
  }

  function renderNotes() {
    document.getElementById("notes-list").innerHTML = (NOTES[lang] || NOTES.en)
      .map((n, i) => `<a class="note-row rv" style="--rvd:${(i * 0.08).toFixed(2)}s" href="#">
        <span class="note-date">${n.date}</span>
        <span class="note-title${lang === "zh" ? " zh" : ""}">${n.title}</span>
        <span class="note-arrow" aria-hidden="true">↗</span></a>`)
      .join("");
  }

  document.getElementById("lang-btn").addEventListener("click", () => {
    lang = lang === "zh" ? "en" : "zh";
    applyI18n();
  });

  document.body.classList.add("js");

  /* 占位链接（href="#"）：原型期拦截默认跳转，避免「点一下飞回开头」 */
  document.addEventListener("click", (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[href="#"]') : null;
    if (a) e.preventDefault();
  });

  /* ── 滚动描出：进入视口后一笔画出 ── */
  const revealIO = "IntersectionObserver" in window
    ? new IntersectionObserver((entries) => {
        for (const en of entries) {
          if (en.isIntersecting) {
            en.target.classList.add("in");
            revealIO.unobserve(en.target);
          }
        }
      }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" })
    : null;
  const revealedSet = new WeakSet();
  function bindReveals() {
    document.querySelectorAll(".rv:not(.in)").forEach((el) => {
      if (revealedSet.has(el)) return;
      revealedSet.add(el);
      if (!revealIO) { el.classList.add("in"); return; }
      revealIO.observe(el);
    });
  }

  /* ── 导航 scrollspy：章节滚到视口中带时，对应锚点着色 ── */
  const spyLinks = new Map();
  document.querySelectorAll(".nav-links a").forEach((a) => {
    const id = (a.getAttribute("href") || "").slice(1);
    if (id) spyLinks.set(id, a);
  });
  if ("IntersectionObserver" in window && spyLinks.size) {
    const spyIO = new IntersectionObserver((entries) => {
      for (const en of entries) {
        if (!en.isIntersecting) continue;
        spyLinks.forEach((a) => a.classList.remove("active"));
        const link = spyLinks.get(en.target.id);
        if (link) link.classList.add("active");
      }
    }, { rootMargin: "-40% 0px -55% 0px", threshold: 0 });
    ["hero", "works", "about", "notes", "contact", "openroad"].forEach((id) => {
      const s = document.getElementById(id);
      if (s) spyIO.observe(s);
    });
  }

  /* 当前章节高亮（裸导航下划线） */
  const navAnchors = () => document.querySelectorAll(".nav-links a");
  function syncNavActive() {
    const ids = ["works", "about", "notes", "contact"];
    let active = null;
    for (const id of ids) {
      const el = document.getElementById(id);
      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (r.top <= 140 && r.bottom > 140) active = id;
    }
    navAnchors().forEach((a) => {
      const href = a.getAttribute("href") || "";
      a.classList.toggle("active", active && href === "#" + active);
    });
  }
  window.addEventListener("scroll", syncNavActive, { passive: true });
  syncNavActive();

  /* ═══════════ Canvas scene ═══════════ */
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const hudKmEl = document.getElementById("hud-km");
  let W = 0, H = 0, dpr = 1, baseY = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth || window.innerWidth;
    // 未布局时不写死 640，避免 baseY 算歪
    H = canvas.clientHeight || Math.round((window.innerHeight || 800) * 0.55);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    baseY = H * 0.64;
    // 未出发时篝火始终对齐小队中心；出发后为世界物，不再随窗口挪动
    if (cameraX === 0) {
      // 未出发：村舍/记录板等营地景物与开镜小队中心同源，随窗口一起平移，避免错位
      const d = W * 0.22 - fireX;
      fireX = W * 0.22;
      if (d) for (const o of objects) o.x += d;
    }
  }
  window.addEventListener("resize", () => { resize(); });

  let seed = (() => {
    const q = parseInt(new URLSearchParams(location.search).get("seed"), 10);
    return Number.isFinite(q) ? q >>> 0 : 20260215;   // ?seed= 可分享（文档 §4.4）
  })();
  const srand = (s) => { seed = s >>> 0; };
  const rnd = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 物理初值（文档 §5.3）
  const P = {
    gravity: 2600, jumpV: -860, speed: 120,
    rampA: 0.35, rampMax: 210,          // 节奏曲线：每秒 +0.35、封顶 210（里程碑节奏换算同源）
    slideMin: 0.25, slideRelease: 0.1, slideEase: 0.12,   // 按住持续滑：最短/松手起身/姿态过渡
    bufferJump: 0.08, bufferSlide: 0.06, coyote: 0.08,

  };

  // 营地段长度：预画水平路线，小队在此完成出发仪式。
  const CAMP_END = 420;
  // 低矮通道：净空给滑行 hitbox（11px）留量，拱顶上沿让整跃可过、低跳会撞。
  const TUNNEL_CLEAR = 16;
  const TUNNEL_ROOF = 36;

  let cameraX = 0, paused = false;
  let mode = reduceMotion ? "await" : "camp"; // camp → point → walk → play
  let modeT = 0;
  // 一笔成景的唯一真源：相对 baseY 的路线采样与语义区间。
  let routePoints = [];
  let routeFeatures = [];
  let objects = []; // 仅辅助笔画，不再改变地面或碰撞。
  let particles = [];
  let stumbleT = 0, jumpBuf = 0, coyote = 0;
  let jumping = false, sliding = 0, slideBuf = 0, vy = 0, playerY = 0;
  let slideHeld = false, slidePose = 0;   // 滑行=按住持续态；姿态 0→1 缓动
  let penAng = 0.35, penDrop = 0, pointLand = false, flashT = 0;
  let idleT = 0;          // 无输入计时 → idle 波浪示范
  let departBlend = 0;    // 起身起跑进度：步频/贴地姿态渐入行进（位置恒在队形上，无位移混合）
  let gaitBoost = 1;      // 踉跄归队 1.15×
  let hintPulsed = false;
  let stageVisible = true;
  let fireX = 263;        // 篝火世界坐标 = 开镜小队中心（0.22·W），由 resetWorld/resize 派生
  let drawnX = CAMP_END;  // 路线已描到哪（补画前沿）：skip/重绘后从营地端快速追到笔尖
  let speedRamp = 120;    // 节奏曲线：120 → 190（+0.8/s），踉跄回落 40
  let prevY = 0;          // 落地检测（上一帧高度）
  let lastMile = 0;       // 里程碑计数（每 1000px = 100m）
  let bestPx = 0;         // 本 seed 最远里程（px，localStorage，仅本地）
  let bestSaved = 0;      // 已落盘的最远里程（每 10 m 写一次，避免每帧写）
  let entrySeed = 0;      // 本世界入口 seed：读写 localStorage 用同一把钥匙（seed 变量会被 rnd 改写）
  let hintTimer = 0;
  // 视觉跟随留一小段历史：碰撞始终锚定 Chestnut，后两只只在画面上错相跟随。
  let motionClock = 0;
  let mascotMotion = [];
  const isTouch = matchMedia("(pointer: coarse)").matches;
  // 夜空点缀随系统时间（22:00–5:00 月牙与星）；纸面恒为纸白
  const isNight = (() => { const h = new Date().getHours(); return h >= 22 || h < 5; })();

  // 平滑值噪声（手绘抖动），替代毛糙的白噪声
  function hash1(i) {
    const s = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function noise1(x) {
    const i = Math.floor(x), f = x - i;
    const u = f * f * (3 - 2 * f);
    return (hash1(i) * (1 - u) + hash1(i + 1) * u) * 2 - 1;
  }

  const ROUTE_STEP = 5;
  const ROUTE_MAX = 2048;
  const smooth = (u) => u * u * (3 - 2 * u);

  function sampleRoute(worldX) {
    if (!routePoints.length) return { x: worldX, dy: 0 };
    if (worldX <= routePoints[0].x) return routePoints[0];
    const last = routePoints[routePoints.length - 1];
    if (worldX >= last.x) return last;
    // 采样点严格等距，索引可直接推算；clamp 只防御首尾边界的浮点误差。
    const index = Math.max(0, Math.min(routePoints.length - 2,
      Math.floor((worldX - routePoints[0].x) / ROUTE_STEP)));
    const a = routePoints[index], b = routePoints[index + 1];
    const t = b.x === a.x ? 0 : (worldX - a.x) / (b.x - a.x);
    return { x: worldX, dy: a.dy + (b.dy - a.dy) * t };
  }

  function heightAt(worldX) { return baseY + sampleRoute(worldX).dy; }
  const tangentAt = (wx) => (heightAt(wx + 4) - heightAt(wx - 4)) / 8;

  function routeFeatureAt(worldX) {
    for (let i = routeFeatures.length - 1; i >= 0; i--) {
      const f = routeFeatures[i];
      if (worldX >= f.x0 && worldX <= f.x1) return f;
    }
    return null;
  }

  /** 宽度吸附到整步长：区间端点必然是真实采样点，索引可直接推算。
      每个地貌都是「进入 → 主轮廓 → 退出」一段可读单笔：起收两端斜率归零，
      与相邻平地切向连续，因此不会出现台阶或折角。 */
  function snapSpan(width) {
    return Math.max(ROUTE_STEP, Math.round(width / ROUTE_STEP) * ROUTE_STEP);
  }

  function appendProfile(x0, width, kind, interaction, options) {
    const start = sampleRoute(x0).dy;
    const slope = options && options.slope || 0;
    const depth = options && options.depth || 0;
    const lift = options && options.lift || 0;
    const span = snapSpan(width);
    const x1 = x0 + span;
    for (let x = x0 + ROUTE_STEP; x <= x1; x += ROUTE_STEP) {
      const u = (x - x0) / span;
      const bell = Math.sin(Math.PI * u);
      const dy = start + slope * u + depth * bell * bell - lift * bell * bell;
      routePoints.push({ x, dy });
    }
    const feature = {
      kind, x0, x1, span, interaction: interaction || null, depth, lift,
      clear: options && options.clear, roof: options && options.roof,
    };
    routeFeatures.push(feature);
    return feature;
  }

  function appendFlat(x0, width) {
    const start = sampleRoute(x0).dy;
    const x1 = x0 + snapSpan(width);
    for (let x = x0 + ROUTE_STEP; x <= x1; x += ROUTE_STEP)
      routePoints.push({ x, dy: start });
    return x1;
  }

  function appendRouteFeature(x0, kind) {
    const specs = {
      flat: [120, 0, null, {}],
      hill: [180, 0, null, { lift: 20, slope: (rnd() - 0.5) * 8 }],
      cloud: [220, 0, null, { lift: 15, slope: (rnd() - 0.5) * 10 }],
      stream: [76, "jump", "jump", { depth: 24 }],
      valley: [112, "jump", "jump", { depth: 29 }],
      mud: [70, "jump", "jump", { depth: 12 }],
      stone: [64, "jump", "jump", {}],   // 石台=立在线上的一块石头，线不隆起
      arch: [156, 0, null, { lift: 24, slope: (rnd() - 0.5) * 6 }],
      tunnel: [138, "slide", "slide", {}],
      longtunnel: [220, "slide", "slide", {}],
      branch: [64, "slide", "slide", { clear: 18, roof: 26 }],
      clothesline: [90, "slide", "slide", { clear: 16, roof: 30 }],
      bar: [70, "slide", "slide", { clear: 16, roof: 28 }],
      ruin: [56, "slide", "slide", { clear: 14, roof: 34 }],
    };
    const [width, semantic, interaction, profile] = specs[kind] || specs.flat;
    const feature = appendProfile(x0, width, kind, interaction || semantic, profile);
    return { x: feature.x1, feature };
  }

  /* ── 一笔画场景 ──
     除天空云朵外，全部由笔尖 stroke-reveal 描出。
     back: 角色身后的单线轮廓（一笔一条）
     front: 滑行时的前景遮挡（桥面/洞顶，白填充压在角色上） */
  /* ── 手写数字/字母笔画：统计物（里程碑/记录板）上的刻字 ──
     局部坐标：基线 y=0、字高 9、字宽 6（y 负向上）；textStrokes 负责居中排版 */
  const GLYPHS = {
    "0": [[[1.2, 0], [0, -2.4], [0, -6.6], [2, -9], [4, -9], [6, -6.6], [6, -2.4], [4.8, 0], [1.2, 0]]],
    "1": [[[0.6, -6.6], [3, -9], [3, 0]], [[1, 0], [5, 0]]],
    "2": [[[0.2, -6.8], [2.2, -9], [4, -9], [6, -6.8], [5.2, -5], [0, 0], [6, 0]]],
    "3": [[[0.2, -9], [5.8, -9], [3, -5.4]], [[3, -5.4], [5.2, -4.8], [6, -2.4], [4, 0], [1, 0], [0, -1.2]]],
    "4": [[[4.6, 0], [4.6, -9], [0, -2.8], [6, -2.8]]],
    "5": [[[5.8, -9], [0.4, -9], [0.2, -5], [4, -5.4], [6, -3], [5.2, -0.6], [2.4, 0], [0, -1.2]]],
    "6": [[[5.2, -9], [1.8, -6.6], [0, -3], [0, -1.2], [2, 0], [4, 0], [6, -2], [4.4, -4.4], [1.6, -4.2]]],
    "7": [[[0.2, -9], [5.8, -9], [2, 0]]],
    "8": [[[1.8, -4.6], [0, -6.6], [2, -9], [4, -9], [6, -6.6], [4.2, -4.6], [1.2, -4], [0, -2], [2, 0], [4, 0], [6, -2], [4.2, -4.6]]],
    "9": [[[6, -4.6], [4, -6.6], [1.6, -5], [0, -6.8], [2, -9], [4, -9], [6, -7], [6, -2], [4, 0], [1.6, 0]]],
    ".": [[[2.4, 0], [3.6, 0]]],
    "k": [[[1, 0], [1, -9]], [[1, -3.8], [5.6, -0.6]], [[1, -3.8], [5.6, -6.8]]],
    m: [[[0.4, 0], [0.4, -7], [1.8, -7.4], [3, -6], [3, 0]], [[3, -6], [4.4, -7.4], [5.8, -6], [5.8, 0]]],
  };
  const GLYPH_ADV = { ".": 4, " ": 4, m: 9 };

  /** 把一行短标签排成居中的笔画（oy = 基线，scale = 字号系数，maxW = 碑面可刻宽度 → 超宽自动收窄） */
  function textStrokes(text, oy, scale, maxW) {
    if (!text) return [];
    const chars = String(text).toLowerCase().split("");
    let total = -1.5;
    for (const ch of chars) total += GLYPH_ADV[ch] || 7.5;
    const sc = maxW && total * scale > maxW ? maxW / total : scale;
    const out = [];
    let pen = -total / 2;
    for (const ch of chars) {
      const g = GLYPHS[ch];
      if (g) for (const st of g) out.push(st.map((pt) => [(pen + pt[0]) * sc, oy + pt[1] * sc]));
      pen += GLYPH_ADV[ch] || 7.5;
    }
    return out;
  }

  function objectStrokes(kind, label) {
    // 小屋：墙 + 坡顶 + 门 + 烟囱与一缕淡烟
    if (kind === "cabin") return [
      [[-22, 0], [-22, -24], [0, -44], [22, -24], [22, 0], [-22, 0]],
      [[-7, 0], [-7, -14], [7, -14], [7, 0]],
      [[9, -33], [9, -42], [14, -42], [14, -36]],
      [[13, -48], [11, -53], [15, -58], [13, -63]],
    ];
    // 树：细干 + 圆云冠（避免像屋顶）

      [-2, 0], [-2, -20],
      [-14, -26], [-22, -36], [-18, -48], [-4, -54],
      [10, -54], [22, -48], [24, -36], [14, -26], [2, -20], [2, 0],
    ]];
    // 钟楼：檐口塔身 + 尖顶 + 圆表盘 + 指针
    if (kind === "clocktower") return [
      [[-10, 0], [-10, -58], [-14, -62], [0, -82], [14, -62], [10, -58], [10, 0], [-10, 0]],
      // 表盘（圆）
      [[0, -50], [-7, -48], [-8, -42], [-5, -37], [0, -35], [5, -37], [8, -42], [7, -48], [0, -50]],
      // 指针
      [[0, -42], [0, -37], [5, -40]],
    ];
    // 小店：墙 + 波浪雨棚 + 门

      [[-16, 0], [-16, -28], [16, -28], [16, 0], [-16, 0]],
      [[-20, -28], [-16, -34], [-8, -34], [-4, -28], [4, -28], [8, -34], [16, -34], [20, -28]],
      [[-7, 0], [-7, -14], [7, -14], [7, 0]],

      [[-40, 0], [-40, -12], [-30, -28], [0, -38], [30, -28], [40, -12], [40, 0]],

    ];

    if (kind === "cave") return [
      [[-38, 0], [-34, -18], [-20, -36], [0, -44], [20, -36], [34, -18], [38, 0]],

    // 山坡：双峰
