<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lucky — Code with craft. Design with soul.</title>
<meta name="description" content="lucky portfolio — 边走边画的数字手艺人。 Code with craft. Design with soul." />
<style>
  :root {
    --paper: #ffffff;
    --ground: #f3f2ef;
    --ink: #18181a;
    --ink-soft: #8a8a90;
    --line-faint: #e6e5e3;
    --line-soft: #d9d8d5;
    --accent-lemon: #ffde59;
    --accent-orange: #ff9f43;
    --accent-sage: #70a07b;
    --font-display: "SF Pro Display", "Inter", -apple-system, "Segoe UI", sans-serif;
    --font-cjk: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-cjk);
    color: var(--ink);
    background: var(--ground);
    line-height: 1.75;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body.intro-lock { overflow: hidden; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
    mix-blend-mode: multiply;
  }

  a { color: inherit; text-decoration: none; }
  button {
    font: inherit; color: inherit; background: none; border: none; cursor: pointer;
  }

  /* ── Paper sheet ── */
  .sheet {
    position: relative;
    z-index: 1;
    background: var(--paper);
    max-width: 1200px;
    margin: 12px auto 24px;
    border: 1px solid var(--line-faint);
    border-radius: 36px;
    overflow: clip;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 24px 60px rgba(24,24,26,0.04);
  }

  /* ── Nav ── */
  .nav {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 8px 7px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid rgba(24,24,26,0.06);
    box-shadow: 0 10px 40px rgba(24, 24, 26, 0.06);
  }
  .nav-brand {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-display);
    font-weight: 600; font-size: 15px; letter-spacing: -0.03em;
    margin-right: 6px;
  }
  .nav-brand .logo { width: 16px; height: 16px; }
  .nav-links { display: flex; align-items: center; gap: 0; }
  .nav-links a, .nav-lang {
    font-family: var(--font-display);
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 8px 11px; border-radius: 999px;
    color: var(--ink-soft);
    transition: color .25s, background .25s;
    white-space: nowrap;
  }
  .nav-links a:hover, .nav-lang:hover {
    color: var(--ink); background: rgba(24,24,26,0.04);
  }
  .nav-lang {
    border: 1px solid var(--line-faint);
    margin-left: 4px;
    min-width: 54px;
    text-align: center;
  }

  /* ── Stage canvas ── */
  #stage {
    display: block;
    width: 100%;
    height: min(72vh, 640px);
    touch-action: none;
    cursor: default;
    background: var(--paper);
  }

  .hero-copy {
    text-align: center;
    padding: 12px 24px 8px;
    margin-top: -20px;
  }
  .hero-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(34px, 6.2vw, 72px);
    line-height: 1.08;
    letter-spacing: -0.035em;
  }
  .hero-title .zh {
    font-family: var(--font-cjk);
    font-weight: 500;
    letter-spacing: 0.06em;
    line-height: 1.4;
  }
  .hero-sub {
    margin-top: 18px;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .hero-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 28px 22px;
    flex-wrap: wrap;
  }
  .hero-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .ctrl-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid var(--line-faint);
    color: var(--ink-soft);
    transition: color .2s, border-color .2s, background .2s;
    background: var(--paper);
  }
  .ctrl-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .hero-hint {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    text-align: right;
    flex: 1;
    min-width: 200px;
  }

  .intro-ui {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 0 24px 18px;
  }
  .intro-ui.hidden { display: none; }
  .btn-setout {
    font-family: var(--font-display);
    font-weight: 600; font-size: 13px; letter-spacing: 0.08em;
    padding: 12px 32px; border-radius: 999px;
    background: var(--ink); color: var(--paper);
    transition: transform .25s cubic-bezier(.34,1.4,.64,1);
  }
  .btn-setout:hover { transform: scale(1.03); }
  .btn-skip {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--ink-soft); letter-spacing: 0.04em;
  }
  .btn-skip:hover { color: var(--ink); }

  /* ── Sections ── */
  .section {
    padding: 100px 56px 72px;
    max-width: 980px;
    margin: 0 auto;
  }
  .section-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    margin-bottom: 56px;
    gap: 12px;
  }
  .section-head .side {
    display: flex;
    align-items: center;
  }
  .section-head .side.right { justify-content: flex-end; }
  .section-head .center {
    text-align: center;
  }
  .hollow {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(42px, 8vw, 72px);
    letter-spacing: 0.02em;
    line-height: 0.95;
    color: transparent;
    -webkit-text-stroke: 1.6px var(--line-soft);
    text-stroke: 1.6px var(--line-soft);
    user-select: none;
  }
  .section-sub {
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.28em;
  }
  .text-link {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    transition: color .2s;
  }
  .text-link:hover { color: var(--ink); }

  /* Works */
  .works-featured {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 56px 48px;
    margin-bottom: 48px;
  }
  .work-card {
    display: block;
    border-radius: 24px;
    padding: 28px 28px 32px;
    transition: transform .4s cubic-bezier(.22,1,.36,1);
    position: relative;
  }
  .work-card:hover { transform: translateY(-3px); }
  .work-card.featured:nth-child(even) { margin-top: 56px; }
  .work-art {
    height: 160px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
  }
  .work-art svg { width: 180px; height: 130px; overflow: visible; }
  .work-title {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 600;
    letter-spacing: -0.03em;
  }
  .work-tagline {
    margin-top: 10px;
    font-size: 15px;
    line-height: 1.7;
  }
  .work-meta {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }
  .work-arrow {
    position: absolute; right: 28px; bottom: 28px;
    font-family: var(--font-display);
    font-size: 18px; color: var(--ink-soft);
    transition: transform .3s, color .3s;
  }
  .work-card:hover .work-arrow {
    transform: translate(3px,-3px);
    color: var(--ink);
  }
  .mascot-peek {
    position: absolute; top: -18px; right: 40px;
    width: 56px; height: 56px; pointer-events: none;
    filter: drop-shadow(0 2px 0 rgba(24,24,26,0.04));
  }

  .works-bento {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding-top: 8px;
    border-top: 1px solid var(--line-faint);
  }
  .work-card.bento {
    padding: 24px 20px 28px;
    margin-top: 16px;
  }
  .work-card.bento .work-art { height: 88px; margin-bottom: 16px; }
  .work-card.bento .work-art svg { width: 100px; height: 72px; }
  .work-card.bento .work-title { font-size: 18px; }
  .work-card.bento .work-tagline { font-size: 13px; color: var(--ink-soft); }
  .work-card.bento .work-arrow { right: 20px; bottom: 18px; font-size: 15px; }

  .works-empty {
    text-align: center; color: var(--ink-soft);
    padding: 56px; border: 1px dashed var(--line-faint); border-radius: 24px;
  }

  /* About */
  .about-manifesto {
    text-align: center;
    font-family: var(--font-display);
    font-size: clamp(22px, 3.2vw, 34px);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 72px;
  }
  .timeline {
    list-style: none;
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: "";
    position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 1px; background: var(--line-soft);
  }
  .timeline li {
    position: relative;
    padding: 0 0 52px 36px;
  }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: "";
    position: absolute; left: -33px; top: 8px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink);
  }
  .timeline .year {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--ink-soft);
    letter-spacing: 0.06em;
  }
  .timeline .event {
    margin-top: 6px;
    font-size: 16px;
    letter-spacing: 0.02em;
  }

  /* Notes — match reference layout */
  .notes-all { justify-self: end; }
  .note-row {
    display: grid;
    grid-template-columns: 120px 1fr 28px;
    gap: 20px;
    align-items: center;
    padding: 26px 8px;
    border-top: 1px solid var(--line-faint);
    transition: background .25s, padding .25s;
  }
  .note-row:last-child { border-bottom: 1px solid var(--line-faint); }
  .note-row:hover {
    background: rgba(24,24,26,0.015);
    padding-left: 14px;
  }
  .note-date {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  .note-title {
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .note-title.zh {
    font-family: var(--font-cjk);
    letter-spacing: 0.02em;
    font-size: 14px;
  }
  .note-arrow {
    font-family: var(--font-display);
    color: var(--ink-soft);
    font-size: 15px;
    transition: transform .25s, color .25s;
  }
  .note-row:hover .note-arrow {
    transform: translate(2px,-2px);
    color: var(--ink);
  }

  /* Waystation */
  .waystation { text-align: center; padding-top: 80px; }
  .mail-box {
    width: 100px; height: 100px;
    margin: 8px auto 28px;
  }
  .email-link {
    display: inline-block;
    font-family: var(--font-display);
    font-size: clamp(24px, 3.5vw, 36px);
    font-weight: 600;
    letter-spacing: -0.03em;
    padding-bottom: 6px;
    border-bottom: 1.5px solid var(--ink);
    transition: border-color .25s, color .25s;
  }
  .email-link:hover {
    color: var(--accent-orange);
    border-color: var(--accent-orange);
  }
  .socials {
    margin-top: 28px;
    display: flex; justify-content: center; gap: 28px;
  }
  .socials a {
    font-family: var(--font-display);
    font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .socials a:hover { color: var(--ink); }

  /* Open Road */
  .openroad {
    text-align: center;
    padding: 96px 24px 100px;
    border-top: 1px solid var(--line-faint);
  }
  .vanish {
    width: min(420px, 70%);
    height: 70px;
    margin-bottom: 28px;
  }
  .openroad-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 4.5vw, 48px);
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .openroad-title .zh {
    font-family: var(--font-cjk);
    letter-spacing: 0.12em;
    font-weight: 500;
  }
  .openroad-credit {
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); border: 0;
  }

  @media (max-width: 880px) {
    .sheet { margin: 0; border-radius: 0; border-left: none; border-right: none; }
    .section { padding: 72px 24px 56px; }
    .works-featured { grid-template-columns: 1fr; gap: 28px; }
    .work-card.featured:nth-child(even) { margin-top: 0; }
    .works-bento { grid-template-columns: 1fr 1fr; }
    .section-head {
      grid-template-columns: 1fr;
      justify-items: center;
      gap: 10px;
    }
    .section-head .side { justify-content: center !important; }
    .hero-bar { padding: 4px 18px 18px; }
    .hero-hint { text-align: left; }
  }
  @media (max-width: 540px) {
    .works-bento { grid-template-columns: 1fr; }
    .nav { left: 10px; right: 10px; transform: none; width: auto; max-width: none; overflow-x: auto; }
    .nav-links a { padding: 7px 8px; font-size: 10px; }
    .note-row { grid-template-columns: 92px 1fr 20px; gap: 8px; padding: 20px 4px; }
    .hero-title { font-size: clamp(28px, 9vw, 40px); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .work-card, .work-arrow, .note-arrow, .btn-setout, .note-row { transition: none; }
  }
</style>
</head>

  function noise1(x) {

  function terrainY(worldX) {
    // 自然缓坡 + 微小有机起伏（对齐参考图连续手绘感）

      const hw = o.w;

        const u = dx / hw; // -1..1
        const bell = Math.cos((u * Math.PI) / 2); // 0 at edges, 1 center
        if (o.type === "pit" || o.type === "stream") y += (o.depth || 22) * bell * bell;
        if (o.type === "valley") y += 18 * bell * bell;
        if (o.type === "rock" || o.type === "stone") y -= (o.h || 14) * bell * bell;
        if (o.type === "mud") y += 10 * bell * bell;
      }

    return y + noise1(worldX * 0.11) * 0.7 + noise1(worldX * 0.03) * 0.5;

  /* ── 一笔画场景 ──

  function objectStrokes(kind) {

    // 石桥外轮廓（一笔）；洞口内缘在 back 第二笔仅作内线

      return [{
        fill: [[
          [-38, 0], [-38, -10], [-30, -24], [-12, -34], [12, -34], [30, -24], [38, -10], [38, 0],

          [[-26, 0], [-26, -8], [-14, -16], [0, -20], [14, -16], [26, -8], [26, 0]],
        ],

          [-36, 0], [-36, -14], [-24, -32], [0, -42], [24, -32], [36, -14], [36, 0],

  function strokeTotal(points) {
    let L = 0;
    for (let i = 1; i < points.length; i++) {
      const dx = points[i][0] - points[i - 1][0];
      const dy = points[i][1] - points[i - 1][1];
      L += Math.hypot(dx, dy);
    }
    return L;
  }

  /** draw polyline only up to `progress` (0-1) of total length */
  function drawStrokeReveal(pts, progress, ox, oy, scale) {
    if (progress <= 0) return;
    const total = strokeTotal(pts);
    if (total === 0) return;
    let remain = total * Math.min(1, progress);
    ctx.beginPath();
    ctx.moveTo(ox + pts[0][0] * scale, oy + pts[0][1] * scale);
    for (let i = 1; i < pts.length; i++) {
      const x0 = pts[i - 1][0], y0 = pts[i - 1][1];
      const x1 = pts[i][0], y1 = pts[i][1];
      const seg = Math.hypot(x1 - x0, y1 - y0);
      if (remain >= seg) {
        ctx.lineTo(ox + x1 * scale, oy + y1 * scale);
        remain -= seg;
      } else if (remain > 0) {
        const r = remain / seg;
        ctx.lineTo(ox + (x0 + (x1 - x0) * r) * scale, oy + (y0 + (y1 - y0) * r) * scale);
        remain = 0;
        break;
      } else break;
    }
    ctx.stroke();
  }

  function ensureWorld(xTo) {
    while (obstacles.length < 50) {
      const last = obstacles.length ? obstacles[obstacles.length - 1].x : 560;
      const x = last + 320 + rnd() * 380;
      if (x > xTo + 1500 && obstacles.length > 3) break;
      const r = rnd();

      // 开场后先出风景，再出可玩障碍
      if (x < 700) {
        objects.push({ x, kind: ["tree", "flower", "mush", "hill"][(rnd() * 4) | 0], s: 0.9 + rnd() * 0.3, p: 0, on: false, strokes: null });
        continue;
      }

      if (r < 0.14) {

        obstacles.push({ x, type: "stream", w: 28, depth: 18 });
        objects.push({ x, kind: "stream", s: 1, p: 0, on: false, strokes: null });
      } else if (r < 0.26) {

        obstacles.push({ x, type: "valley", w: 36, depth: 22 });
        objects.push({ x, kind: "valley", s: 1, p: 0, on: false, strokes: null });

        obstacles.push({ x, type: "mud", w: 22, depth: 14 });
        objects.push({ x, kind: "mud", s: 1, p: 0, on: false, strokes: null });
      } else if (r < 0.5) {

        obstacles.push({ x, type: "stone", w: 18, h: 16 });
        objects.push({ x, kind: "stone", s: 1, p: 0, on: false, strokes: null });

        obstacles.push({ x, type: "slide", w: 34, low: 30 });
        objects.push({ x, kind: "bridge", s: 1, p: 0, on: false, strokes: null });
      } else if (r < 0.78) {
        // 山洞 → 滑行
        obstacles.push({ x, type: "slide", w: 32, low: 28 });
        objects.push({ x, kind: "cave", s: 1, p: 0, on: false, strokes: null });

        const decor = ["cabin", "tree", "clocktower", "shop", "hill", "flower", "mush"];
        const k = decor[(rnd() * decor.length) | 0];
        objects.push({ x, kind: k, s: 0.85 + rnd() * 0.35, p: 0, on: false, strokes: null });
        if (rnd() < 0.55) {
          objects.push({
            x: x + 55 + rnd() * 50,
            kind: ["tree", "flower", "mush", "stone"][(rnd() * 4) | 0],
            s: 0.75 + rnd() * 0.3, p: 0, on: false, strokes: null,

        x: last + 240 + rnd() * 280,
        h: 36 + rnd() * 64,
        w: 110 + rnd() * 130,
        kind: rnd() < 0.22 ? "tower" : "hill",

    if (!pathPoints.length) pathPoints.push({ x: 0, y: terrainY(0) });
    let lastX = pathPoints[pathPoints.length - 1].x;
    while (lastX < penX + 16) {

      pathPoints.push({ x: lastX, y: terrainY(lastX) });
      if (pathPoints.length > 2400) pathPoints.splice(0, 240);

  function resetWorld(newSeed) {

      { x: 60, kind: "cabin", s: 1.0, p: 1, on: true, strokes: null },

      { x: 360, kind: "clocktower", s: 0.9, p: 1, on: true, strokes: null },
      { x: 200, kind: "flower", s: 0.8, p: 1, on: true, strokes: null },

    particles = [];

  const playerWorldX = () => cameraX + W * 0.22;

  function emitParticles(x, y, n, burst) {
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2;
      const sp = burst ? 50 + rnd() * 90 : 18 + rnd() * 40;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: -Math.abs(Math.sin(a)) * sp * 0.6 - 8,
        life: 0.35 + rnd() * 0.25,
        t: 0, r: 0.5 + rnd() * 1.2,
        kind: rnd() < 0.22 ? "star" : "dot",
      });
    }
  }

  /** Reveal objects as the pen passes — pen draws them into existence */
  function revealByPen() {
    const penX = cameraX + W * 0.85;
    for (const o of objects) {
      if (!o.strokes) o.strokes = objectStrokes(o.kind);
      // start revealing shortly before pen arrives at object
      const trigger = o.x - 8;
      if (!o.on && penX > trigger) o.on = true;
      if (o.on && o.p < 1) {
        // reveal speed tied to pen speed
        o.p = Math.min(1, o.p + 0.035);
      }
    }
  }

  function drawPath() {
    if (pathPoints.length < 2) return;
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    // 一笔画：地面是一条不断开的线，只留极轻微笔触呼吸
    ctx.beginPath();
    for (let i = 0; i < pathPoints.length; i++) {
      const p = pathPoints[i];
      const sx = p.x - cameraX;
      const sy = p.y;
      if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }

  function drawHills(parallax) {
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "rgba(24,24,26,0.28)";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.fillStyle = "none";
    for (const h of hills) {
      let x = (h.x - cameraX * parallax);
      const span = W + 500;
      x = ((x % span) + span) % span - 150;
      const y = baseY - 8;
      if (h.kind === "tower") {
        // one-line tower
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - h.h);
        ctx.lineTo(x + 7, y - h.h - 12);
        ctx.lineTo(x + 14, y - h.h);
        ctx.lineTo(x + 14, y);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(x - h.w / 2, y);
        ctx.quadraticCurveTo(x, y - h.h, x + h.w / 2, y);
        ctx.stroke();
      }
    }
  }

  function drawObjects(layer) {
    // layer: 'back' | 'front'
    ctx.lineWidth = 1.55;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (const o of objects) {
      const sx = o.x - cameraX;
      if (sx < -120 || sx > W + 120) continue;
      if (o.p <= 0) continue;
      const sy = terrainY(o.x);
      const sc = o.s || 1;

      if (layer === "back") {
        if (!o.strokes) o.strokes = objectStrokes(o.kind);
        for (let si = 0; si < o.strokes.length; si++) {
          const sp = Math.max(0, Math.min(1, (o.p - si * 0.15) / (1 - si * 0.05)));
          if (sp <= 0) continue;
          drawStrokeReveal(o.strokes[si], sp, sx, sy, sc);
        }
      } else if (layer === "front") {
        const front = objectFrontStrokes(o.kind);
        if (!front || o.p < 0.85) continue;
        const fade = Math.min(1, (o.p - 0.85) / 0.15);
        for (const f of front) {
          // 白填充实体 → 角色被遮挡
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.fillStyle = "#FFFFFF";
          ctx.beginPath();
          const fp = f.fill[0];
          ctx.moveTo(sx + fp[0][0] * sc, sy + fp[0][1] * sc);
          for (let i = 1; i < fp.length; i++)
            ctx.lineTo(sx + fp[i][0] * sc, sy + fp[i][1] * sc);
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
          for (const sp of f.stroke) drawStrokeReveal(sp, 1, sx, sy, sc);
          ctx.restore();
        }
      }
    }
  }

  function drawPen() {
    const penX = W * 0.85;
    const worldPen = cameraX + penX;
    const penY = terrainY(worldPen) - 1;
    const ang = Math.max(-0.2, Math.min(0.2, Math.atan(tangentAt(worldPen)) * 0.8));
    const bob = Math.sin(modeT * 12) * 0.4;

    ctx.save();
    ctx.translate(penX, penY + bob);
    // 自然斜握笔：笔尖触线，杆稍向右后
    ctx.rotate(ang + 0.35 + noise1(modeT * 18) * 0.01);

    // 小笔（对齐参考图右下角笔的体量）
    const L = Math.min(H * 0.09, 54);

    ctx.lineWidth = 1.3;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.fillStyle = "none";

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-2.2, -7);
    ctx.lineTo(-3, -L);
    ctx.lineTo(3, -L);
    ctx.lineTo(2.2, -7);
    ctx.closePath();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-2.9, -L + 12);
    ctx.lineTo(2.9, -L + 12);
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = Math.max(0, a);
      if (p.kind === "star") {
        ctx.strokeStyle = "#FFDE59";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(p.x - 3, p.y); ctx.lineTo(p.x + 3, p.y);
        ctx.moveTo(p.x, p.y - 3); ctx.lineTo(p.x, p.y + 3);
        ctx.stroke();
      } else {
        ctx.fillStyle = "#18181A";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* 角色：干净比例 + 自然行走循环（对齐参考图小精灵） */
  function walkPose(time, phase) {
    const p = time * 9 + phase;
    return {
      bob: Math.sin(p * 2) * 0.7,
      legL: Math.sin(p) * 3.4,
      legR: Math.sin(p + Math.PI) * 3.4,
      lean: Math.sin(p) * 0.035,
    };
  }

  function drawChestnut(x, y, squash, slide, phase) {
    const w = walkPose(modeT, phase || 0);
    ctx.save();
    ctx.translate(x, y - (slide ? 0 : w.bob));
    const s = 0.8;
    if (slide) {
      ctx.rotate(-0.3);
      ctx.scale(s * 1.2, s * 0.48);
    } else {
      ctx.rotate(w.lean);
      ctx.scale(s, s * (1 - squash * 0.08));
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.fillStyle = "none";

    // 黄背包一笔
    ctx.beginPath();
    ctx.moveTo(11, -17); ctx.lineTo(16, -17); ctx.lineTo(16, -6); ctx.lineTo(11, -6);
    ctx.stroke();

    // 身 + 头 + 双耳：一笔连续
    ctx.beginPath();
    ctx.moveTo(-5, -7);
    ctx.quadraticCurveTo(-7, -16, -5, -22);
    ctx.quadraticCurveTo(-8, -29, -2, -27);
    ctx.quadraticCurveTo(1, -33, 5, -28);
    ctx.quadraticCurveTo(11, -28, 11, -20);
    ctx.quadraticCurveTo(12, -12, 8, -7);
    ctx.stroke();

    // 尾
    ctx.beginPath();
    ctx.moveTo(-5, -11);
    ctx.quadraticCurveTo(-13, -15, -11, -23);
    ctx.stroke();

    // 腿
    if (slide) {
      ctx.beginPath();
      ctx.moveTo(-3, -3); ctx.lineTo(-11, 0);
      ctx.moveTo(3, -3); ctx.lineTo(13, 0);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-2, -5); ctx.lineTo(-2 + w.legL, 0);
      ctx.moveTo(3, -5); ctx.lineTo(3 + w.legR, 0);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(0, -21, 0.85, 0, Math.PI * 2);
    ctx.arc(5, -21, 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawCloudy(x, y, squash, time, slide, phase) {
    const w = walkPose(time, phase != null ? phase : 1.3);
    ctx.save();
    ctx.translate(x, y - (slide ? 0 : w.bob));
    const s = 0.8;
    if (slide) { ctx.rotate(-0.26); ctx.scale(s * 1.2, s * 0.48); }
    else { ctx.rotate(w.lean); ctx.scale(s, s * (1 - squash * 0.08)); }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.fillStyle = "none";

    // 垂耳兔：一笔耳→头→身→耳
    ctx.beginPath();
    ctx.moveTo(-7, -12);
    ctx.quadraticCurveTo(-13, -4, -11, 3);
    ctx.quadraticCurveTo(-7, -1, -6, -11);
    ctx.quadraticCurveTo(-4, -24, 3, -25);
    ctx.quadraticCurveTo(9, -24, 10, -16);
    ctx.quadraticCurveTo(14, -8, 15, 1);
    ctx.quadraticCurveTo(12, -6, 9, -12);
    ctx.quadraticCurveTo(10, -5, 5, -3);
    ctx.stroke();

    if (slide) {
      ctx.beginPath();
      ctx.moveTo(-3, -2); ctx.lineTo(-11, 0);
      ctx.moveTo(4, -2); ctx.lineTo(12, 0);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-1, -3); ctx.lineTo(-1 + w.legL, 0);
      ctx.moveTo(3, -3); ctx.lineTo(3 + w.legR, 0);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(1, -17, 0.85, 0, Math.PI * 2);
    ctx.arc(6, -17, 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawKuro(x, y, squash, time, slide, phase) {
    const w = walkPose(time * 1.25, phase != null ? phase : 2.6);
    ctx.save();
    ctx.translate(x, y - (slide ? 0 : w.bob * 0.85));
    const s = 0.8;
    if (slide) { ctx.rotate(-0.26); ctx.scale(s * 1.16, s * 0.48); }
    else { ctx.rotate(w.lean); ctx.scale(s, s * (1 - squash * 0.08)); }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.fillStyle = "none";

    ctx.beginPath();
    ctx.arc(0, -10, 8.2, 0, Math.PI * 2);
    ctx.stroke();

    if (slide) {
      ctx.beginPath();
      ctx.moveTo(-2, -3); ctx.lineTo(-9, 0);
      ctx.moveTo(2, -3); ctx.lineTo(10, 0);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-2, -3); ctx.lineTo(-2 + w.legL, 0);
      ctx.moveTo(2, -3); ctx.lineTo(2 + w.legR, 0);
      ctx.stroke();
    }

    // 空心豆豆眼
    ctx.beginPath();
    ctx.arc(-2.4, -12, 1.35, 0, Math.PI * 2);
    ctx.arc(2.8, -12, 1.35, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawCampFire() {
    const fx = 110 - cameraX * 0.2;
    const fy = baseY;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#18181A";
    ctx.lineCap = "round";
    ctx.fillStyle = "none";

    // one-line logs
    ctx.beginPath();
    ctx.moveTo(-16, 0); ctx.lineTo(16, -3);
    ctx.moveTo(-12, -3); ctx.lineTo(12, 2);
    ctx.stroke();

    // one-line flame
    const fl = 1 + Math.sin(modeT * 5) * 0.08;
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.quadraticCurveTo(-10, -18, 0, -34 * fl);
    ctx.quadraticCurveTo(10, -18, 0, -6);
    ctx.stroke();
    ctx.restore();
  }

  function drawPlayerGroup() {
    const px = W * 0.22;
    const worldX = playerWorldX();
    const gy = terrainY(worldX) + playerY;
    const ang = Math.atan(tangentAt(worldX)) * 0.35;
    const isSlide = sliding > 0;
    const squash = jumping && playerY < -16 ? 0.2 : stumbleT > 0 ? 0.15 : 0;

    ctx.save();
    ctx.translate(px, gy);
    ctx.rotate(isSlide ? 0 : ang);

    if (isSlide) {
      drawChestnut(-20, 0, 0.1, true, 0);
      drawCloudy(0, 0, 0.1, modeT, true, 1.3);
      drawKuro(18, 0, 0.1, modeT, true, 2.6);
      ctx.strokeStyle = "rgba(24,24,26,0.22)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-34, 1); ctx.lineTo(-26, 0);
      ctx.moveTo(-32, 4); ctx.lineTo(-23, 3);
      ctx.stroke();
    } else {
      drawChestnut(-20, 0, squash, false, 0);
      drawCloudy(0, 0, squash, modeT, false, 1.3);
      drawKuro(18, 0, squash, modeT, false, 2.6);
    }
    ctx.restore();

    if (jumping && playerY < -8) {
      ctx.strokeStyle = "rgba(24,24,26,0.25)";
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(px - 10, gy + 4, 5, 0.2, Math.PI - 0.2);
      ctx.arc(px + 6, gy + 5, 7, 0.2, Math.PI - 0.2);
      ctx.stroke();
    }
    if (stumbleT > 0) {
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 + (1.4 - stumbleT) * 5;
        const sx = px + Math.cos(a) * 18;
        const sy = gy - 28 + Math.sin(a) * 8;
        ctx.strokeStyle = "#FFDE59";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(sx - 3, sy); ctx.lineTo(sx + 3, sy);
        ctx.moveTo(sx, sy - 3); ctx.lineTo(sx, sy + 3);
        ctx.stroke();
      }
    }
  }

  function collide() {
    if (mode !== "play" || stumbleT > 0) return;
    const wx = playerWorldX();
    const gy = terrainY(wx);
    const standH = sliding > 0 ? 12 : 28;
    const head = gy + playerY - standH;
    const feet = gy + playerY;

    for (const o of obstacles) {
      const dx = Math.abs(wx - o.x);
      if (dx > o.w) continue;
      const u = (wx - o.x) / o.w;

      if (o.type === "slide") {
        // 桥洞 / 山洞：站立会撞顶，滑行可通过
        const clearance = terrainY(o.x) - (o.low || 28);
        if (sliding <= 0 && head < clearance && Math.abs(u) < 0.85) { stun(); return; }
      } else if (o.type === "stone") {
        const top = terrainY(o.x) - (o.h || 16);
        if (feet > top + 4 && playerY > -(o.h || 16) * 0.6) { stun(); return; }
      } else if (o.type === "stream" || o.type === "mud" || o.type === "valley") {
        // 落在坑里
        if (Math.abs(u) < 0.65 && playerY > -4) { stun(); return; }
      }
    }
  }

  function stun() {
    stumbleT = 1.4;
    jumping = false; sliding = 0; playerY = 0; vy = 0;
    emitParticles(W * 0.22, terrainY(playerWorldX()) - 24, 5, true);
  }

  function doJump() {
    if (mode !== "play" || sliding > 0) return;
    if (jumping && playerY < -5) { jumpBuf = P.bufferJump; return; }
    if (coyote > 0 || playerY > -2) {
      vy = P.jumpV; jumping = true; jumpBuf = 0;
    } else jumpBuf = P.bufferJump;
  }

  function doSlide() {
    if (mode !== "play" || sliding > 0) return;
    sliding = P.slideDur;
  }

  function skipIntro() {
    if (mode === "play") return;
    mode = "play";
    modeT = 0;
    document.body.classList.remove("intro-lock");
    document.getElementById("intro-ui").classList.add("hidden");
    updateHint();
  }

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  let touchStart = null, lpTimer = 0;

  canvas.addEventListener("pointerdown", (e) => {
    if (e.button === 2) { e.preventDefault(); skipIntro(); doSlide(); return; }
    if (e.button !== 0) return;
    skipIntro();
    if (e.pointerType === "touch") {
      touchStart = { x: e.clientX, y: e.clientY, t: performance.now() };
      return;
    }
    lpTimer = window.setTimeout(() => { if (mode === "play") doSlide(); }, 200);
    doJump();
  });
  canvas.addEventListener("pointerup", (e) => {
    clearTimeout(lpTimer);
    if (!touchStart || e.pointerType !== "touch") return;
    const dx = e.clientX - touchStart.x;
    const dy = e.clientY - touchStart.y;
    const dt = performance.now() - touchStart.t;
    touchStart = null;
    if (dy > 36 && Math.abs(dx) < 50) doSlide();
    else if (dt < 320) doJump();
  });
  window.addEventListener("pointerup", () => clearTimeout(lpTimer));

  window.addEventListener("keydown", (e) => {
    if (e.code === "Escape") { skipIntro(); return; }
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault(); skipIntro(); doJump(); return;
    }
    if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyS" || e.code === "ArrowDown") {
      e.preventDefault(); skipIntro(); doSlide(); return;
    }
    if (mode === "camp" || mode === "depart") skipIntro();
  });

  document.getElementById("btn-skip").addEventListener("click", skipIntro);
  document.getElementById("btn-setout").addEventListener("click", skipIntro);
  document.getElementById("btn-redraw").addEventListener("click", () => {
    resetWorld((Math.random() * 1e9) | 0);
    emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 6, 8, true);
  });
  document.getElementById("btn-pause").addEventListener("click", () => {
    paused = !paused;
    window.__paused = paused;
    document.getElementById("btn-pause").textContent = paused ? t("hero.play") : t("hero.pause");
  });

  window.addEventListener("scroll", () => {
    if (mode === "camp" || mode === "depart") skipIntro();
  }, { passive: true });
  window.addEventListener("wheel", () => {
    if (mode === "camp" || mode === "depart") skipIntro();
  }, { passive: true });

  /* ── loop ── */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    modeT += dt;

    if (!paused) {
      if (mode === "camp") {
        // rest at camp; gentle reveal of camp objects
        revealByPen();
        if (modeT > 2.0) { mode = "depart"; modeT = 0; }
      } else if (mode === "depart") {
        cameraX += P.speed * 0.4 * dt;
        ensureWorld(cameraX + W + 200);
        revealByPen();
        if (rnd() < 0.4) emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 2, 1, false);
        if (modeT > 4.0) skipIntro();
      } else if (mode === "play" || mode === "await") {
        if (mode === "play") {
          cameraX += P.speed * dt;
          ensureWorld(cameraX + W * 1.3);
          revealByPen();

          if (jumpBuf > 0) {
            jumpBuf -= dt;
            if (playerY > -2) doJump();
          }
          if (sliding > 0) sliding -= dt;
          if (jumping || playerY < 0) {
            vy += P.gravity * dt;
            playerY += vy * dt;
            if (playerY >= 0) { playerY = 0; vy = 0; jumping = false; coyote = P.coyote; }
          } else coyote -= dt;

          if (stumbleT > 0) {
            stumbleT -= dt;
            if (stumbleT < 0.7) cameraX += P.speed * 0.3 * dt;
          }
          if (rnd() < dt * 4) emitParticles(W * 0.85, terrainY(cameraX + W * 0.85) - 2, 1, false);
          collide();
        } else {
          revealByPen();
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t > p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt;
    }

    baseY = H * 0.64;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, W, H);

    // soft clouds — 参考图小云朵
    ctx.strokeStyle = "rgba(24,24,26,0.2)";
    ctx.lineWidth = 1.1;
    ctx.lineCap = "round";
    ctx.fillStyle = "none";
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 210 - cameraX * 0.06) % (W + 200)) - 50;
      const cy = 42 + (i % 3) * 28;
      ctx.beginPath();
      ctx.arc(cx, cy, 8, Math.PI * 0.15, Math.PI * 0.85);
      ctx.arc(cx + 10, cy - 3, 7, Math.PI * 0.2, Math.PI * 0.8);
      ctx.arc(cx + 20, cy, 6, Math.PI * 0.25, Math.PI * 0.75);
      ctx.stroke();
    }

    // 云朵为天空原有；其余场景全部由笔描出（不画远山）
    if (cameraX < 480) drawCampFire();
    drawPath();
    drawObjects("back");
    drawPen();

    if (mode !== "camp") drawPlayerGroup();
    else {
      const gy = terrainY(210);
      drawChestnut(195, gy, 0, false, 0);
      drawCloudy(220, gy, 0, 0.3, false, 1.3);
      drawKuro(245, gy, 0, 0.3, false, 2.6);
    }
    // 前景遮挡：桥面/洞顶压在角色上（滑行穿越时的遮挡）
    drawObjects("front");
    drawParticles();

    requestAnimationFrame(frame);
  }

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      const rr = typeof r === "number" ? r : 3;
      this.moveTo(x + rr, y);
      this.arcTo(x + w, y, x + w, y + h, rr);
      this.arcTo(x + w, y + h, x, y + h, rr);
      this.arcTo(x, y + h, x, y, rr);
      this.arcTo(x, y, x + w, y, rr);
      this.closePath();
      return this;
    };
  }

  // boot
  resize();
  srand(seed);
  resetWorld(seed);
  applyI18n();

  const introUI = document.getElementById("intro-ui");
  if (reduceMotion) {
    introUI.classList.remove("hidden");
    document.getElementById("btn-skip").style.display = "none";
  } else {
    document.body.classList.add("intro-lock");
    introUI.classList.remove("hidden");
    document.getElementById("btn-setout").style.display = "none";
    document.getElementById("hero-hint").textContent = t("hero.skipping");
  }

  requestAnimationFrame(frame);
  window.__lucky = { resetWorld, skipIntro, get mode() { return mode; } };
})();
</script>
</body>
</html>
